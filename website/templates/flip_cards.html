<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>翻牌记录 · {{ site_title }}</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --panel-2: #f5f5f5;
      --panel-3: #e8e8e8;
      --line: #d9d9d9;
      --text: #1f2328;
      --muted: #667085;
      --faint: #667085;
      --teal: #078645;
      --green: #95ec69;
      --gold: #9a6700;
      --red: #d92d20;
      --blue: #1677c8;
      --ink: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", "PingFang SC", sans-serif;
      line-height: 1.45;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    #loginOverlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 24px;
    }

    #loginOverlay.hidden { display: none; }

    .login-box {
      width: min(360px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 16px 44px rgba(31, 35, 40, .1);
    }

    .login-box h1 { font-size: 20px; margin-bottom: 8px; }
    .login-box p { color: var(--muted); font-size: 14px; margin-bottom: 18px; }

    .login-box input {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--ink);
      color: var(--text);
      padding: 0 12px;
      outline: none;
    }

    .login-box input:focus { border-color: var(--teal); }

    .login-btn {
      width: 100%;
      min-height: 44px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: var(--teal);
      color: var(--ink);
      font-weight: 750;
    }

    .login-btn:disabled { cursor: wait; opacity: .72; }

    .login-error {
      display: none;
      margin-top: 10px;
      color: var(--red);
      font-size: 13px;
    }

    .login-error.show { display: block; }
    .login-error.status { color: var(--teal); }
    .login-error.success { color: var(--teal); }

    .page {
      display: none;
      height: 100vh;
      flex-direction: column;
    }

    .page.ready { display: flex; }

    .topbar {
      flex: 0 0 auto;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      z-index: 5;
    }

    .topline {
      padding: 14px 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .title h1 {
      font-size: 19px;
      font-weight: 720;
    }

    .title p {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .account-select {
      width: min(210px, 28vw);
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--ink);
      color: var(--text);
      padding: 0 30px 0 10px;
      outline: none;
    }

    .account-select:focus { border-color: var(--teal); }

    .action-btn {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      padding: 0 12px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .action-btn:hover { border-color: var(--teal); }

    .stats {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 20px 12px;
      scrollbar-width: none;
    }

    .stats::-webkit-scrollbar { display: none; }

    .stats span {
      flex: 0 0 auto;
      color: var(--muted);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      line-height: 1.35;
    }

    .filter-panel {
      border-top: 1px solid var(--line);
    }

    .filter-panel summary {
      min-height: 40px;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      list-style: none;
      user-select: none;
    }

    .filter-panel summary::-webkit-details-marker { display: none; }
    .filter-panel summary:hover { background: rgba(31, 35, 40, .035); }
    .filter-panel[open] summary { border-bottom: 1px solid var(--line); }

    .filter-title {
      color: var(--text);
      font-size: 13px;
      font-weight: 720;
      flex: 0 0 auto;
    }

    .filter-toggle-label {
      color: var(--teal);
      font-size: 12px;
      flex: 0 0 auto;
    }

    .filter-toggle-label::before { content: "展开"; }
    .filter-panel[open] .filter-toggle-label::before { content: "收起"; }

    .filters {
      padding: 12px 20px 14px;
      display: grid;
      grid-template-columns: repeat(3, minmax(150px, 220px)) auto;
      gap: 10px;
      align-items: end;
    }

    .field label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .field select {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--ink);
      color: var(--text);
      padding: 0 10px;
      outline: none;
    }

    .field select:focus { border-color: var(--teal); }

    .filter-summary {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      align-self: center;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1 1 auto;
    }

    .chat-shell {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #ededed;
    }

    .chat-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 16px max(14px, calc((100vw - 760px) / 2)) 72px;
      scroll-behavior: smooth;
    }

    .update-pill {
      position: absolute;
      left: 50%;
      bottom: 18px;
      z-index: 10;
      display: none;
      transform: translateX(-50%);
      border: 1px solid #d5d7da;
      border-radius: 999px;
      background: var(--panel);
      color: #576b95;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 720;
      white-space: nowrap;
      box-shadow: 0 5px 18px rgba(31, 35, 40, .16);
    }

    .update-pill.show { display: block; }
    .update-pill.has-update {
      border-color: #b9e4c9;
      color: #078645;
    }
    .update-pill:disabled { cursor: wait; opacity: .72; }

    .date-divider {
      width: fit-content;
      max-width: 100%;
      margin: 18px auto 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #6b7280;
      color: #ffffff;
      font-size: 12px;
      line-height: 1.3;
    }

    .message {
      display: flex;
      align-items: flex-start;
      margin-bottom: 7px;
    }

    .message.self { justify-content: flex-end; }
    .message.other { justify-content: flex-start; }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #576b95;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 720;
      font-size: 12px;
      flex: 0 0 auto;
      margin-right: 8px;
    }

    .bubble {
      max-width: min(78%, 560px);
      position: relative;
      border-radius: 4px;
      padding: 10px 14px;
      font-size: 14px;
      word-break: break-word;
      box-shadow: 0 1px 2px rgba(31, 35, 40, .08);
    }

    .self .bubble {
      background: var(--green);
      color: #1f2328;
    }

    .other .bubble {
      background: var(--panel);
      color: var(--text);
    }

    .self .bubble::after,
    .other .bubble::before {
      content: "";
      position: absolute;
      top: 13px;
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
    }

    .self .bubble::after {
      right: -7px;
      border-left: 8px solid var(--green);
    }

    .other .bubble::before {
      left: -7px;
      border-right: 8px solid var(--panel);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 6px;
    }

    .tag {
      display: inline-block;
      border-radius: 5px;
      padding: 2px 6px;
      font-size: 11px;
      line-height: 1.35;
      background: var(--panel-3);
      color: var(--muted);
    }

    .tag.cost { background: #fff1c7; color: var(--gold); }
    .tag.privacy { background: #eaf4ff; color: #2368a2; }
    .tag.kind { background: #e5f6f0; color: #167c69; }
    .tag.status-answered { background: #e8f2ff; color: #2266a3; }
    .tag.status-pending { background: #fff3cf; color: #8a5a00; }
    .tag.status-processing { background: #f0ebff; color: #6941a5; }
    .tag.status-refunded { background: #ffebed; color: #b42318; }
    .tag.status-other { background: var(--panel-3); color: var(--muted); }
    .status-link {
      border: 0;
      font: inherit;
      cursor: pointer;
    }
    .status-link:hover { filter: brightness(1.2); text-decoration: underline; }
    .time { color: var(--faint); font-size: 11px; }
    .self .time { color: #4f604b; }
    .text { white-space: pre-wrap; }

    .quote {
      width: 100%;
      margin-bottom: 8px;
      padding: 7px 9px 7px 10px;
      border: 0;
      border-left: 3px solid #b5bac1;
      border-radius: 2px;
      background: #f3f3f3;
      color: var(--muted);
      text-align: left;
    }

    .quote:hover { border-left-color: #576b95; background: #eeeeee; }
    .quote-title { display: block; font-size: 11px; color: #576b95; font-weight: 700; }
    .quote-time { display: block; margin-top: 2px; font-size: 11px; color: var(--faint); }
    .quote-text {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 4px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--text);
    }

    .media {
      margin-top: 5px;
    }

    .media audio {
      width: 270px;
      max-width: 100%;
    }

    .media video {
      width: min(320px, 100%);
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
    }

    .transcript {
      width: min(520px, 100%);
      margin-top: 10px;
      border-top: 1px solid #e4e6e8;
      padding-top: 9px;
    }

    .transcript-label {
      color: #576b95;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .transcript-text {
      color: #4b5563;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .download-link {
      display: inline-block;
      margin-top: 6px;
      color: var(--blue);
      font-size: 13px;
      text-decoration: none;
    }

    .download-link:hover { text-decoration: underline; }

    .empty, .load-error {
      margin: 48px auto;
      width: min(420px, calc(100% - 24px));
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    .account-modal {
      position: fixed;
      inset: 0;
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(31, 35, 40, .42);
    }

    .account-dialog {
      position: relative;
      width: min(430px, 100%);
      max-height: min(640px, calc(100vh - 36px));
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 22px;
      box-shadow: 0 20px 60px rgba(31, 35, 40, .22);
    }

    .account-dialog h2 { font-size: 18px; padding-right: 36px; }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 24px;
      line-height: 1;
    }

    .modal-close:hover { color: var(--text); }

    .update-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }

    .update-summary span {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--muted);
      padding: 4px 8px;
      font-size: 12px;
    }

    .account-state {
      min-height: 22px;
      margin: 10px 0 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .account-state.error { color: var(--red); }
    .account-state.success { color: var(--teal); }

    .account-form { display: grid; gap: 12px; }

    .account-form-row {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 8px;
    }

    .account-form label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .account-form input,
    .account-form select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--ink);
      color: var(--text);
      padding: 0 11px;
      outline: none;
    }

    .account-form input:focus,
    .account-form select:focus { border-color: var(--teal); }

    .account-submit {
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      background: var(--teal);
      color: var(--ink);
      font-weight: 750;
    }

    .account-submit:disabled { cursor: wait; opacity: .65; }

    .highlight .bubble {
      outline: 3px solid #ffd666;
      box-shadow: 0 0 0 7px rgba(255, 214, 102, .35), 0 0 26px rgba(255, 173, 51, .62);
      animation: target-pulse .8s ease-out 2;
    }

    @keyframes target-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.018); }
    }

    @media (prefers-reduced-motion: reduce) {
      .highlight .bubble { animation: none; }
    }

    @media (max-width: 720px) {
      .topline {
        padding: 11px 12px 9px;
        align-items: flex-start;
      }

      .title h1 { font-size: 17px; }
      .title p { font-size: 12px; }
      .actions { flex-wrap: wrap; justify-content: flex-end; }
      .action-btn { min-height: 32px; padding: 0 10px; }
      .account-select { width: min(180px, 48vw); min-height: 32px; }
      .stats { padding: 0 12px 9px; }
      .stats span { font-size: 11px; padding: 3px 7px; }
      .filter-panel summary { padding: 8px 12px; }
      .filters {
        padding: 10px 12px 12px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .filter-summary { text-align: left; }
      .filter-toggle-label { font-size: 11px; }
      .chat-scroll { padding: 12px 10px 70px; }
      .update-pill { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
      .avatar { width: 32px; height: 32px; font-size: 11px; margin-right: 7px; }
      .bubble { max-width: 84%; padding: 9px 11px; }
      .media audio { width: 230px; }
      .account-dialog { padding: 20px 16px; }
    }
  </style>
</head>
<body>
  <section id="loginOverlay">
    <form id="loginForm" class="login-box">
      <h1>翻牌记录</h1>
      <p>翻牌内容和本地音视频都需要密码验证。</p>
      <input id="passwordInput" type="password" autocomplete="current-password" placeholder="请输入访问密码" required>
      <button class="login-btn" type="submit" data-track="flip_cards_login_submit">验证并进入</button>
      <div id="loginError" class="login-error" role="alert"></div>
    </form>
  </section>

  <main id="page" class="page">
    <header class="topbar">
      <div class="topline">
        <div class="title">
          <h1>翻牌记录</h1>
          <p id="subtitle">正在载入</p>
        </div>
        <div class="actions">
          <select id="accountSelect" class="account-select" aria-label="翻牌账号"></select>
          <button id="manageAccountBtn" class="action-btn" type="button">账号管理</button>
          <button id="updateStatusBtn" class="action-btn" type="button" hidden>更新状态</button>
          <button id="logoutBtn" class="action-btn" type="button">退出</button>
        </div>
      </div>
      <div id="stats" class="stats"></div>
      <details id="filterPanel" class="filter-panel">
        <summary>
          <span class="filter-title">筛选</span>
          <span id="filterSummary" class="filter-summary">全部翻牌</span>
          <span class="filter-toggle-label" aria-hidden="true"></span>
        </summary>
        <div class="filters" role="group" aria-label="翻牌筛选">
          <div class="field">
            <label for="memberFilter">回复成员</label>
            <select id="memberFilter"></select>
          </div>
          <div class="field">
            <label for="statusFilter">翻牌状态</label>
            <select id="statusFilter">
              <option value="all">全部状态</option>
              <option value="answered">已翻牌</option>
              <option value="pending">未翻牌/翻牌中</option>
              <option value="refunded">已退款</option>
            </select>
          </div>
          <div class="field">
            <label for="typeFilter">回复类型</label>
            <select id="typeFilter">
              <option value="all">全部类型</option>
              <option value="audio">语音</option>
              <option value="text">文字</option>
              <option value="video">视频</option>
              <option value="none">无回复</option>
            </select>
          </div>
          <button id="resetBtn" class="action-btn" type="button">重置</button>
        </div>
      </details>
    </header>
    <section class="chat-shell">
      <button id="updatePill" class="update-pill" type="button" aria-live="polite">跳到最新</button>
      <div id="chatScroll" class="chat-scroll">
        <div id="messageList" class="message-list"></div>
      </div>
    </section>
  </main>

  <section id="accountModal" class="account-modal" hidden aria-modal="true" role="dialog" aria-labelledby="accountModalTitle">
    <div class="account-dialog">
      <button id="accountModalClose" class="modal-close" type="button" aria-label="关闭">&times;</button>
      <h2 id="accountModalTitle">登录口袋48账号</h2>
      <div id="accountState" class="account-state" role="status"></div>
      <form id="phoneForm" class="account-form" hidden>
        <div class="account-form-row">
          <label>地区
            <select id="phoneArea">
              <option value="86">+86</option>
              <option value="852">+852</option>
            </select>
          </label>
          <label>手机号
            <input id="phoneInput" type="tel" inputmode="numeric" autocomplete="tel" maxlength="20" required>
          </label>
        </div>
        <button class="account-submit" type="submit">发送验证码</button>
      </form>
      <form id="securityForm" class="account-form" hidden>
        <label><span id="securityQuestion">安全验证</span>
          <select id="securityOption" required></select>
        </label>
        <button class="account-submit" type="submit">提交并发送验证码</button>
      </form>
      <form id="codeForm" class="account-form" hidden>
        <label>短信验证码
          <input id="codeInput" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required>
        </label>
        <button class="account-submit" type="submit">登录并刷新翻牌</button>
      </form>
    </div>
  </section>

  <section id="updateModal" class="account-modal" hidden aria-modal="true" role="dialog" aria-labelledby="updateModalTitle">
    <div class="account-dialog">
      <button id="updateModalMinimize" class="modal-close" type="button" aria-label="收起更新状态" title="收起">&minus;</button>
      <h2 id="updateModalTitle">翻牌更新状态</h2>
      <div id="updateState" class="account-state" role="status">暂无刷新任务</div>
      <div id="updateSummary" class="update-summary" hidden></div>
    </div>
  </section>

  <script src="/static/js/tracker.js?v={{ static_version('js/tracker.js') }}"></script>
  <script>
    "use strict";

    const API = "/api/flip-cards";
    const loginOverlay = document.getElementById("loginOverlay");
    const loginForm = document.getElementById("loginForm");
    const passwordInput = document.getElementById("passwordInput");
    const loginError = document.getElementById("loginError");
    const loginSubmit = loginForm.querySelector('button[type="submit"]');
    const page = document.getElementById("page");
    const subtitle = document.getElementById("subtitle");
    const stats = document.getElementById("stats");
    const chatScroll = document.getElementById("chatScroll");
    const messageList = document.getElementById("messageList");
    const memberFilter = document.getElementById("memberFilter");
    const statusFilter = document.getElementById("statusFilter");
    const typeFilter = document.getElementById("typeFilter");
    const filterPanel = document.getElementById("filterPanel");
    const filterSummary = document.getElementById("filterSummary");
    const updatePill = document.getElementById("updatePill");
    const resetBtn = document.getElementById("resetBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const accountSelect = document.getElementById("accountSelect");
    const manageAccountBtn = document.getElementById("manageAccountBtn");
    const updateStatusBtn = document.getElementById("updateStatusBtn");
    const accountModal = document.getElementById("accountModal");
    const accountModalClose = document.getElementById("accountModalClose");
    const accountState = document.getElementById("accountState");
    const phoneForm = document.getElementById("phoneForm");
    const phoneArea = document.getElementById("phoneArea");
    const phoneInput = document.getElementById("phoneInput");
    const securityForm = document.getElementById("securityForm");
    const securityQuestion = document.getElementById("securityQuestion");
    const securityOption = document.getElementById("securityOption");
    const codeForm = document.getElementById("codeForm");
    const codeInput = document.getElementById("codeInput");
    const updateModal = document.getElementById("updateModal");
    const updateModalMinimize = document.getElementById("updateModalMinimize");
    const updateState = document.getElementById("updateState");
    const updateSummary = document.getElementById("updateSummary");
    const INITIAL_RENDER_RECORDS = 50;
    const RENDER_RECORD_BATCH = 50;

    let dataset = null;
    let records = [];
    let loginBusy = false;
    let loginVerified = false;
    let accountsManifest = { accounts: [], default_account_id: "" };
    let selectedAccountId = "";
    let accountSessionId = "";
    let accountBusy = false;
    let accountAdminEnabled = false;
    let loadedDatasetVersion = "";
    let datasetUpdateAvailable = false;
    let updateAvailableAccountId = "";
    let checkingDatasetUpdate = false;
    let datasetUpdateTimer = null;
    let activeJob = null;
    let pollingJobId = "";
    let renderedRecordLimit = INITIAL_RENDER_RECORDS;
    let loadingOlderRecords = false;

    function track(eventType, data) {
      if (!window._trackEvent) return;
      window._trackEvent(eventType, Object.assign({ area: "flip_cards" }, data || {}));
    }

    function showLogin(message) {
      loginBusy = false;
      loginVerified = false;
      loginOverlay.classList.remove("hidden");
      page.classList.remove("ready");
      stopDatasetUpdateTimer();
      accountModal.hidden = true;
      updateModal.hidden = true;
      updatePill.classList.remove("show");
      passwordInput.disabled = false;
      passwordInput.value = "";
      loginSubmit.disabled = false;
      loginSubmit.textContent = "验证并进入";
      loginError.textContent = message || "";
      loginError.classList.remove("status", "success");
      loginError.classList.toggle("show", Boolean(message));
      passwordInput.focus();
    }

    function setLoginFeedback(kind, message) {
      loginError.textContent = message;
      loginError.classList.add("show");
      loginError.classList.toggle("status", kind === "verifying");
      loginError.classList.toggle("success", kind === "loading" || kind === "retry");
      loginSubmit.disabled = kind === "verifying" || kind === "loading";
      passwordInput.disabled = kind === "verifying" || kind === "loading" || kind === "retry";
      loginSubmit.textContent = kind === "verifying"
        ? "正在验证…"
        : (kind === "loading" ? "正在加载…" : (kind === "retry" ? "重试加载" : "验证并进入"));
    }

    function showLoginLoadRetry(message) {
      loginBusy = false;
      loginVerified = true;
      setLoginFeedback("retry", message || "密码正确，但翻牌记录加载失败，请点击重试加载");
    }

    function showPage() {
      loginBusy = false;
      loginOverlay.classList.add("hidden");
      page.classList.add("ready");
    }

    function setAccountState(message, kind) {
      accountState.textContent = message || "";
      accountState.classList.toggle("error", kind === "error");
      accountState.classList.toggle("success", kind === "success");
    }

    function setUpdateState(message, kind) {
      updateState.textContent = message || "暂无刷新任务";
      updateState.classList.toggle("error", kind === "error");
      updateState.classList.toggle("success", kind === "success");
    }

    function renderUpdateSummary(summary) {
      updateSummary.textContent = "";
      const data = summary && typeof summary === "object" ? summary : null;
      updateSummary.hidden = !data;
      if (!data) return;
      [
        "共 " + formatNumber(data.total) + " 条",
        "已回复 " + formatNumber(data.answered) + " 条",
        "等待 " + formatNumber(data.pending) + " 条",
        "退款 " + formatNumber(data.refunded) + " 条",
        "已转录 " + formatNumber(data.transcribed) + " 条"
      ].forEach(function (text) {
        const item = document.createElement("span");
        item.textContent = text;
        updateSummary.appendChild(item);
      });
    }

    function setAccountForms(step) {
      phoneForm.hidden = step !== "phone";
      securityForm.hidden = step !== "security";
      codeForm.hidden = step !== "code";
    }

    function setAccountBusy(value) {
      accountBusy = value;
      accountModal.querySelectorAll("button, input, select").forEach(function (node) {
        if (node !== accountModalClose) node.disabled = value;
      });
    }

    function accountLabel(account) {
      const nickname = String(account.nickname || "").trim();
      return nickname ? nickname + " · " + account.id : account.id;
    }

    function renderAccountSelect() {
      const accounts = Array.isArray(accountsManifest.accounts) ? accountsManifest.accounts : [];
      accountSelect.textContent = "";
      if (!accounts.length) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "默认账号";
        accountSelect.appendChild(option);
        accountSelect.disabled = true;
        selectedAccountId = "";
        return;
      }
      accounts.forEach(function (account) {
        const option = document.createElement("option");
        option.value = account.id;
        option.textContent = accountLabel(account);
        accountSelect.appendChild(option);
      });
      const stored = window.localStorage.getItem("flip_cards_account_id") || "";
      const validIds = accounts.map(function (account) { return account.id; });
      selectedAccountId = validIds.includes(selectedAccountId)
        ? selectedAccountId
        : (validIds.includes(stored) ? stored : accountsManifest.default_account_id || validIds[0]);
      accountSelect.value = selectedAccountId;
      accountSelect.disabled = false;
    }

    async function apiJson(path, options) {
      const response = await fetch(API + path, Object.assign({
        credentials: "same-origin",
        cache: "no-store"
      }, options || {}));
      let body = {};
      try { body = await response.json(); } catch (_) {}
      if (!response.ok) {
        const error = new Error(body.detail || "请求失败");
        error.status = response.status;
        throw error;
      }
      return body;
    }

    function formatNumber(value) {
      return Number(value || 0).toLocaleString("zh-CN");
    }

    function dateKey(ts) {
      if (!ts) return "";
      const date = new Date(Number(ts));
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + d;
    }

    function dateLabel(ts) {
      const key = dateKey(ts);
      return key ? key.replace("-", "年").replace("-", "月") + "日" : "";
    }

    function compactText(text, limit) {
      const value = String(text || "").replace(/\s+/g, " ").trim();
      if (value.length <= limit) return value;
      return value.slice(0, limit - 1) + "...";
    }

    function mediaDuration(record) {
      if (!record.duration_text) return record.answer_type_label || "";
      return (record.answer_type_label || "") + " · " + record.duration_text;
    }

    function memberDisplayName(value) {
      const member = String(value || "偶像").trim();
      return member.split("-").pop().trim() || "偶像";
    }

    function memberAvatarText(record) {
      const configured = String((record && record.member_avatar_text) || "").trim();
      if (configured) return configured;
      const member = String((record && record.member_name) || (dataset && dataset.member) || "偶像").trim();
      if (member.includes("嘉仪")) return "嘉仪";
      return memberDisplayName(member);
    }

    function recordMemberKey(record) {
      return String(record.member_key || record.member_id || record.member_name || "");
    }

    function renderMemberFilter(preserveSelection) {
      const previous = preserveSelection ? memberFilter.value : "";
      let members = Array.isArray(dataset.members) ? dataset.members.slice() : [];
      if (!members.length) {
        const seen = new Map();
        records.forEach(function (record) {
          const key = recordMemberKey(record);
          if (!key || seen.has(key)) return;
          seen.set(key, {
            key: key,
            name: record.member_name || dataset.member || "偶像",
            record_count: 0
          });
        });
        records.forEach(function (record) {
          const item = seen.get(recordMemberKey(record));
          if (item) item.record_count += 1;
        });
        members = Array.from(seen.values());
      }
      memberFilter.textContent = "";
      const allOption = document.createElement("option");
      allOption.value = "all";
      allOption.textContent = "全部成员";
      memberFilter.appendChild(allOption);
      members.forEach(function (member) {
        const option = document.createElement("option");
        option.value = String(member.key || member.id || member.name || "");
        option.textContent = memberDisplayName(member.name) + "（" + formatNumber(member.record_count) + "）";
        memberFilter.appendChild(option);
      });
      const values = members.map(function (member) {
        return String(member.key || member.id || member.name || "");
      });
      const jiayi = members.find(function (member) {
        return String(member.name || "").includes("陈嘉仪");
      });
      const defaultKey = String((jiayi && (jiayi.key || jiayi.id || jiayi.name)) || dataset.default_member_key || "all");
      memberFilter.value = previous === "all" || values.includes(previous)
        ? previous
        : (values.includes(defaultKey) ? defaultKey : "all");
    }

    function recordMatches(record) {
      return (memberFilter.value === "all" || recordMemberKey(record) === memberFilter.value)
        && (statusFilter.value === "all" || record.status === statusFilter.value)
        && (typeFilter.value === "all" || record.answer_type === typeFilter.value);
    }

    function matchingRecordsChronologically() {
      return records.filter(recordMatches).slice().sort(function (a, b) {
        const timeDifference = Number(a.qtime || 0) - Number(b.qtime || 0);
        if (timeDifference) return timeDifference;
        return String(a.question_id || "").localeCompare(String(b.question_id || ""));
      });
    }

    function recordsForCurrentRender(matchingRecords) {
      const start = Math.max(0, matchingRecords.length - renderedRecordLimit);
      return matchingRecords.slice(start);
    }

    function setChatScrollTopImmediately(value) {
      const previousBehavior = chatScroll.style.scrollBehavior;
      chatScroll.style.scrollBehavior = "auto";
      chatScroll.scrollTop = value;
      chatScroll.style.scrollBehavior = previousBehavior;
    }

    function resetProgressiveRender() {
      renderedRecordLimit = INITIAL_RENDER_RECORDS;
      loadingOlderRecords = false;
    }

    function filterTrackPayload(action) {
      const visibleRecords = records.filter(recordMatches);
      const visibleIds = new Set(visibleRecords.map(function (record) { return record.question_id; }));
      const visibleEventCount = buildEvents().filter(function (event) {
        return visibleIds.has(event.record.question_id);
      }).length;
      return {
        action: action,
        member_key: memberFilter.value,
        status: statusFilter.value,
        answer_type: typeFilter.value,
        visible_record_count: visibleRecords.length,
        rendered_record_count: Math.min(renderedRecordLimit, visibleRecords.length),
        visible_event_count: visibleEventCount
      };
    }

    function recordForNode(node) {
      const message = node && node.closest ? node.closest(".message") : null;
      const questionId = message ? String(message.dataset.qid || "") : "";
      return records.find(function (record) {
        return String(record.question_id || "") === questionId;
      }) || null;
    }

    function mediaTrackPayload(action, mediaNode) {
      const record = recordForNode(mediaNode);
      const position = Number(mediaNode && mediaNode.currentTime);
      const duration = Number(mediaNode && mediaNode.duration);
      return {
        action: action,
        question_id: record ? record.question_id : "",
        media_type: mediaNode && mediaNode.tagName ? mediaNode.tagName.toLowerCase() : "",
        position_seconds: Number.isFinite(position) ? Math.floor(position) : 0,
        duration_seconds: Number.isFinite(duration) ? Math.floor(duration) : 0
      };
    }

    function renderStats() {
      const summary = dataset.summary || {};
      const totalCost = Number(summary.answered_cost || 0) + Number(summary.pending_cost || 0);
      const items = [
        "共 " + formatNumber(summary.total) + " 条翻牌",
        "已翻牌 " + formatNumber(summary.answered) + " 条（" + formatNumber(summary.answered_cost) + " 鸡腿）",
        "未翻牌 " + formatNumber(summary.pending) + " 条（" + formatNumber(summary.pending_cost) + " 鸡腿）",
        "已退款 " + formatNumber(summary.refunded) + " 条（" + formatNumber(summary.refunded_cost) + " 鸡腿）",
        "总计 " + formatNumber(totalCost) + " 鸡腿"
      ];
      stats.textContent = "";
      items.forEach(function (item) {
        const span = document.createElement("span");
        span.textContent = item;
        stats.appendChild(span);
      });
      subtitle.textContent = "与 " + (dataset.member || "偶像") + " 的对话";
    }

    function buildEvents() {
      const events = [];
      records.forEach(function (record, index) {
        events.push({ type: "question", time: Number(record.qtime || 0), order: 0, index, record });
        if (record.status === "answered") {
          events.push({
            type: "answer",
            time: Number(record.answer_time || record.qtime || 0),
            order: 1,
            index,
            record
          });
        }
      });
      events.sort(function (a, b) {
        if (a.time !== b.time) return a.time - b.time;
        if (a.order !== b.order) return a.order - b.order;
        return a.index - b.index;
      });
      return events;
    }

    function appendText(parent, className, text) {
      const node = document.createElement("div");
      node.className = className;
      node.textContent = text || "";
      parent.appendChild(node);
      return node;
    }

    function addTag(parent, className, text) {
      const span = document.createElement("span");
      span.className = "tag " + (className || "");
      span.textContent = text || "";
      parent.appendChild(span);
      return span;
    }

    function addQuestionStatus(parent, record) {
      if (record.status === "answered") {
        const statusButton = document.createElement("button");
        statusButton.type = "button";
        statusButton.className = "tag status-answered status-link";
        statusButton.dataset.target = "answer-" + safeId(record.question_id);
        statusButton.textContent = "已回复 · 查看回复";
        statusButton.setAttribute("aria-label", "跳转到这条翻牌的回复");
        parent.appendChild(statusButton);
        return;
      }
      if (record.status === "pending") {
        const processing = record.status_label === "翻牌中";
        addTag(parent, processing ? "status-processing" : "status-pending", processing ? "翻牌处理中" : "等待回复中");
        return;
      }
      if (record.status === "refunded") {
        addTag(parent, "status-refunded", "已退款");
        return;
      }
      addTag(parent, "status-other", record.status_label || "状态未知");
    }

    function createQuestion(event) {
      const record = event.record;
      const wrap = document.createElement("article");
      wrap.id = "question-" + safeId(record.question_id);
      wrap.className = "message self";
      wrap.dataset.qid = record.question_id || "";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      const meta = document.createElement("div");
      meta.className = "meta";
      addTag(meta, "cost", formatNumber(record.cost) + " 鸡腿");
      if (record.privacy_label) addTag(meta, "privacy", record.privacy_label);
      addQuestionStatus(meta, record);
      const time = document.createElement("span");
      time.className = "time";
      time.textContent = record.qtime_text || "";
      meta.appendChild(time);
      bubble.appendChild(meta);
      appendText(bubble, "text", record.content || "");
      wrap.appendChild(bubble);
      return wrap;
    }

    function createAnswer(event) {
      const record = event.record;
      const wrap = document.createElement("article");
      wrap.id = "answer-" + safeId(record.question_id);
      wrap.className = "message other";
      wrap.dataset.qid = record.question_id || "";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      const avatarText = memberAvatarText(record);
      avatar.textContent = avatarText;
      avatar.style.fontSize = Math.max(8, 12 - Math.max(0, Array.from(avatarText).length - 2) * 2) + "px";
      avatar.title = memberDisplayName(record.member_name || dataset.member || "偶像");
      wrap.appendChild(avatar);

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const quote = document.createElement("button");
      quote.className = "quote";
      quote.type = "button";
      quote.dataset.target = "question-" + safeId(record.question_id);
      appendText(quote, "quote-title", "回复我的提问");
      appendText(quote, "quote-time", "我发于 " + (record.qtime_text || ""));
      appendText(quote, "quote-text", compactText(record.content || "", 96));
      bubble.appendChild(quote);

      const meta = document.createElement("div");
      meta.className = "meta";
      addTag(meta, "kind", mediaDuration(record));
      const time = document.createElement("span");
      time.className = "time";
      time.textContent = record.answer_time_text || "";
      meta.appendChild(time);
      bubble.appendChild(meta);

      if (record.answer_type === "text") {
        appendText(bubble, "text", record.answer_text || "");
      } else if (record.answer_type === "audio" || record.answer_type === "video") {
        bubble.appendChild(createMedia(record));
      } else {
        appendText(bubble, "text", "[媒体不可用]");
      }
      wrap.appendChild(bubble);
      return wrap;
    }

    function createMedia(record) {
      const box = document.createElement("div");
      box.className = "media";
      const media = record.media || {};
      if (media.url) {
        if (record.answer_type === "audio") {
          const audio = document.createElement("audio");
          audio.controls = true;
          audio.preload = "none";
          audio.src = media.url;
          box.appendChild(audio);
          const transcript = createAudioTranscriptNode(record.audio_transcript);
          if (transcript) box.appendChild(transcript);
        } else {
          const video = document.createElement("video");
          video.controls = true;
          video.preload = "metadata";
          video.src = media.url;
          box.appendChild(video);
        }
      } else {
        appendText(box, "text", "[媒体不可用]");
      }
      if (media.official_url) {
        const link = document.createElement("a");
        link.className = "download-link";
        link.href = media.official_url;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = "官方下载";
        box.appendChild(link);
      }
      return box;
    }

    function createAudioTranscriptNode(transcript) {
      const value = String((transcript && transcript.text) || "").trim();
      if (!value) return null;
      const box = document.createElement("div");
      box.className = "transcript";
      appendText(box, "transcript-label", "转录参考");
      appendText(box, "transcript-text", value);
      return box;
    }

    function safeId(value) {
      return String(value || "unknown").replace(/[^0-9A-Za-z_-]+/g, "-") || "unknown";
    }

    function renderTimeline(scrollBottom, preserveScrollPosition) {
      const previousScrollHeight = preserveScrollPosition ? chatScroll.scrollHeight : 0;
      const previousScrollTop = preserveScrollPosition ? chatScroll.scrollTop : 0;
      const matchingRecords = matchingRecordsChronologically();
      const renderedRecords = recordsForCurrentRender(matchingRecords);
      const visibleIds = new Set(renderedRecords.map(function (record) { return record.question_id; }));
      const events = buildEvents().filter(function (event) {
        return visibleIds.has(event.record.question_id);
      });

      messageList.textContent = "";
      if (!events.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "没有符合筛选条件的翻牌";
        messageList.appendChild(empty);
      } else {
        const frag = document.createDocumentFragment();
        let lastDate = "";
        events.forEach(function (event) {
          const currentDate = dateKey(event.time);
          if (currentDate && currentDate !== lastDate) {
            const divider = document.createElement("div");
            divider.className = "date-divider";
            divider.textContent = dateLabel(event.time);
            frag.appendChild(divider);
            lastDate = currentDate;
          }
          if (event.type === "question") frag.appendChild(createQuestion(event));
          if (event.type === "answer") frag.appendChild(createAnswer(event));
        });
        messageList.appendChild(frag);
      }
      filterSummary.textContent = renderedRecords.length < matchingRecords.length
        ? "已加载最新 " + formatNumber(renderedRecords.length) + " / " + formatNumber(matchingRecords.length) + " 条翻牌"
        : "显示 " + formatNumber(matchingRecords.length) + " / " + formatNumber(records.length) + " 条翻牌，" + formatNumber(events.length) + " 条消息";
      const selectedMember = memberFilter.options[memberFilter.selectedIndex];
      subtitle.textContent = memberFilter.value === "all"
        ? "与全部成员的对话"
        : "与 " + String((selectedMember && selectedMember.textContent) || dataset.member || "偶像").replace(/（[\d,]+）$/, "") + " 的对话";
      if (scrollBottom) {
        requestAnimationFrame(function () {
          setChatScrollTopImmediately(chatScroll.scrollHeight);
          syncUpdatePill();
        });
      } else if (preserveScrollPosition) {
        requestAnimationFrame(function () {
          const addedHeight = Math.max(0, chatScroll.scrollHeight - previousScrollHeight);
          setChatScrollTopImmediately(previousScrollTop + addedHeight);
          loadingOlderRecords = false;
          syncUpdatePill();
        });
      } else {
        syncUpdatePill();
      }
    }

    function loadOlderRecordsIfNeeded() {
      if (loadingOlderRecords || chatScroll.scrollTop > 160) return;
      const matchingCount = matchingRecordsChronologically().length;
      if (renderedRecordLimit >= matchingCount) return;
      loadingOlderRecords = true;
      renderedRecordLimit = Math.min(matchingCount, renderedRecordLimit + RENDER_RECORD_BATCH);
      renderTimeline(false, true);
      track("admin_filter", Object.assign(filterTrackPayload("load_older_records"), {
        rendered_record_count: renderedRecordLimit
      }));
    }

    async function loadAccounts() {
      accountsManifest = await apiJson("/accounts");
      renderAccountSelect();
    }

    function selectedAccountSuffix() {
      return selectedAccountId ? "?account_id=" + encodeURIComponent(selectedAccountId) : "";
    }

    async function loadSelectedAccount(scrollBottom, preserveMember) {
      const status = await apiJson("/status" + selectedAccountSuffix());
      if (!status.dataset_exists) throw new Error("翻牌应用数据尚未生成");
      const suffix = selectedAccountId ? "?account_id=" + encodeURIComponent(selectedAccountId) : "";
      dataset = await apiJson("/data" + suffix);
      records = Array.isArray(dataset.records) ? dataset.records : [];
      loadedDatasetVersion = status.dataset_version || "";
      datasetUpdateAvailable = false;
      updateAvailableAccountId = "";
      resetProgressiveRender();
      renderMemberFilter(Boolean(preserveMember));
      renderStats();
      renderTimeline(scrollBottom);
    }

    function isNearBottom() {
      return chatScroll.scrollHeight - chatScroll.scrollTop - chatScroll.clientHeight < 140;
    }

    function shouldShowUpdatePill() {
      return page.classList.contains("ready")
        && (datasetUpdateAvailable || !isNearBottom());
    }

    function syncUpdatePill() {
      updatePill.textContent = datasetUpdateAvailable ? "有新记录，点击查看最新" : "跳到最新";
      updatePill.classList.toggle("show", shouldShowUpdatePill());
      updatePill.classList.toggle("has-update", datasetUpdateAvailable);
    }

    function stopDatasetUpdateTimer() {
      if (!datasetUpdateTimer) return;
      window.clearInterval(datasetUpdateTimer);
      datasetUpdateTimer = null;
    }

    function resetDatasetUpdateTimer() {
      stopDatasetUpdateTimer();
      datasetUpdateTimer = window.setInterval(checkDatasetUpdates, 15000);
    }

    async function checkDatasetUpdates() {
      if (checkingDatasetUpdate || !page.classList.contains("ready")) return;
      checkingDatasetUpdate = true;
      try {
        const status = await apiJson("/status" + selectedAccountSuffix());
        if (status.dataset_version && loadedDatasetVersion && status.dataset_version !== loadedDatasetVersion) {
          datasetUpdateAvailable = true;
          updateAvailableAccountId = selectedAccountId;
          syncUpdatePill();
        }
      } catch (_) {
        return;
      } finally {
        checkingDatasetUpdate = false;
      }
    }

    async function loadLatestRecords() {
      if (updatePill.disabled) return;
      let failed = false;
      updatePill.disabled = true;
      updatePill.classList.add("show");
      updatePill.textContent = "正在加载最新记录...";
      try {
        if (updateAvailableAccountId) {
          selectedAccountId = updateAvailableAccountId;
          window.localStorage.setItem("flip_cards_account_id", selectedAccountId);
        }
        await loadAccounts();
        await loadSelectedAccount(true, true);
        track("admin_filter", filterTrackPayload("load_latest"));
      } catch (error) {
        failed = true;
        updatePill.textContent = error.message || "加载最新记录失败";
        window.setTimeout(syncUpdatePill, 2200);
      } finally {
        updatePill.disabled = false;
        resetDatasetUpdateTimer();
        if (!failed) syncUpdatePill();
      }
    }

    function jumpToLatestLoadedRecord() {
      chatScroll.scrollTo({ top: chatScroll.scrollHeight, behavior: "smooth" });
      track("admin_filter", filterTrackPayload("jump_latest"));
    }

    function handleUpdatePillClick() {
      if (datasetUpdateAvailable) {
        loadLatestRecords();
        return;
      }
      jumpToLatestLoadedRecord();
    }

    async function loadApp() {
      await loadAccounts();
      await loadSelectedAccount(true, false);
      showPage();
      resetDatasetUpdateTimer();
      initializeAccountManagement();
      track("admin_modal", { action: "view_flip_cards_app", record_count: records.length });
    }

    async function openAccountModal() {
      accountModal.hidden = false;
      accountSessionId = "";
      setAccountForms("");
      setAccountState("正在检查账号管理状态");
      setAccountBusy(true);
      try {
        const capability = await apiJson("/account-management/status");
        accountAdminEnabled = Boolean(capability.enabled);
        updateStatusBtn.hidden = !accountAdminEnabled;
        if (!capability.enabled) {
          setAccountState(capability.message || "当前节点不开放账号操作");
          return;
        }
        setAccountForms("phone");
        setAccountState("");
        phoneInput.focus();
      } catch (error) {
        setAccountState(error.message || "无法读取账号管理状态", "error");
      } finally {
        setAccountBusy(false);
      }
      track("admin_modal", { action: "open_flip_account_login" });
    }

    function rememberActiveJob(job) {
      activeJob = job && job.job_id ? job : null;
      if (!activeJob) {
        window.localStorage.removeItem("flip_cards_refresh_job_id");
        window.localStorage.removeItem("flip_cards_refresh_account_id");
        return;
      }
      window.localStorage.setItem("flip_cards_refresh_job_id", activeJob.job_id);
      window.localStorage.setItem("flip_cards_refresh_account_id", activeJob.account_id || "");
    }

    function renderActiveJob(job) {
      if (!job || !job.job_id) {
        rememberActiveJob(null);
        setUpdateState("暂无刷新任务");
        renderUpdateSummary(null);
        updateStatusBtn.textContent = "更新状态";
        return;
      }
      rememberActiveJob(job);
      renderUpdateSummary(job.summary);
      if (job.state === "completed") {
        setUpdateState(job.message || "翻牌记录已更新", "success");
        updateStatusBtn.textContent = "更新完成";
      } else if (job.state === "failed") {
        setUpdateState(job.message || "翻牌记录刷新失败", "error");
        updateStatusBtn.textContent = "更新失败";
      } else {
        setUpdateState(job.stage || "正在刷新翻牌记录");
        updateStatusBtn.textContent = "更新中";
      }
    }

    async function fetchLatestJob(accountId) {
      if (!accountAdminEnabled || !accountId) return null;
      const result = await apiJson(
        "/account-management/latest-job?account_id=" + encodeURIComponent(accountId)
      );
      return result.job || null;
    }

    function pollRefreshJob(jobId, accountId) {
      if (!jobId || pollingJobId === jobId) return;
      pollingJobId = jobId;
      (async function () {
        try {
          for (let attempt = 0; attempt < 1800; attempt += 1) {
            const result = await apiJson("/account-management/jobs/" + encodeURIComponent(jobId));
            const job = result.job || {};
            renderActiveJob(job);
            if (job.state === "completed") {
              datasetUpdateAvailable = true;
              updateAvailableAccountId = accountId || job.account_id || "";
              syncUpdatePill();
              return;
            }
            if (job.state === "failed") return;
            await new Promise(function (resolve) { window.setTimeout(resolve, 2000); });
          }
          setUpdateState("刷新任务仍在运行，请稍后再查看", "error");
        } catch (error) {
          setUpdateState(error.message || "无法读取刷新状态", "error");
          updateStatusBtn.textContent = "状态异常";
        } finally {
          if (pollingJobId === jobId) pollingJobId = "";
        }
      }());
    }

    async function initializeAccountManagement() {
      try {
        const capability = await apiJson("/account-management/status");
        accountAdminEnabled = Boolean(capability.enabled);
        updateStatusBtn.hidden = !accountAdminEnabled;
        if (!accountAdminEnabled) return;
        let job = null;
        const storedJobId = window.localStorage.getItem("flip_cards_refresh_job_id") || "";
        if (storedJobId) {
          try {
            const result = await apiJson("/account-management/jobs/" + encodeURIComponent(storedJobId));
            job = result.job || null;
          } catch (_) {
            rememberActiveJob(null);
          }
        }
        if (!job) job = await fetchLatestJob(selectedAccountId);
        renderActiveJob(job);
        if (job && job.state !== "completed" && job.state !== "failed") {
          pollRefreshJob(job.job_id, job.account_id || selectedAccountId);
        }
      } catch (_) {
        updateStatusBtn.hidden = true;
      }
    }

    async function openUpdateModal() {
      updateModal.hidden = false;
      track("admin_modal", { action: "open_flip_update_status" });
      if (activeJob) {
        renderActiveJob(activeJob);
        if (activeJob.state !== "completed" && activeJob.state !== "failed") {
          pollRefreshJob(activeJob.job_id, activeJob.account_id || selectedAccountId);
        }
        return;
      }
      setUpdateState("正在读取更新状态");
      try {
        const job = await fetchLatestJob(selectedAccountId);
        renderActiveJob(job);
        if (job && job.state !== "completed" && job.state !== "failed") {
          pollRefreshJob(job.job_id, job.account_id || selectedAccountId);
        }
      } catch (error) {
        setUpdateState(error.message || "无法读取更新状态", "error");
      }
    }

    async function openIfReady() {
      try {
        await loadApp();
        track("login_attempt", { action: "reuse_cookie", result: "success" });
      } catch (error) {
        if (error.status === 401 || error.status === 403) {
          showLogin("");
          return;
        }
        showLogin(error.message || "无法载入翻牌记录");
      }
    }

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      if (loginBusy) return;
      let password = "";
      if (!loginVerified) {
        password = passwordInput.value;
        if (!password) return;
        track("login_attempt", { action: "submit", result: "submitted" });
      }
      loginBusy = true;
      if (!loginVerified) {
        setLoginFeedback("verifying", "正在验证密码…");
        try {
          await apiJson("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password })
          });
          loginVerified = true;
          track("login_attempt", { action: "submit", result: "success" });
        } catch (error) {
          track("login_attempt", { action: "submit", result: "failure", status: error.status || 0 });
          showLogin(error.message || "密码错误");
          return;
        }
        passwordInput.value = "";
      }
      setLoginFeedback("loading", "密码正确，正在加载翻牌记录…");
      try {
        await loadApp();
      } catch (error) {
        if (error.status === 401 || error.status === 403) showLogin("登录已失效，请重新输入密码");
        else showLoginLoadRetry("密码正确，但翻牌记录加载失败：" + (error.message || "请稍后重试"));
      }
    });

    [memberFilter, statusFilter, typeFilter].forEach(function (control) {
      control.addEventListener("change", function () {
        resetProgressiveRender();
        renderTimeline(true);
        track("admin_filter", filterTrackPayload(
          control === memberFilter
            ? "filter_member"
            : (control === statusFilter ? "filter_status" : "filter_answer_type")
        ));
      });
    });

    accountSelect.addEventListener("change", async function () {
      selectedAccountId = accountSelect.value;
      window.localStorage.setItem("flip_cards_account_id", selectedAccountId);
      accountSelect.disabled = true;
      try {
        await loadSelectedAccount(true, false);
        if (accountAdminEnabled && (!activeJob || activeJob.state === "completed" || activeJob.state === "failed")) {
          renderActiveJob(await fetchLatestJob(selectedAccountId));
        }
        track("admin_filter", { action: "switch_flip_account", account_id: selectedAccountId });
      } catch (error) {
        messageList.textContent = error.message || "账号翻牌记录加载失败";
      } finally {
        accountSelect.disabled = false;
      }
    });

    manageAccountBtn.addEventListener("click", openAccountModal);
    updateStatusBtn.addEventListener("click", openUpdateModal);
    accountModalClose.addEventListener("click", function () { accountModal.hidden = true; });
    accountModal.addEventListener("click", function (event) {
      if (event.target === accountModal && !accountBusy) accountModal.hidden = true;
    });
    updateModalMinimize.addEventListener("click", function () { updateModal.hidden = true; });
    updateModal.addEventListener("click", function (event) {
      if (event.target === updateModal) updateModal.hidden = true;
    });

    phoneForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      if (accountBusy) return;
      setAccountBusy(true);
      setAccountState("正在发送验证码");
      try {
        const result = await apiJson("/account-management/send-sms", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone: phoneInput.value, area: phoneArea.value })
        });
        accountSessionId = result.session_id;
        if (result.state === "awaiting_security") {
          securityQuestion.textContent = result.question || "安全验证";
          securityOption.textContent = "";
          (result.options || []).forEach(function (item) {
            const option = document.createElement("option");
            option.value = item.option;
            option.textContent = item.value;
            securityOption.appendChild(option);
          });
          setAccountForms("security");
          setAccountState("请完成安全验证");
        } else {
          setAccountForms("code");
          setAccountState("验证码已发送至 " + result.phone_masked);
          codeInput.focus();
        }
      } catch (error) {
        setAccountState(error.message || "验证码发送失败", "error");
      } finally {
        setAccountBusy(false);
      }
    });

    securityForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      if (accountBusy) return;
      setAccountBusy(true);
      setAccountState("正在提交安全验证");
      try {
        const result = await apiJson("/account-management/security-answer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: accountSessionId, option: securityOption.value })
        });
        setAccountForms("code");
        setAccountState("验证码已发送至 " + result.phone_masked);
        codeInput.focus();
      } catch (error) {
        setAccountState(error.message || "安全验证失败", "error");
      } finally {
        setAccountBusy(false);
      }
    });

    codeForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      if (accountBusy) return;
      setAccountBusy(true);
      setAccountState("正在登录口袋48");
      try {
        const result = await apiJson("/account-management/verify-code", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: accountSessionId, code: codeInput.value })
        });
        codeInput.value = "";
        setAccountForms("");
        setAccountBusy(false);
        accountModal.hidden = true;
        const job = {
          job_id: result.job_id,
          account_id: result.account.id,
          nickname: result.account.nickname,
          state: "queued",
          stage: "等待刷新"
        };
        renderActiveJob(job);
        updateModal.hidden = false;
        pollRefreshJob(result.job_id, result.account.id);
      } catch (error) {
        setAccountState(error.message || "登录失败", "error");
        setAccountBusy(false);
      }
    });

    resetBtn.addEventListener("click", function () {
      renderMemberFilter(false);
      statusFilter.value = "all";
      typeFilter.value = "all";
      resetProgressiveRender();
      renderTimeline(true);
      track("admin_filter", filterTrackPayload("reset_filters"));
    });

    filterPanel.addEventListener("toggle", function () {
      track("admin_filter", {
        action: "toggle_filters",
        expanded: filterPanel.open
      });
    });

    updatePill.addEventListener("click", handleUpdatePillClick);
    chatScroll.addEventListener("scroll", function () {
      syncUpdatePill();
      loadOlderRecordsIfNeeded();
    }, { passive: true });
    window.addEventListener("resize", syncUpdatePill, { passive: true });

    logoutBtn.addEventListener("click", async function () {
      track("login_attempt", { action: "logout", result: "submitted" });
      try {
        await apiJson("/logout", { method: "POST" });
      } finally {
        showLogin("");
      }
    });

    messageList.addEventListener("click", function (event) {
      const download = event.target.closest(".download-link");
      if (download) {
        const record = recordForNode(download);
        track("admin_export", {
          action: "open_official_media",
          result: "submitted",
          question_id: record ? record.question_id : "",
          media_type: record ? record.answer_type : ""
        });
        return;
      }
      const jumpLink = event.target.closest(".quote, .status-link");
      if (!jumpLink) return;
      const target = document.getElementById(jumpLink.dataset.target || "");
      if (!target) return;
      const jumpsToAnswer = jumpLink.classList.contains("status-link");
      track("admin_filter", {
        action: jumpsToAnswer ? "jump_to_flip_answer" : "jump_to_flip_question",
        question_id: target.dataset.qid || ""
      });
      target.scrollIntoView({ behavior: "smooth", block: "center" });
      target.classList.remove("highlight");
      void target.offsetWidth;
      target.classList.add("highlight");
      if (target._flipHighlightTimer) window.clearTimeout(target._flipHighlightTimer);
      target._flipHighlightTimer = window.setTimeout(function () {
        target._flipHighlightTimer = null;
        target.classList.remove("highlight");
      }, 4000);
    });

    ["play", "pause", "seeked", "ended"].forEach(function (eventName) {
      messageList.addEventListener(eventName, function (event) {
        const media = event.target;
        if (!(media instanceof HTMLMediaElement)) return;
        if (eventName === "pause" && media.ended) return;
        const action = {
          play: "flip_media_play",
          pause: "flip_media_pause",
          seeked: "flip_media_seek",
          ended: "flip_media_complete"
        }[eventName];
        track("click", mediaTrackPayload(action, media));
      }, true);
    });

    openIfReady();
  </script>
</body>
</html>
