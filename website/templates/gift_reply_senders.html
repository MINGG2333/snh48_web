<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site_title }} · 房间内回礼情况</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117;
      --panel: #151b23;
      --panel-2: #1b2330;
      --line: #2d3848;
      --text: #e6edf3;
      --muted: #98a6b7;
      --faint: #667384;
      --teal: #40b8a8;
      --gold: #f0b84b;
      --green: #4cc27a;
      --red: #e36f6f;
      --ink: #0a0f15;
    }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      line-height: 1.45;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    #loginOverlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
    }
    #loginOverlay.hidden { display: none; }
    .login-box {
      width: min(360px, 100%);
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      padding: 28px;
    }
    .login-box h1 { font-size: 21px; margin-bottom: 8px; }
    .login-box p { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
    .login-box input {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--ink);
      color: var(--text);
      padding: 0 12px;
      outline: none;
    }
    .login-box input:focus { border-color: var(--teal); }
    .login-btn {
      width: 100%;
      min-height: 44px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: var(--teal);
      color: var(--ink);
      font-weight: 750;
    }
    .login-error { display: none; color: var(--red); font-size: 13px; margin-top: 10px; }
    .login-error.show { display: block; }
    .login-error.status { color: var(--teal); }
    .login-error.success { color: var(--green); }
    .login-btn:disabled { cursor: wait; opacity: 0.72; }
    .page { display: none; }
    .page.ready { display: block; }
    .topbar {
      border-bottom: 1px solid var(--line);
      background: rgba(13, 17, 23, 0.96);
      backdrop-filter: blur(10px);
    }
    .topbar-inner {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .title h1 { font-size: 20px; font-weight: 750; }
    .title p { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .top-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .nav-link, .btn {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      padding: 0 12px;
      text-decoration: none;
      white-space: nowrap;
    }
    .nav-link.primary, .btn.primary {
      border-color: var(--teal);
      background: var(--teal);
      color: var(--ink);
      font-weight: 750;
    }
    main { width: min(1180px, 100%); margin: 0 auto; padding: 20px 20px 40px; }
    .stats-grid {
      display: none;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .page.show-stats .stats-grid { display: grid; }
    .stat { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 14px; }
    .stat .label { color: var(--muted); font-size: 12px; }
    .stat .value { font-size: 24px; font-weight: 760; margin-top: 5px; }
    .stat .sub { color: var(--faint); font-size: 12px; margin-top: 3px; }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(250px, 1.2fr) minmax(180px, 1fr) 150px 150px auto;
      gap: 10px;
      align-items: end;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      padding: 14px;
      margin-bottom: 14px;
    }
    .field label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .field input, .field select {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--ink);
      color: var(--text);
      padding: 0 10px;
      outline: none;
    }
    .field input:focus, .field select:focus { border-color: var(--teal); }
    .field input[type="date"] { color-scheme: dark; }
    .field input[type="date"] {
      display: block;
      min-width: 0;
      max-width: 100%;
      font-size: 16px;
      -webkit-appearance: none;
      appearance: none;
      padding-left: 8px;
      padding-right: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .field input[type="date"]::-webkit-date-and-time-value { min-width: 0; text-align: left; }
    .field input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      opacity: 1;
      filter: invert(79%) sepia(23%) saturate(695%) hue-rotate(126deg) brightness(98%) contrast(91%);
    }
    .field input[type="date"]::-webkit-calendar-picker-indicator:hover {
      filter: invert(87%) sepia(65%) saturate(568%) hue-rotate(353deg) brightness(99%) contrast(90%);
    }
    .segment {
      display: inline-grid;
      grid-template-columns: repeat(3, minmax(78px, 1fr));
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--ink);
    }
    .segment button { border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--muted); }
    .segment button:last-child { border-right: 0; }
    .segment button.active { background: var(--teal); color: var(--ink); font-weight: 750; }
    .toolbar-actions { display: flex; gap: 8px; }
    .toolbar > *,
    .field,
    .segment,
    .toolbar-actions { min-width: 0; }
    .mobile-filter-toggle {
      display: none;
      width: 100%;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      font-weight: 720;
      margin-bottom: 12px;
    }
    .gift-filter-modal,
    .gift-filter-card,
    .gift-filter-scroll { display: contents; }
    .gift-filter-backdrop,
    .gift-filter-header { display: none; }
    .result-head, .result-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .result-head {
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
      margin: 2px 2px 10px;
    }
    .stats-toggle {
      border: 0;
      background: transparent;
      color: var(--faint);
      padding: 3px 2px;
      font-size: 12px;
    }
    .stats-toggle:hover, .stats-toggle:focus-visible { color: var(--muted); }
    .sender-list { display: grid; gap: 12px; }
    .sender-card { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
    .sender-card summary {
      list-style: none;
      cursor: pointer;
      padding: 15px 16px;
      background: var(--panel-2);
    }
    .sender-card summary::-webkit-details-marker { display: none; }
    .sender-card summary:focus-visible { outline: 2px solid var(--teal); outline-offset: -2px; }
    .sender-card.return-highlight summary { animation: return-highlight 3s ease-out; }
    @keyframes return-highlight {
      0%, 70% {
        background: rgba(64, 184, 168, 0.24);
        box-shadow: inset 0 0 0 2px rgba(64, 184, 168, 0.72);
      }
      100% {
        background: var(--panel-2);
        box-shadow: inset 0 0 0 2px rgba(64, 184, 168, 0);
      }
    }
    .sender-head { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
    .sender-name-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .sender-name { font-size: 17px; font-weight: 760; word-break: break-word; }
    .sender-state {
      min-height: 23px;
      display: inline-flex;
      align-items: center;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 0 8px;
      font-size: 11px;
      font-weight: 750;
      white-space: nowrap;
    }
    .sender-state.unreplied { border-color: rgba(240, 184, 75, 0.42); color: var(--gold); background: rgba(240, 184, 75, 0.09); }
    .sender-state.all-replied { border-color: rgba(76, 194, 122, 0.42); color: var(--green); background: rgba(76, 194, 122, 0.1); }
    .sender-id { color: var(--faint); font-size: 12px; margin-top: 3px; word-break: break-all; }
    .sender-latest { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
    .sender-badges { display: none; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .page.show-stats .sender-badges { display: flex; }
    .badge {
      min-height: 24px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      padding: 0 9px;
      font-size: 12px;
    }
    .badge.unreplied { border-color: rgba(240, 184, 75, 0.42); color: var(--gold); background: rgba(240, 184, 75, 0.09); }
    .update-pill {
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      z-index: 20;
      display: none;
      transform: translateX(-50%);
      border: 1px solid var(--teal);
      border-radius: 999px;
      background: var(--panel);
      color: var(--teal);
      padding: 9px 15px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      white-space: nowrap;
    }
    .update-pill.show { display: block; }
    .update-pill:disabled { cursor: wait; opacity: 0.72; }
    .history-head, .gift-row {
      display: grid;
      grid-template-columns: 150px minmax(220px, 1fr) 100px minmax(220px, 1.2fr);
      gap: 12px;
      align-items: start;
      padding: 11px 16px;
    }
    .history-head { color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .gift-row { border-bottom: 1px solid rgba(45, 56, 72, 0.66); font-size: 13px; }
    .gift-row:last-child { border-bottom: 0; }
    .gift-time { color: var(--muted); white-space: nowrap; }
    .gift-main { display: flex; gap: 9px; align-items: center; min-width: 0; }
    .gift-icon { width: 34px; height: 34px; flex: 0 0 auto; border-radius: 7px; background: var(--panel-2); object-fit: cover; }
    .gift-name { min-width: 0; word-break: break-word; }
    .gift-count { color: var(--gold); font-weight: 730; margin-left: 4px; white-space: nowrap; }
    .reply-status { display: inline-flex; min-height: 24px; align-items: center; border-radius: 999px; padding: 0 9px; font-size: 12px; font-weight: 730; }
    .reply-status.replied { color: var(--green); background: rgba(76, 194, 122, 0.1); }
    .reply-status.unreplied { color: var(--gold); background: rgba(240, 184, 75, 0.1); }
    .reply-detail { color: var(--muted); word-break: break-word; }
    .reply-content { color: var(--text); margin-top: 3px; }
    .history-message { color: var(--muted); padding: 24px 16px; text-align: center; }
    .history-message.error { color: var(--red); }
    .history-actions {
      display: flex;
      justify-content: center;
      padding: 13px 16px 15px;
      border-top: 1px solid var(--line);
    }
    .collapse-btn { min-width: 150px; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .support-chat-nav {
      position: fixed;
      right: 18px;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      z-index: 30;
      width: 52px;
      height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(64, 184, 168, 0.38);
      border-radius: 50%;
      background: rgba(64, 184, 168, 0.08);
      color: #9de4d8;
      font-size: 21px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
    }
    .support-chat-nav:hover,
    .support-chat-nav:focus-visible {
      background: rgba(64, 184, 168, 0.16);
      color: #c6fff5;
      outline: none;
    }
    .support-chat-modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 18px;
      pointer-events: none;
      overscroll-behavior: contain;
    }
    .support-chat-modal.open { display: flex; pointer-events: auto; }
    .support-chat-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(4, 8, 13, 0.48);
      touch-action: none;
    }
    .support-chat-card {
      position: relative;
      z-index: 1;
      width: min(410px, 100%);
      height: min(660px, calc(100dvh - 36px));
      display: flex;
      flex-direction: column;
      overflow: hidden;
      overscroll-behavior: contain;
      touch-action: pan-y;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.48);
    }
    .support-chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    .support-chat-title { display: flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 750; }
    .support-chat-title i { color: var(--teal); }
    .support-chat-close {
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      font-size: 18px;
      line-height: 1;
    }
    .support-chat-close:hover,
    .support-chat-close:focus-visible { border-color: var(--teal); color: var(--teal); outline: none; }
    .support-chat-setup,
    .support-chat-conversation { min-height: 0; flex: 1; display: flex; flex-direction: column; }
    .support-chat-setup { justify-content: center; gap: 12px; padding: 24px; }
    .support-chat-setup.hidden,
    .support-chat-conversation.hidden { display: none; }
    .support-chat-copy { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .support-chat-field { display: grid; gap: 6px; }
    .support-chat-field label { color: var(--muted); font-size: 12px; }
    .support-chat-field input,
    .support-chat-composer textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--ink);
      color: var(--text);
      outline: none;
    }
    .support-chat-field input { min-height: 42px; padding: 0 11px; font-size: 16px; }
    .support-chat-field input:focus,
    .support-chat-composer textarea:focus { border-color: var(--teal); }
    .support-chat-setup-actions { display: flex; align-items: center; gap: 8px; }
    .support-chat-setup-actions .btn { flex: 1; }
    .support-chat-messages {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
    }
    .support-chat-empty { margin: auto 0; color: var(--muted); font-size: 13px; text-align: center; }
    .support-chat-message { display: flex; flex-direction: column; gap: 3px; max-width: 84%; }
    .support-chat-message.visitor { align-self: flex-end; align-items: flex-end; }
    .support-chat-message.support { align-self: flex-start; align-items: flex-start; }
    .support-chat-bubble {
      padding: 9px 11px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .support-chat-message.visitor .support-chat-bubble { background: rgba(64, 184, 168, 0.2); color: #d5fff8; border-bottom-right-radius: 4px; }
    .support-chat-message.support .support-chat-bubble { background: var(--panel-2); color: var(--text); border-bottom-left-radius: 4px; }
    .support-chat-time { color: var(--faint); font-size: 10px; }
    .support-chat-composer { display: flex; align-items: flex-end; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
    .support-chat-composer textarea {
      flex: 1 1 auto;
      width: auto;
      min-width: 0;
      min-height: 42px;
      max-height: 120px;
      padding: 9px 10px;
      resize: vertical;
      font-size: 16px;
      line-height: 1.45;
    }
    .support-chat-send { flex: 0 0 78px; min-width: 0; min-height: 42px; padding: 0 8px; }
    .support-chat-status { min-height: 20px; padding: 0 12px 8px; color: var(--muted); font-size: 12px; }
    .support-chat-status.error { color: var(--red); }
    .support-chat-footer { display: flex; justify-content: space-between; gap: 8px; padding: 0 12px 12px; }
    .support-chat-footer button,
    .support-chat-footer a { border: 0; background: transparent; color: var(--faint); font-size: 11px; text-decoration: none; }
    .support-chat-footer button:hover,
    .support-chat-footer button:focus-visible,
    .support-chat-footer a:hover,
    .support-chat-footer a:focus-visible { color: var(--teal); outline: none; }
    .empty { display: none; color: var(--muted); text-align: center; padding: 52px 12px; }
    .empty.show { display: block; }
    .btn:disabled { cursor: not-allowed; opacity: 0.45; }
    .loading { opacity: 0.65; pointer-events: none; }
    html.page-scroll-locked,
    body.page-scroll-locked { overflow: hidden; }
    @media (max-width: 820px) {
      html.gift-filters-open,
      body.gift-filters-open { overflow: hidden; }
      .topbar-inner { align-items: flex-start; flex-direction: column; padding: 14px; }
      .top-actions { justify-content: flex-start; }
      main { padding: 14px 12px 32px; }
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .mobile-filter-toggle { display: inline-flex; }
      .top-actions .mobile-filter-toggle {
        width: auto;
        min-height: 36px;
        margin-bottom: 0;
        padding: 0 12px;
      }
      .gift-filter-modal {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding: max(18px, calc(8dvh + env(safe-area-inset-top, 0px))) 12px 12px;
      }
      .gift-filter-modal.open { display: flex; }
      .gift-filter-backdrop {
        position: absolute;
        inset: 0;
        display: block;
        background: rgba(4, 8, 13, 0.72);
      }
      .gift-filter-card {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        width: min(420px, calc(100% - 24px));
        max-width: calc(100% - 24px);
        min-width: 0;
        max-height: calc(100dvh - max(18px, calc(8dvh + env(safe-area-inset-top, 0px))) - 12px);
        margin: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.48);
      }
      .gift-filter-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-width: 0;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }
      .gift-filter-header h2 { min-width: 0; font-size: 16px; font-weight: 750; }
      .gift-filter-close {
        flex: 0 0 auto;
        min-height: 32px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-2);
        color: var(--text);
        padding: 0 10px;
      }
      .gift-filter-scroll {
        display: block;
        min-width: 0;
        min-height: 0;
        max-height: calc(min(88dvh, 720px) - 61px);
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }
      .gift-filter-scroll .toolbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) !important;
        min-width: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        padding: 12px;
        margin-bottom: 0;
        gap: 10px;
      }
      .gift-filter-scroll .field,
      .gift-filter-scroll .field input,
      .gift-filter-scroll .segment,
      .gift-filter-scroll .toolbar-actions { width: 100%; max-width: 100%; }
      .gift-filter-scroll .field input { min-width: 0; }
      .gift-filter-scroll .field input,
      .gift-filter-scroll .field select { font-size: 16px; }
      .gift-filter-scroll .segment { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .gift-filter-scroll .segment button { min-width: 0; padding: 0 5px; white-space: normal; line-height: 1.25; }
      .gift-filter-scroll .toolbar-actions { gap: 8px; }
      .gift-filter-scroll .toolbar-actions .btn { flex: 1 1 0; min-width: 0; }
      .sender-head { flex-direction: column; gap: 6px; }
      .sender-latest { text-align: left; white-space: normal; }
      .history-head { display: none; }
      .gift-row { grid-template-columns: 1fr auto; gap: 8px 12px; padding: 13px 14px; }
      .gift-time { grid-column: 1; grid-row: 1; }
      .gift-main { grid-column: 1 / -1; grid-row: 2; }
      .gift-row > :nth-child(3) { grid-column: 2; grid-row: 1; }
      .reply-detail { grid-column: 1 / -1; grid-row: 3; }
      .result-head { align-items: flex-start; flex-direction: column; }
      .result-actions { width: 100%; justify-content: space-between; }
      .support-chat-modal { align-items: flex-end; justify-content: center; padding: 12px; }
      .support-chat-card { height: min(680px, calc(100dvh - 24px)); max-height: calc(100dvh - 24px); }
      .support-chat-composer { padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sender-card.return-highlight summary {
        animation: none;
        background: rgba(64, 184, 168, 0.24);
        box-shadow: inset 0 0 0 2px rgba(64, 184, 168, 0.72);
      }
    }
  </style>
</head>
<body>
  <div id="loginOverlay">
    <div class="login-box">
      <h1>房间内回礼情况</h1>
      <p>请输入礼物回复页密码</p>
      <input type="password" id="passwordInput" placeholder="密码" autocomplete="current-password" autofocus>
      <button class="login-btn" id="loginBtn" type="button">进入</button>
      <div class="login-error" id="loginError">密码错误</div>
    </div>
  </div>

  <div class="page" id="page">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="title">
          <h1>房间内回礼情况</h1>
          <p>按送礼人整理历史礼物，最新送礼人和最新礼物优先</p>
        </div>
        <nav class="top-actions" aria-label="页面导航">
          <a class="nav-link primary" href="/room">返回 Room</a>
          <a class="nav-link" href="/room/gifts">逐条明细</a>
          <button class="mobile-filter-toggle" id="giftFilterToggle" type="button" aria-expanded="false" aria-controls="giftFilterModal">筛选</button>
        </nav>
      </div>
    </header>

    <main id="mainContent">
      <section class="stats-grid" aria-label="房间内回礼情况统计">
        <div class="stat"><div class="label">待综合回礼人数</div><div class="value" id="pendingSenders">0</div><div class="sub">至少有一条未回复礼物</div></div>
        <div class="stat"><div class="label">未回复礼物消息</div><div class="value" id="pendingMessages">0</div><div class="sub">仍按逐条真实回复判定</div></div>
        <div class="stat"><div class="label">全部送礼人数</div><div class="value" id="totalSenders">0</div><div class="sub">按用户 ID 聚合</div></div>
        <div class="stat"><div class="label">当前筛选人数</div><div class="value" id="filteredSenders">0</div><div class="sub" id="generatedAt">生成时间：-</div></div>
      </section>

      <div class="gift-filter-modal" id="giftFilterModal">
        <div class="gift-filter-backdrop" id="giftFilterBackdrop"></div>
        <section class="gift-filter-card" id="giftFilterCard" role="dialog" aria-modal="true" aria-labelledby="giftFilterTitle">
          <header class="gift-filter-header">
            <h2 id="giftFilterTitle">筛选送礼人</h2>
            <button class="gift-filter-close" id="giftFilterClose" type="button">收起</button>
          </header>
          <div class="gift-filter-scroll">
            <section class="toolbar" aria-label="筛选条件">
              <div class="field">
                <label>送礼人状态</label>
                <div class="segment" id="statusSegment">
                  <button type="button" data-status="all" class="active">全部</button>
                  <button type="button" data-status="unreplied">有未回复</button>
                  <button type="button" data-status="all_replied">已全部回复</button>
                </div>
              </div>
              <div class="field"><label for="senderInput">送礼人</label><input id="senderInput" type="search" placeholder="昵称或用户 ID"></div>
              <div class="field"><label for="dateFromInput">开始日期</label><input id="dateFromInput" type="date" value="2026-05-30"></div>
              <div class="field"><label for="dateToInput">结束日期</label><input id="dateToInput" type="date"></div>
              <div class="toolbar-actions"><button class="btn primary" id="applyBtn" type="button">筛选</button><button class="btn" id="resetBtn" type="button">重置</button></div>
            </section>
          </div>
        </section>
      </div>

      <div class="result-head">
        <span id="resultSummary">共 0 人，当前显示 0 人</span>
        <div class="result-actions"><span id="refreshLabel">每 30 秒检查更新</span><button class="stats-toggle" id="statsToggle" type="button" aria-expanded="false">统计</button></div>
      </div>
      <button class="update-pill" id="updatePill" type="button" aria-live="polite">有新的送礼数据，点击刷新</button>
      <section class="sender-list" id="senderList" aria-label="按送礼人整理的礼物历史"></section>
      <div class="empty" id="emptyState">当前筛选条件下没有送礼人</div>
    </main>

    <button class="support-chat-nav" id="supportChatNav" type="button" aria-haspopup="dialog" aria-expanded="false" title="反馈">
      <i class="fas fa-headset" aria-hidden="true"></i>
      <span class="sr-only">反馈</span>
    </button>

    <div class="support-chat-modal" id="supportChatModal" aria-hidden="true">
      <div class="support-chat-backdrop" id="supportChatBackdrop"></div>
      <section class="support-chat-card" role="dialog" aria-modal="true" aria-labelledby="supportChatTitle">
        <header class="support-chat-header">
          <div class="support-chat-title" id="supportChatTitle"><i class="fas fa-headset" aria-hidden="true"></i><span>反馈</span></div>
          <button class="support-chat-close" id="supportChatClose" type="button" aria-label="关闭客服窗口">×</button>
        </header>
        <div class="support-chat-setup" id="supportChatSetup">
          <p class="support-chat-copy">设置一个只有你知道的唯一识别码，就可以在以后查看这段聊天记录。识别码请妥善保存，忘记后无法找回原记录。</p>
          <div class="support-chat-field">
            <label for="supportChatIdentifier">唯一识别码</label>
            <input id="supportChatIdentifier" type="text" minlength="4" maxlength="64" autocomplete="off" placeholder="至少 4 个字符">
          </div>
          <div class="support-chat-setup-actions">
            <button class="btn primary" id="supportChatStart" type="button">进入聊天</button>
          </div>
          <div class="support-chat-status" id="supportChatSetupStatus" role="status" aria-live="polite"></div>
        </div>
        <div class="support-chat-conversation hidden" id="supportChatConversation">
          <div class="support-chat-messages" id="supportChatMessages" aria-live="polite"></div>
          <div class="support-chat-status" id="supportChatStatus" role="status" aria-live="polite"></div>
          <form class="support-chat-composer" id="supportChatForm">
            <textarea id="supportChatInput" maxlength="2000" rows="2" placeholder="写下你的消息"></textarea>
            <button class="btn primary support-chat-send" id="supportChatSend" type="submit"><i class="fas fa-paper-plane" aria-hidden="true"></i><span>发送</span></button>
          </form>
          <div class="support-chat-footer">
            <button type="button" id="supportChatChange">更换识别码</button>
            <a href="/complaint" target="_blank" rel="noopener noreferrer">网站总反馈</a>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="/static/js/tracker.js?v={{ static_version('js/tracker.js') }}"></script>
  <script>
  (function() {
    "use strict";
    var DEFAULT_DATE_FROM = "2026-05-30";
    var password = "";
    var activeStatus = "all";
    var refreshSeconds = 30;
    var refreshTimer = null;
    var loading = false;
    var checkingUpdates = false;
    var lastDatasetSnapshot = null;
    var loginBusy = false;
    var loginVerified = false;
    var expandedSenderKeys = new Set();
    var historyCache = new Map();
    var highlightTimers = new WeakMap();

    var loginOverlay = document.getElementById("loginOverlay");
    var loginError = document.getElementById("loginError");
    var passwordInput = document.getElementById("passwordInput");
    var loginBtn = document.getElementById("loginBtn");
    var page = document.getElementById("page");
    var mainContent = document.getElementById("mainContent");
    var statusSegment = document.getElementById("statusSegment");
    var senderInput = document.getElementById("senderInput");
    var dateFromInput = document.getElementById("dateFromInput");
    var dateToInput = document.getElementById("dateToInput");
    var senderList = document.getElementById("senderList");
    var emptyState = document.getElementById("emptyState");
    var giftFilterToggle = document.getElementById("giftFilterToggle");
    var giftFilterModal = document.getElementById("giftFilterModal");
    var giftFilterBackdrop = document.getElementById("giftFilterBackdrop");
    var giftFilterClose = document.getElementById("giftFilterClose");
    var giftFilterPreviousFocus = null;
    var statsToggle = document.getElementById("statsToggle");
    var updatePill = document.getElementById("updatePill");
    var supportChatNav = document.getElementById("supportChatNav");
    var supportChatModal = document.getElementById("supportChatModal");
    var supportChatBackdrop = document.getElementById("supportChatBackdrop");
    var supportChatClose = document.getElementById("supportChatClose");
    var supportChatSetup = document.getElementById("supportChatSetup");
    var supportChatConversation = document.getElementById("supportChatConversation");
    var supportChatIdentifier = document.getElementById("supportChatIdentifier");
    var supportChatStart = document.getElementById("supportChatStart");
    var supportChatSetupStatus = document.getElementById("supportChatSetupStatus");
    var supportChatMessages = document.getElementById("supportChatMessages");
    var supportChatStatus = document.getElementById("supportChatStatus");
    var supportChatForm = document.getElementById("supportChatForm");
    var supportChatInput = document.getElementById("supportChatInput");
    var supportChatSend = document.getElementById("supportChatSend");
    var supportChatChange = document.getElementById("supportChatChange");
    var supportChatPollTimer = null;
    var supportChatHistoryBusy = false;
    var currentSupportChatIdentifier = "";
    var supportChatPreviousFocus = null;
    var pageScrollLockY = null;

    function setPageScrollLocked(locked) {
      if (locked) {
        if (pageScrollLockY !== null) return;
        pageScrollLockY = window.scrollY || document.documentElement.scrollTop || 0;
        document.documentElement.classList.add("page-scroll-locked");
        document.body.classList.add("page-scroll-locked");
        document.body.style.position = "fixed";
        document.body.style.top = "-" + pageScrollLockY + "px";
        document.body.style.left = "0";
        document.body.style.right = "0";
        document.body.style.width = "100%";
        return;
      }
      if (pageScrollLockY === null) return;
      var restoreY = pageScrollLockY;
      pageScrollLockY = null;
      document.documentElement.classList.remove("page-scroll-locked");
      document.body.classList.remove("page-scroll-locked");
      document.body.style.position = "";
      document.body.style.top = "";
      document.body.style.left = "";
      document.body.style.right = "";
      document.body.style.width = "";
      window.scrollTo(0, restoreY);
    }

    function isGiftFilterMobile() {
      return window.matchMedia
        ? window.matchMedia("(max-width: 820px)").matches
        : window.innerWidth <= 820;
    }

    function setGiftFilterModalOpen(open) {
      if (!giftFilterModal) return;
      if (open) {
        giftFilterPreviousFocus = document.activeElement;
        giftFilterModal.classList.add("open");
        giftFilterModal.setAttribute("aria-hidden", "false");
        giftFilterToggle.setAttribute("aria-expanded", "true");
        document.documentElement.classList.add("gift-filters-open");
        document.body.classList.add("gift-filters-open");
        setPageScrollLocked(true);
        window.setTimeout(function() {
          if (giftFilterClose) giftFilterClose.focus();
        }, 0);
        track("admin_modal", { modal: "gift_sender_filters", action: "open" });
        return;
      }
      giftFilterModal.classList.remove("open");
      giftFilterModal.setAttribute("aria-hidden", "true");
      giftFilterToggle.setAttribute("aria-expanded", "false");
      document.documentElement.classList.remove("gift-filters-open");
      document.body.classList.remove("gift-filters-open");
      setPageScrollLocked(false);
      if (giftFilterPreviousFocus && typeof giftFilterPreviousFocus.focus === "function") {
        giftFilterPreviousFocus.focus();
      }
      giftFilterPreviousFocus = null;
      track("admin_modal", { modal: "gift_sender_filters", action: "close" });
    }

    function track(eventType, data) {
      if (!window._trackEvent) return;
      window._trackEvent(eventType, Object.assign({ area: "gift_reply_senders" }, data || {}));
    }

    function chatErrorMessage(data, fallback) {
      var detail = data && data.detail;
      if (Array.isArray(detail)) {
        return detail.map(function(item) { return item.msg || ""; }).filter(Boolean).join("；") || fallback;
      }
      return typeof detail === "string" && detail ? detail : fallback;
    }

    function setChatStatus(node, message, isError) {
      if (!node) return;
      node.textContent = message || "";
      node.classList.toggle("error", Boolean(isError));
    }

    function setChatModalOpen(open) {
      if (!supportChatModal) return;
      if (open) {
        supportChatPreviousFocus = document.activeElement;
        supportChatModal.classList.add("open");
        supportChatModal.setAttribute("aria-hidden", "false");
        supportChatNav.setAttribute("aria-expanded", "true");
        setPageScrollLocked(true);
        window.setTimeout(function() {
          if (currentSupportChatIdentifier) {
            if (supportChatInput) supportChatInput.focus();
          } else if (supportChatIdentifier) {
            supportChatIdentifier.focus();
          }
        }, 0);
        track("admin_modal", { modal: "feedback_chat", action: "open" });
        return;
      }
      supportChatModal.classList.remove("open");
      supportChatModal.setAttribute("aria-hidden", "true");
      supportChatNav.setAttribute("aria-expanded", "false");
      setPageScrollLocked(false);
      if (supportChatPollTimer) {
        window.clearInterval(supportChatPollTimer);
        supportChatPollTimer = null;
      }
      if (supportChatPreviousFocus && typeof supportChatPreviousFocus.focus === "function") supportChatPreviousFocus.focus();
      supportChatPreviousFocus = null;
      track("admin_modal", { modal: "feedback_chat", action: "close" });
    }

    function renderSupportChatMessages(messages) {
      supportChatMessages.replaceChildren();
      if (!messages.length) {
        var empty = document.createElement("div");
        empty.className = "support-chat-empty";
        empty.textContent = "还没有消息，可以先告诉我们遇到的问题。";
        supportChatMessages.appendChild(empty);
        return;
      }
      messages.forEach(function(message) {
        var row = document.createElement("div");
        row.className = "support-chat-message " + (message.sender === "support" ? "support" : "visitor");
        var bubble = document.createElement("div");
        bubble.className = "support-chat-bubble";
        bubble.textContent = message.content || "";
        var time = document.createElement("div");
        time.className = "support-chat-time";
        time.textContent = message.created_at || "";
        row.appendChild(bubble);
        row.appendChild(time);
        supportChatMessages.appendChild(row);
      });
      supportChatMessages.scrollTop = supportChatMessages.scrollHeight;
    }

    async function loadSupportChatHistory(showLoading) {
      if (!currentSupportChatIdentifier || supportChatHistoryBusy) return;
      supportChatHistoryBusy = true;
      if (showLoading) setChatStatus(supportChatStatus, "正在加载聊天记录…", false);
      try {
        var response = await fetch("/api/feedback-chat/history", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ identifier: currentSupportChatIdentifier }),
          cache: "no-store"
        });
        var data = await response.json().catch(function() { return {}; });
        if (!response.ok) throw new Error(chatErrorMessage(data, "聊天记录加载失败"));
        renderSupportChatMessages(Array.isArray(data.messages) ? data.messages : []);
        setChatStatus(supportChatStatus, "", false);
      } catch (error) {
        setChatStatus(supportChatStatus, error.message || "聊天记录加载失败", true);
      } finally {
        supportChatHistoryBusy = false;
      }
    }

    async function enterSupportChat() {
      var identifier = supportChatIdentifier.value.trim();
      if (identifier.length < 4 || identifier.length > 64 || /\s/.test(identifier)) {
        setChatStatus(supportChatSetupStatus, "识别码需为 4-64 个字符且不能包含空格", true);
        supportChatIdentifier.focus();
        return;
      }
      supportChatStart.disabled = true;
      setChatStatus(supportChatSetupStatus, "正在打开聊天…", false);
      currentSupportChatIdentifier = identifier;
      try {
        var response = await fetch("/api/feedback-chat/history", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ identifier: identifier }),
          cache: "no-store"
        });
        var data = await response.json().catch(function() { return {}; });
        if (!response.ok) throw new Error(chatErrorMessage(data, "聊天记录加载失败"));
        supportChatSetup.classList.add("hidden");
        supportChatConversation.classList.remove("hidden");
        renderSupportChatMessages(Array.isArray(data.messages) ? data.messages : []);
        setChatStatus(supportChatSetupStatus, "", false);
        supportChatPollTimer = window.setInterval(function() { loadSupportChatHistory(false); }, 3000);
        if (supportChatInput) supportChatInput.focus();
        track("admin_update", { action: "open_feedback_chat", result: "success" });
      } catch (error) {
        currentSupportChatIdentifier = "";
        setChatStatus(supportChatSetupStatus, error.message || "聊天记录加载失败", true);
        track("admin_update", { action: "open_feedback_chat", result: "failure" });
      } finally {
        supportChatStart.disabled = false;
      }
    }

    async function submitSupportChatMessage(event) {
      event.preventDefault();
      var content = supportChatInput.value.trim();
      if (!currentSupportChatIdentifier) return;
      if (!content) {
        setChatStatus(supportChatStatus, "消息不能为空", true);
        supportChatInput.focus();
        return;
      }
      supportChatSend.disabled = true;
      setChatStatus(supportChatStatus, "正在发送…", false);
      try {
        var response = await fetch("/api/feedback-chat/message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ identifier: currentSupportChatIdentifier, content: content }),
          cache: "no-store"
        });
        var data = await response.json().catch(function() { return {}; });
        if (!response.ok) throw new Error(chatErrorMessage(data, "发送失败，请稍后重试"));
        supportChatInput.value = "";
        renderSupportChatMessages(Array.isArray(data.messages) ? data.messages : []);
        setChatStatus(supportChatStatus, data.replication_pending ? "已发送，正在同步客服记录…" : "", false);
        track("admin_update", { action: "send_feedback_chat_message", result: "success" });
      } catch (error) {
        setChatStatus(supportChatStatus, error.message || "发送失败，请稍后重试", true);
        track("admin_update", { action: "send_feedback_chat_message", result: "failure" });
      } finally {
        supportChatSend.disabled = false;
      }
    }

    function changeSupportChatIdentifier() {
      currentSupportChatIdentifier = "";
      if (supportChatPollTimer) {
        window.clearInterval(supportChatPollTimer);
        supportChatPollTimer = null;
      }
      supportChatConversation.classList.add("hidden");
      supportChatSetup.classList.remove("hidden");
      setChatStatus(supportChatStatus, "", false);
      setChatStatus(supportChatSetupStatus, "", false);
      supportChatIdentifier.focus();
    }

    function setLoading(value) {
      loading = value;
      mainContent.classList.toggle("loading", value);
    }

    function setLoginFeedback(kind, message) {
      loginError.textContent = message;
      loginError.classList.add("show");
      loginError.classList.toggle("status", kind === "verifying");
      loginError.classList.toggle("success", kind === "loading" || kind === "retry");
      loginBtn.disabled = kind === "verifying" || kind === "loading";
      passwordInput.disabled = kind === "verifying" || kind === "loading" || kind === "retry";
      loginBtn.textContent = kind === "verifying" ? "正在验证…" : (kind === "loading" ? "正在加载…" : (kind === "retry" ? "重试加载" : "进入"));
    }

    function resetLoginForPassword(message) {
      loginBusy = false;
      loginVerified = false;
      password = "";
      passwordInput.disabled = false;
      passwordInput.value = "";
      loginBtn.disabled = false;
      loginBtn.textContent = "进入";
      loginError.textContent = message || "密码错误";
      loginError.classList.remove("status", "success");
      loginError.classList.add("show");
      passwordInput.focus();
    }

    function showLoginLoadRetry(message) {
      loginBusy = false;
      loginVerified = true;
      setLoginFeedback("retry", message || "密码正确，但数据加载失败，请点击重试加载");
    }

    async function verifyLoginPassword() {
      var response = await fetch("/api/gift-replies/verify", {
        headers: { "X-Gift-Replies-Password": password },
        cache: "no-store"
      });
      if (!response.ok) {
        var errorData = await response.json().catch(function() { return {}; });
        throw { auth: response.status === 401 || response.status === 403, message: errorData.detail || "密码验证失败" };
      }
    }

    function syncStatusButtons() {
      Array.prototype.forEach.call(statusSegment.querySelectorAll("button[data-status]"), function(button) {
        var selected = button.dataset.status === activeStatus;
        button.classList.toggle("active", selected);
        button.setAttribute("aria-pressed", selected ? "true" : "false");
      });
    }

    function queryString() {
      var params = new URLSearchParams();
      params.set("status", activeStatus);
      params.set("sender", senderInput.value.trim());
      params.set("date_from", dateFromInput.value);
      params.set("date_to", dateToInput.value);
      return params.toString();
    }

    function historyQueryString(senderKey) {
      var params = new URLSearchParams();
      params.set("sender_key", senderKey);
      params.set("date_from", dateFromInput.value);
      params.set("date_to", dateToInput.value);
      return params.toString();
    }

    function currentHistoryCacheKey(senderKey) {
      return [senderKey, dateFromInput.value, dateToInput.value].join("|");
    }

    async function loadData(loginAttempt) {
      if (!password || loading) return;
      setLoading(true);
      try {
        var response = await fetch("/api/gift-replies/senders?" + queryString(), {
          headers: { "X-Gift-Replies-Password": password },
          cache: "no-store"
        });
        if (!response.ok) {
          if (response.status === 401 || response.status === 403) {
            resetLoginForPassword("密码已失效，请重新输入");
            loginOverlay.classList.remove("hidden");
            page.classList.remove("ready");
            if (loginAttempt) track("login_attempt", { action: "gift_reply_senders_login", result: "failure" });
          } else {
            var errorData = await response.json().catch(function() { return {}; });
            if (loginAttempt) showLoginLoadRetry("密码正确，但数据加载失败：" + (errorData.detail || "请稍后重试"));
            else showPageError(errorData.detail || "筛选条件无效，请检查后重试");
          }
          return false;
        }
        var data = await response.json();
        loginError.classList.remove("show");
        loginOverlay.classList.add("hidden");
        page.classList.add("ready");
        if (loginAttempt) track("login_attempt", { action: "gift_reply_senders_login", result: "success" });
        render(data);
        loginBusy = false;
        return true;
      } catch (error) {
        if (loginAttempt) showLoginLoadRetry("密码正确，但数据加载失败，请点击重试加载");
        else showPageError("数据加载失败，请稍后重试");
        return false;
      } finally {
        setLoading(false);
      }
    }

    function render(data) {
      var senderSummary = data.sender_summary || {};
      var summary = data.summary || {};
      refreshSeconds = Math.max(15, Number(data.refresh_interval_seconds || 30));
      lastDatasetSnapshot = datasetSnapshot(data);
      updatePill.classList.remove("show");
      document.getElementById("pendingSenders").textContent = String(senderSummary.senders_with_unreplied || 0);
      document.getElementById("pendingMessages").textContent = String(summary.unreplied_gift_messages || 0);
      document.getElementById("totalSenders").textContent = String(senderSummary.total_senders || 0);
      document.getElementById("filteredSenders").textContent = String(senderSummary.filtered_senders || 0);
      document.getElementById("generatedAt").textContent = "生成时间：" + (data.generated_at || "-");
      document.getElementById("resultSummary").textContent = "共 " + Number(data.total || 0) + " 人，当前显示 " + (data.items || []).length + " 人";
      document.getElementById("refreshLabel").textContent = "每 " + refreshSeconds + " 秒检查更新";
      renderSenders(data.items || []);
      resetRefreshTimer();
    }

    function showPageError(message) {
      senderList.replaceChildren();
      emptyState.textContent = message;
      emptyState.classList.add("show");
      document.getElementById("resultSummary").textContent = "未能加载送礼人";
    }

    function renderSenders(groups) {
      senderList.replaceChildren();
      emptyState.classList.toggle("show", groups.length === 0);
      if (groups.length === 0) emptyState.textContent = "当前筛选条件下没有送礼人";
      groups.forEach(function(group) {
        var card = createSenderCard(group);
        senderList.appendChild(card);
        if (card.open) loadSenderHistory(group, card, card.querySelector(".history-content"));
      });
    }

    function createSenderCard(group) {
      var details = document.createElement("details");
      details.className = "sender-card";
      details.open = expandedSenderKeys.has(group.sender_key);
      var summary = document.createElement("summary");
      var head = document.createElement("div");
      head.className = "sender-head";
      var identity = document.createElement("div");
      identity.className = "sender-identity";
      var nameRow = document.createElement("div");
      nameRow.className = "sender-name-row";
      var name = document.createElement("div");
      name.className = "sender-name";
      name.textContent = group.sender_name || "未知用户";
      nameRow.appendChild(name);
      var senderState = document.createElement("span");
      var hasUnreplied = Number(group.unreplied_messages || 0) > 0;
      senderState.className = "sender-state " + (hasUnreplied ? "unreplied" : "all-replied");
      senderState.textContent = hasUnreplied ? "有未回复" : "已全部回复";
      nameRow.appendChild(senderState);
      identity.appendChild(nameRow);
      if (group.sender_id) {
        var id = document.createElement("div");
        id.className = "sender-id";
        id.textContent = "用户 ID：" + group.sender_id;
        identity.appendChild(id);
      }
      var latest = document.createElement("div");
      latest.className = "sender-latest";
      latest.textContent = "最新送礼：" + (group.latest_gift_bj_time || "-");
      head.appendChild(identity);
      head.appendChild(latest);
      summary.appendChild(head);
      var badges = document.createElement("div");
      badges.className = "sender-badges";
      badges.appendChild(createBadge("未回复 " + Number(group.unreplied_messages || 0) + " 条", "unreplied"));
      badges.appendChild(createBadge("历史 " + Number(group.total_messages || 0) + " 条"));
      badges.appendChild(createBadge("礼物合计 " + Number(group.total_gift_count || 0) + " 个"));
      badges.appendChild(createBadge("已回复 " + Number(group.replied_messages || 0) + " 条"));
      summary.appendChild(badges);
      details.appendChild(summary);

      var historyContent = document.createElement("div");
      historyContent.className = "history-content";
      details.appendChild(historyContent);
      details.addEventListener("toggle", function() {
        if (details.open) {
          expandedSenderKeys.add(group.sender_key);
          loadSenderHistory(group, details, historyContent);
        } else {
          expandedSenderKeys.delete(group.sender_key);
        }
        track("click", {
          action: details.open ? "expand_sender_history" : "collapse_sender_history",
          gift_count: Number(group.total_messages || 0)
        });
      });
      return details;
    }

    async function loadSenderHistory(group, details, historyContent) {
      if (!details.open || historyContent.dataset.loading === "true" || historyContent.dataset.loaded === "true") return;
      var cacheKey = currentHistoryCacheKey(group.sender_key);
      if (historyCache.has(cacheKey)) {
        renderSenderHistory(historyContent, historyCache.get(cacheKey), details);
        return;
      }

      historyContent.dataset.loading = "true";
      showHistoryMessage(historyContent, "正在加载礼物记录……", false);
      try {
        var response = await fetch("/api/gift-replies/sender-history?" + historyQueryString(group.sender_key), {
          headers: { "X-Gift-Replies-Password": password },
          cache: "no-store"
        });
        if (!response.ok) {
          var errorData = await response.json().catch(function() { return {}; });
          throw new Error(errorData.detail || "礼物记录加载失败");
        }
        var data = await response.json();
        var historyGroup = data.item || {};
        historyCache.set(cacheKey, historyGroup);
        renderSenderHistory(historyContent, historyGroup, details);
      } catch (error) {
        showHistoryMessage(historyContent, error.message || "礼物记录加载失败，请稍后重试", true);
      } finally {
        historyContent.dataset.loading = "false";
      }
    }

    function showHistoryMessage(container, message, isError) {
      container.replaceChildren();
      container.dataset.loaded = "false";
      var notice = document.createElement("div");
      notice.className = "history-message" + (isError ? " error" : "");
      notice.textContent = message;
      container.appendChild(notice);
    }

    function renderSenderHistory(container, group, details) {
      container.replaceChildren();
      container.dataset.loaded = "true";
      var historyHead = document.createElement("div");
      historyHead.className = "history-head";
      ["送礼时间", "礼物", "回复状态", "回复记录"].forEach(function(label) {
        var cell = document.createElement("div");
        cell.textContent = label;
        historyHead.appendChild(cell);
      });
      container.appendChild(historyHead);
      (group.items || []).forEach(function(item) {
        container.appendChild(createGiftRow(item));
      });
      if (!(group.items || []).length) showHistoryMessage(container, "当前日期范围内没有礼物记录", false);

      var actions = document.createElement("div");
      actions.className = "history-actions";
      var collapseButton = document.createElement("button");
      collapseButton.className = "btn collapse-btn";
      collapseButton.type = "button";
      collapseButton.textContent = "收起该送礼人";
      collapseButton.addEventListener("click", function() {
        collapseAndHighlightSender(details);
      });
      actions.appendChild(collapseButton);
      container.appendChild(actions);
    }

    function collapseAndHighlightSender(details) {
      var summary = details.querySelector("summary");
      var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      details.open = false;
      window.requestAnimationFrame(function() {
        summary.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
        window.setTimeout(function() {
          var previousTimer = highlightTimers.get(details);
          if (previousTimer) window.clearTimeout(previousTimer);
          details.classList.remove("return-highlight");
          void details.offsetWidth;
          details.classList.add("return-highlight");
          highlightTimers.set(details, window.setTimeout(function() {
            details.classList.remove("return-highlight");
            highlightTimers.delete(details);
          }, 3000));
        }, reduceMotion ? 0 : 450);
      });
    }

    function createBadge(text, extraClass) {
      var badge = document.createElement("span");
      badge.className = "badge" + (extraClass ? " " + extraClass : "");
      badge.textContent = text;
      return badge;
    }

    function createGiftRow(item) {
      var row = document.createElement("div");
      row.className = "gift-row";
      var time = document.createElement("div");
      time.className = "gift-time";
      time.textContent = item.gift_bj_time || "-";
      row.appendChild(time);

      var gift = document.createElement("div");
      gift.className = "gift-main";
      if (item.gift_icon_url) {
        var image = document.createElement("img");
        image.className = "gift-icon";
        image.src = item.gift_icon_url;
        image.alt = "";
        image.loading = "lazy";
        image.referrerPolicy = "no-referrer";
        gift.appendChild(image);
      }
      var giftName = document.createElement("div");
      giftName.className = "gift-name";
      giftName.textContent = item.gift_name || "未知礼物";
      var count = document.createElement("span");
      count.className = "gift-count";
      count.textContent = "× " + Number(item.gift_count || 0);
      giftName.appendChild(count);
      gift.appendChild(giftName);
      row.appendChild(gift);

      var status = document.createElement("div");
      var statusTag = document.createElement("span");
      statusTag.className = "reply-status " + (item.has_reply ? "replied" : "unreplied");
      statusTag.textContent = item.has_reply ? "已回复" : "未回复";
      status.appendChild(statusTag);
      row.appendChild(status);

      var reply = document.createElement("div");
      reply.className = "reply-detail";
      if (!item.has_reply) {
        reply.textContent = "尚无逐条回礼记录";
      } else {
        var replyType = item.latest_reply_type === "AUDIO_GIFT_REPLY" ? "语音回复" : "文字回复";
        reply.textContent = replyType + " · " + (item.latest_reply_bj_time || item.first_reply_bj_time || "-");
        var replyText = item.latest_reply_content || item.first_reply_content || "";
        if (replyText) {
          var content = document.createElement("div");
          content.className = "reply-content";
          content.textContent = replyText;
          reply.appendChild(content);
        }
      }
      row.appendChild(reply);
      return row;
    }

    function applyFilters(action) {
      if (dateFromInput.value && dateToInput.value && dateFromInput.value > dateToInput.value) {
        showPageError("开始日期不能晚于结束日期");
        return;
      }
      expandedSenderKeys.clear();
      historyCache.clear();
      track("admin_filter", {
        action: action,
        status: activeStatus,
        has_sender_query: Boolean(senderInput.value.trim()),
        has_date_from: Boolean(dateFromInput.value),
        has_date_to: Boolean(dateToInput.value)
      });
      if (isGiftFilterMobile()) setGiftFilterModalOpen(false);
      loadData(false);
    }

    function datasetSnapshot(data) {
      var summary = data && (data.dataset_summary || data.summary) ? (data.dataset_summary || data.summary) : {};
      return {
        totalGiftMessages: Number(summary.total_gift_messages || 0),
        totalGiftCount: Number(summary.total_gift_count || 0),
        repliedGiftMessages: Number(summary.replied_gift_messages || 0),
        unrepliedGiftMessages: Number(summary.unreplied_gift_messages || 0),
        matchedReplyMessages: Number(summary.matched_reply_messages || 0),
        unmatchedReplyMessages: Number(summary.unmatched_reply_messages || 0),
        latestGiftTime: String(summary.latest_gift_bj_time || "")
      };
    }

    function hasDataUpdate(current) {
      if (!lastDatasetSnapshot) return false;
      return JSON.stringify(current) !== JSON.stringify(lastDatasetSnapshot);
    }

    async function checkUpdates() {
      if (!password || loading || checkingUpdates || !page.classList.contains("ready")) return;
      checkingUpdates = true;
      try {
        var response = await fetch("/api/gift-replies/summary", {
          headers: { "X-Gift-Replies-Password": password },
          cache: "no-store"
        });
        if (!response.ok) return;
        var data = await response.json();
        var nextRefreshSeconds = Math.max(15, Number(data.refresh_interval_seconds || refreshSeconds || 30));
        if (nextRefreshSeconds !== refreshSeconds) {
          refreshSeconds = nextRefreshSeconds;
          resetRefreshTimer();
        }
        document.getElementById("refreshLabel").textContent = "每 " + refreshSeconds + " 秒检查更新";
        if (hasDataUpdate(datasetSnapshot(data))) {
          updatePill.classList.add("show");
        }
      } catch (error) {
        return;
      } finally {
        checkingUpdates = false;
      }
    }

    async function loadLatestData() {
      if (updatePill.disabled) return;
      updatePill.disabled = true;
      updatePill.textContent = "正在加载最新送礼数据…";
      historyCache.clear();
      track("admin_filter", {
        action: "load_newer_gift_sender_data",
        status: activeStatus,
        has_sender_query: Boolean(senderInput.value.trim()),
        has_date_from: Boolean(dateFromInput.value),
        has_date_to: Boolean(dateToInput.value)
      });
      try {
        await loadData(false);
      } finally {
        updatePill.disabled = false;
        updatePill.textContent = "有新的送礼数据，点击刷新";
      }
    }

    function resetRefreshTimer() {
      if (refreshTimer) window.clearInterval(refreshTimer);
      refreshTimer = window.setInterval(checkUpdates, refreshSeconds * 1000);
    }

    loginBtn.addEventListener("click", async function() {
      if (loginBusy) return;
      if (!loginVerified) {
        var value = passwordInput.value.trim();
        if (!value) return;
        password = value;
      }
      loginBusy = true;
      track("login_attempt", { action: "gift_reply_senders_login", result: "submitted" });
      if (!loginVerified) {
        setLoginFeedback("verifying", "正在验证密码…");
        try {
          await verifyLoginPassword();
          loginVerified = true;
        } catch (error) {
          resetLoginForPassword(error.message || "密码验证失败，请重试");
          track("login_attempt", { action: "gift_reply_senders_login", result: "failure" });
          return;
        }
      }
      setLoginFeedback("loading", "密码正确，正在加载页面内容…");
      await loadData(true);
    });
    passwordInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") loginBtn.click();
    });
    statusSegment.addEventListener("click", function(event) {
      var button = event.target.closest("button[data-status]");
      if (!button) return;
      activeStatus = button.dataset.status;
      syncStatusButtons();
      applyFilters("filter_sender_status");
    });
    document.getElementById("applyBtn").addEventListener("click", function() { applyFilters("apply_sender_filters"); });
    document.getElementById("resetBtn").addEventListener("click", function() {
      activeStatus = "all";
      senderInput.value = "";
      dateFromInput.value = DEFAULT_DATE_FROM;
      dateToInput.value = "";
      syncStatusButtons();
      applyFilters("reset_sender_filters");
    });
    senderInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") applyFilters("search_sender");
    });
    statsToggle.addEventListener("click", function() {
      var visible = page.classList.toggle("show-stats");
      statsToggle.textContent = visible ? "隐藏统计" : "统计";
      statsToggle.setAttribute("aria-expanded", visible ? "true" : "false");
      track("click", { action: visible ? "show_gift_statistics" : "hide_gift_statistics" });
    });
    updatePill.addEventListener("click", loadLatestData);
    giftFilterToggle.addEventListener("click", function() {
      setGiftFilterModalOpen(!giftFilterModal.classList.contains("open"));
    });
    giftFilterClose.addEventListener("click", function() { setGiftFilterModalOpen(false); });
    giftFilterBackdrop.addEventListener("click", function() { setGiftFilterModalOpen(false); });
    supportChatNav.addEventListener("click", function() { setChatModalOpen(true); });
    supportChatClose.addEventListener("click", function() { setChatModalOpen(false); });
    supportChatBackdrop.addEventListener("click", function() { setChatModalOpen(false); });
    supportChatStart.addEventListener("click", enterSupportChat);
    supportChatIdentifier.addEventListener("keydown", function(event) {
      if (event.key === "Enter") enterSupportChat();
    });
    supportChatForm.addEventListener("submit", submitSupportChatMessage);
    supportChatChange.addEventListener("click", changeSupportChatIdentifier);
    document.addEventListener("keydown", function(event) {
      if (event.key !== "Escape") return;
      if (supportChatModal.classList.contains("open")) {
        setChatModalOpen(false);
      } else if (giftFilterModal.classList.contains("open")) {
        setGiftFilterModalOpen(false);
      }
    });
    Array.prototype.forEach.call(document.querySelectorAll(".top-actions a"), function(link) {
      link.addEventListener("click", function() {
        track("click", { action: link.getAttribute("href") === "/room" ? "back_to_room" : "open_gift_details" });
      });
    });
    syncStatusButtons();
  })();
  </script>
</body>
</html>
