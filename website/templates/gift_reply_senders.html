<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site_title }} · 综合回礼</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117;
      --panel: #151b23;
      --panel-2: #1b2330;
      --line: #2d3848;
      --text: #e6edf3;
      --muted: #98a6b7;
      --faint: #667384;
      --teal: #40b8a8;
      --gold: #f0b84b;
      --green: #4cc27a;
      --red: #e36f6f;
      --ink: #0a0f15;
    }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      line-height: 1.45;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    #loginOverlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
    }
    #loginOverlay.hidden { display: none; }
    .login-box {
      width: min(360px, 100%);
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      padding: 28px;
    }
    .login-box h1 { font-size: 21px; margin-bottom: 8px; }
    .login-box p { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
    .login-box input {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--ink);
      color: var(--text);
      padding: 0 12px;
      outline: none;
    }
    .login-box input:focus { border-color: var(--teal); }
    .login-btn {
      width: 100%;
      min-height: 44px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: var(--teal);
      color: var(--ink);
      font-weight: 750;
    }
    .login-error { display: none; color: var(--red); font-size: 13px; margin-top: 10px; }
    .login-error.show { display: block; }
    .page { display: none; }
    .page.ready { display: block; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      border-bottom: 1px solid var(--line);
      background: rgba(13, 17, 23, 0.96);
      backdrop-filter: blur(10px);
    }
    .topbar-inner {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .title h1 { font-size: 20px; font-weight: 750; }
    .title p { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .top-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .nav-link, .btn {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      padding: 0 12px;
      text-decoration: none;
      white-space: nowrap;
    }
    .nav-link.primary, .btn.primary {
      border-color: var(--teal);
      background: var(--teal);
      color: var(--ink);
      font-weight: 750;
    }
    main { width: min(1180px, 100%); margin: 0 auto; padding: 20px 20px 40px; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 14px; }
    .stat .label { color: var(--muted); font-size: 12px; }
    .stat .value { font-size: 24px; font-weight: 760; margin-top: 5px; }
    .stat .sub { color: var(--faint); font-size: 12px; margin-top: 3px; }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(190px, 260px) minmax(120px, 150px) auto;
      gap: 10px;
      align-items: end;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      padding: 14px;
      margin-bottom: 14px;
    }
    .field label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .field input, .field select {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--ink);
      color: var(--text);
      padding: 0 10px;
      outline: none;
    }
    .field input:focus, .field select:focus { border-color: var(--teal); }
    .segment {
      display: inline-grid;
      grid-template-columns: repeat(3, minmax(78px, 1fr));
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--ink);
    }
    .segment button { border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--muted); }
    .segment button:last-child { border-right: 0; }
    .segment button.active { background: var(--teal); color: var(--ink); font-weight: 750; }
    .toolbar-actions { display: flex; gap: 8px; }
    .result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      margin: 2px 2px 10px;
    }
    .sender-list { display: grid; gap: 12px; }
    .sender-card { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
    .sender-card summary {
      list-style: none;
      cursor: pointer;
      padding: 15px 16px;
      background: var(--panel-2);
    }
    .sender-card summary::-webkit-details-marker { display: none; }
    .sender-card summary:focus-visible { outline: 2px solid var(--teal); outline-offset: -2px; }
    .sender-head { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
    .sender-name { font-size: 17px; font-weight: 760; word-break: break-word; }
    .sender-id { color: var(--faint); font-size: 12px; margin-top: 3px; word-break: break-all; }
    .sender-latest { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
    .sender-badges { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .badge {
      min-height: 24px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      padding: 0 9px;
      font-size: 12px;
    }
    .badge.unreplied { border-color: rgba(240, 184, 75, 0.42); color: var(--gold); background: rgba(240, 184, 75, 0.09); }
    .history-head, .gift-row {
      display: grid;
      grid-template-columns: 150px minmax(220px, 1fr) 100px minmax(220px, 1.2fr);
      gap: 12px;
      align-items: start;
      padding: 11px 16px;
    }
    .history-head { color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .gift-row { border-bottom: 1px solid rgba(45, 56, 72, 0.66); font-size: 13px; }
    .gift-row:last-child { border-bottom: 0; }
    .gift-time { color: var(--muted); white-space: nowrap; }
    .gift-main { display: flex; gap: 9px; align-items: center; min-width: 0; }
    .gift-icon { width: 34px; height: 34px; flex: 0 0 auto; border-radius: 7px; background: var(--panel-2); object-fit: cover; }
    .gift-name { min-width: 0; word-break: break-word; }
    .gift-count { color: var(--gold); font-weight: 730; margin-left: 4px; white-space: nowrap; }
    .reply-status { display: inline-flex; min-height: 24px; align-items: center; border-radius: 999px; padding: 0 9px; font-size: 12px; font-weight: 730; }
    .reply-status.replied { color: var(--green); background: rgba(76, 194, 122, 0.1); }
    .reply-status.unreplied { color: var(--gold); background: rgba(240, 184, 75, 0.1); }
    .reply-detail { color: var(--muted); word-break: break-word; }
    .reply-content { color: var(--text); margin-top: 3px; }
    .empty { display: none; color: var(--muted); text-align: center; padding: 52px 12px; }
    .empty.show { display: block; }
    .pagination { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; color: var(--muted); font-size: 13px; }
    .pager-actions { display: flex; gap: 8px; }
    .btn:disabled { cursor: not-allowed; opacity: 0.45; }
    .loading { opacity: 0.65; pointer-events: none; }
    @media (max-width: 820px) {
      .topbar-inner { align-items: flex-start; flex-direction: column; padding: 14px; }
      .top-actions { justify-content: flex-start; }
      main { padding: 14px 12px 32px; }
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .toolbar { grid-template-columns: 1fr; }
      .toolbar-actions .btn { flex: 1; }
      .sender-head { flex-direction: column; gap: 6px; }
      .sender-latest { text-align: left; white-space: normal; }
      .history-head { display: none; }
      .gift-row { grid-template-columns: 1fr auto; gap: 8px 12px; padding: 13px 14px; }
      .gift-time { grid-column: 1; grid-row: 1; }
      .gift-main { grid-column: 1 / -1; grid-row: 2; }
      .gift-row > :nth-child(3) { grid-column: 2; grid-row: 1; }
      .reply-detail { grid-column: 1 / -1; grid-row: 3; }
      .result-head, .pagination { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div id="loginOverlay">
    <div class="login-box">
      <h1>综合回礼</h1>
      <p>请输入礼物回复页密码</p>
      <input type="password" id="passwordInput" placeholder="密码" autocomplete="current-password" autofocus>
      <button class="login-btn" id="loginBtn" type="button">进入</button>
      <div class="login-error" id="loginError">密码错误</div>
    </div>
  </div>

  <div class="page" id="page">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="title">
          <h1>综合回礼</h1>
          <p>按送礼人整理历史礼物，最新送礼人和最新礼物优先</p>
        </div>
        <nav class="top-actions" aria-label="页面导航">
          <a class="nav-link primary" href="/room">返回 Room</a>
          <a class="nav-link" href="/gift-replies">逐条明细</a>
        </nav>
      </div>
    </header>

    <main id="mainContent">
      <section class="stats-grid" aria-label="综合回礼统计">
        <div class="stat"><div class="label">待综合回礼人数</div><div class="value" id="pendingSenders">0</div><div class="sub">至少有一条未回复礼物</div></div>
        <div class="stat"><div class="label">未回复礼物消息</div><div class="value" id="pendingMessages">0</div><div class="sub">仍按逐条真实回复判定</div></div>
        <div class="stat"><div class="label">全部送礼人数</div><div class="value" id="totalSenders">0</div><div class="sub">按用户 ID 聚合</div></div>
        <div class="stat"><div class="label">当前筛选人数</div><div class="value" id="filteredSenders">0</div><div class="sub" id="generatedAt">生成时间：-</div></div>
      </section>

      <section class="toolbar" aria-label="筛选条件">
        <div class="field">
          <label>送礼人状态</label>
          <div class="segment" id="statusSegment">
            <button type="button" data-status="unreplied" class="active">有未回复</button>
            <button type="button" data-status="all">全部</button>
            <button type="button" data-status="replied">有已回复</button>
          </div>
        </div>
        <div class="field"><label for="senderInput">送礼人</label><input id="senderInput" type="search" placeholder="昵称或用户 ID"></div>
        <div class="field">
          <label for="pageSizeSelect">每页人数</label>
          <select id="pageSizeSelect"><option value="10">10 人</option><option value="20" selected>20 人</option><option value="50">50 人</option></select>
        </div>
        <div class="toolbar-actions"><button class="btn primary" id="applyBtn" type="button">筛选</button><button class="btn" id="resetBtn" type="button">重置</button></div>
      </section>

      <div class="result-head"><span id="resultSummary">共 0 人</span><span id="refreshLabel">数据每 30 秒刷新</span></div>
      <section class="sender-list" id="senderList" aria-label="按送礼人整理的礼物历史"></section>
      <div class="empty" id="emptyState">当前筛选条件下没有送礼人</div>
      <div class="pagination">
        <div id="pageInfo">第 1 / 1 页</div>
        <div class="pager-actions"><button class="btn" id="prevBtn" type="button">上一页</button><button class="btn" id="nextBtn" type="button">下一页</button></div>
      </div>
    </main>
  </div>

  <script src="/static/js/tracker.js?v={{ static_version('js/tracker.js') }}"></script>
  <script>
  (function() {
    "use strict";
    var password = "";
    var currentPage = 1;
    var totalPages = 1;
    var activeStatus = "unreplied";
    var refreshSeconds = 30;
    var refreshTimer = null;
    var loading = false;

    var loginOverlay = document.getElementById("loginOverlay");
    var loginError = document.getElementById("loginError");
    var passwordInput = document.getElementById("passwordInput");
    var loginBtn = document.getElementById("loginBtn");
    var page = document.getElementById("page");
    var mainContent = document.getElementById("mainContent");
    var statusSegment = document.getElementById("statusSegment");
    var senderInput = document.getElementById("senderInput");
    var pageSizeSelect = document.getElementById("pageSizeSelect");
    var senderList = document.getElementById("senderList");
    var emptyState = document.getElementById("emptyState");
    var prevBtn = document.getElementById("prevBtn");
    var nextBtn = document.getElementById("nextBtn");

    function track(eventType, data) {
      if (!window._trackEvent) return;
      window._trackEvent(eventType, Object.assign({ area: "gift_reply_senders" }, data || {}));
    }

    function setLoading(value) {
      loading = value;
      mainContent.classList.toggle("loading", value);
    }

    function syncStatusButtons() {
      Array.prototype.forEach.call(statusSegment.querySelectorAll("button[data-status]"), function(button) {
        var selected = button.dataset.status === activeStatus;
        button.classList.toggle("active", selected);
        button.setAttribute("aria-pressed", selected ? "true" : "false");
      });
    }

    function queryString() {
      var params = new URLSearchParams();
      params.set("page", String(currentPage));
      params.set("page_size", pageSizeSelect.value || "20");
      params.set("status", activeStatus);
      params.set("sender", senderInput.value.trim());
      return params.toString();
    }

    async function loadData(loginAttempt) {
      if (!password || loading) return;
      setLoading(true);
      try {
        var response = await fetch("/api/gift-replies/senders?" + queryString(), {
          headers: { "X-Gift-Replies-Password": password },
          cache: "no-store"
        });
        if (!response.ok) {
          if (response.status === 401 || response.status === 403) {
            loginError.classList.add("show");
            loginOverlay.classList.remove("hidden");
            page.classList.remove("ready");
            if (loginAttempt) track("login_attempt", { action: "gift_reply_senders_login", result: "failure" });
          }
          return;
        }
        var data = await response.json();
        loginError.classList.remove("show");
        loginOverlay.classList.add("hidden");
        page.classList.add("ready");
        if (loginAttempt) track("login_attempt", { action: "gift_reply_senders_login", result: "success" });
        render(data);
      } catch (error) {
        loginError.textContent = "数据加载失败，请稍后重试";
        loginError.classList.add("show");
      } finally {
        setLoading(false);
      }
    }

    function render(data) {
      var senderSummary = data.sender_summary || {};
      var summary = data.summary || {};
      currentPage = Number(data.page || 1);
      totalPages = Number(data.total_pages || 1);
      refreshSeconds = Math.max(15, Number(data.refresh_interval_seconds || 30));
      document.getElementById("pendingSenders").textContent = String(senderSummary.senders_with_unreplied || 0);
      document.getElementById("pendingMessages").textContent = String(summary.unreplied_gift_messages || 0);
      document.getElementById("totalSenders").textContent = String(senderSummary.total_senders || 0);
      document.getElementById("filteredSenders").textContent = String(senderSummary.filtered_senders || 0);
      document.getElementById("generatedAt").textContent = "生成时间：" + (data.generated_at || "-");
      document.getElementById("resultSummary").textContent = "共 " + Number(data.total || 0) + " 人，当前显示 " + (data.items || []).length + " 人";
      document.getElementById("refreshLabel").textContent = "数据每 " + refreshSeconds + " 秒刷新";
      document.getElementById("pageInfo").textContent = "第 " + currentPage + " / " + totalPages + " 页";
      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= totalPages;
      renderSenders(data.items || []);
      resetRefreshTimer();
    }

    function renderSenders(groups) {
      senderList.replaceChildren();
      emptyState.classList.toggle("show", groups.length === 0);
      groups.forEach(function(group) {
        senderList.appendChild(createSenderCard(group));
      });
    }

    function createSenderCard(group) {
      var details = document.createElement("details");
      details.className = "sender-card";
      details.open = true;
      var summary = document.createElement("summary");
      var head = document.createElement("div");
      head.className = "sender-head";
      var identity = document.createElement("div");
      var name = document.createElement("div");
      name.className = "sender-name";
      name.textContent = group.sender_name || "未知用户";
      identity.appendChild(name);
      if (group.sender_id) {
        var id = document.createElement("div");
        id.className = "sender-id";
        id.textContent = "用户 ID：" + group.sender_id;
        identity.appendChild(id);
      }
      var latest = document.createElement("div");
      latest.className = "sender-latest";
      latest.textContent = "最新送礼：" + (group.latest_gift_bj_time || "-");
      head.appendChild(identity);
      head.appendChild(latest);
      summary.appendChild(head);
      var badges = document.createElement("div");
      badges.className = "sender-badges";
      badges.appendChild(createBadge("未回复 " + Number(group.unreplied_messages || 0) + " 条", "unreplied"));
      badges.appendChild(createBadge("历史 " + Number(group.total_messages || 0) + " 条"));
      badges.appendChild(createBadge("礼物合计 " + Number(group.total_gift_count || 0) + " 个"));
      badges.appendChild(createBadge("已回复 " + Number(group.replied_messages || 0) + " 条"));
      summary.appendChild(badges);
      details.appendChild(summary);

      var historyHead = document.createElement("div");
      historyHead.className = "history-head";
      ["送礼时间", "礼物", "回复状态", "回复记录"].forEach(function(label) {
        var cell = document.createElement("div");
        cell.textContent = label;
        historyHead.appendChild(cell);
      });
      details.appendChild(historyHead);
      (group.items || []).forEach(function(item) {
        details.appendChild(createGiftRow(item));
      });
      details.addEventListener("toggle", function() {
        track("click", { action: details.open ? "expand_sender_history" : "collapse_sender_history", gift_count: Number(group.total_messages || 0) });
      });
      return details;
    }

    function createBadge(text, extraClass) {
      var badge = document.createElement("span");
      badge.className = "badge" + (extraClass ? " " + extraClass : "");
      badge.textContent = text;
      return badge;
    }

    function createGiftRow(item) {
      var row = document.createElement("div");
      row.className = "gift-row";
      var time = document.createElement("div");
      time.className = "gift-time";
      time.textContent = item.gift_bj_time || "-";
      row.appendChild(time);

      var gift = document.createElement("div");
      gift.className = "gift-main";
      if (item.gift_icon_url) {
        var image = document.createElement("img");
        image.className = "gift-icon";
        image.src = item.gift_icon_url;
        image.alt = "";
        image.loading = "lazy";
        image.referrerPolicy = "no-referrer";
        gift.appendChild(image);
      }
      var giftName = document.createElement("div");
      giftName.className = "gift-name";
      giftName.textContent = item.gift_name || "未知礼物";
      var count = document.createElement("span");
      count.className = "gift-count";
      count.textContent = "× " + Number(item.gift_count || 0);
      giftName.appendChild(count);
      gift.appendChild(giftName);
      row.appendChild(gift);

      var status = document.createElement("div");
      var statusTag = document.createElement("span");
      statusTag.className = "reply-status " + (item.has_reply ? "replied" : "unreplied");
      statusTag.textContent = item.has_reply ? "已回复" : "未回复";
      status.appendChild(statusTag);
      row.appendChild(status);

      var reply = document.createElement("div");
      reply.className = "reply-detail";
      if (!item.has_reply) {
        reply.textContent = "尚无逐条回礼记录";
      } else {
        var replyType = item.latest_reply_type === "AUDIO_GIFT_REPLY" ? "语音回复" : "文字回复";
        reply.textContent = replyType + " · " + (item.latest_reply_bj_time || item.first_reply_bj_time || "-");
        var replyText = item.latest_reply_content || item.first_reply_content || "";
        if (replyText) {
          var content = document.createElement("div");
          content.className = "reply-content";
          content.textContent = replyText;
          reply.appendChild(content);
        }
      }
      row.appendChild(reply);
      return row;
    }

    function applyFilters(action) {
      currentPage = 1;
      track("admin_filter", {
        action: action,
        status: activeStatus,
        has_sender_query: Boolean(senderInput.value.trim()),
        page_size: Number(pageSizeSelect.value || 20)
      });
      loadData(false);
    }

    function resetRefreshTimer() {
      if (refreshTimer) window.clearInterval(refreshTimer);
      refreshTimer = window.setInterval(function() { loadData(false); }, refreshSeconds * 1000);
    }

    loginBtn.addEventListener("click", function() {
      var value = passwordInput.value.trim();
      if (!value) return;
      password = value;
      loginError.textContent = "密码错误";
      loginError.classList.remove("show");
      track("login_attempt", { action: "gift_reply_senders_login", result: "submitted" });
      loadData(true);
    });
    passwordInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") loginBtn.click();
    });
    statusSegment.addEventListener("click", function(event) {
      var button = event.target.closest("button[data-status]");
      if (!button) return;
      activeStatus = button.dataset.status;
      syncStatusButtons();
      applyFilters("filter_sender_status");
    });
    document.getElementById("applyBtn").addEventListener("click", function() { applyFilters("apply_sender_filters"); });
    document.getElementById("resetBtn").addEventListener("click", function() {
      activeStatus = "unreplied";
      senderInput.value = "";
      pageSizeSelect.value = "20";
      syncStatusButtons();
      applyFilters("reset_sender_filters");
    });
    senderInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") applyFilters("search_sender");
    });
    prevBtn.addEventListener("click", function() {
      if (currentPage <= 1) return;
      currentPage -= 1;
      track("click", { action: "sender_page_previous", page: currentPage });
      loadData(false);
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    nextBtn.addEventListener("click", function() {
      if (currentPage >= totalPages) return;
      currentPage += 1;
      track("click", { action: "sender_page_next", page: currentPage });
      loadData(false);
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".top-actions a"), function(link) {
      link.addEventListener("click", function() {
        track("click", { action: link.getAttribute("href") === "/room" ? "back_to_room" : "open_gift_details" });
      });
    });
    syncStatusButtons();
  })();
  </script>
</body>
</html>
