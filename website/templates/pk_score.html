<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>房间计分 PK · {{ site_title }}</title>
  <style>
    :root {
      --bg: #f5f2ee;
      --paper: rgba(255, 255, 255, .92);
      --ink: #24201e;
      --muted: #756d68;
      --line: #e7ded7;
      --red: #db5c65;
      --red-soft: #fff0f1;
      --blue: #5878d8;
      --blue-soft: #eef2ff;
      --gold: #ba832e;
      --green: #3c8d6a;
      --shadow: 0 22px 65px rgba(78, 60, 48, .11);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 8% 5%, rgba(219, 92, 101, .16), transparent 32%),
        radial-gradient(circle at 94% 12%, rgba(88, 120, 216, .15), transparent 34%),
        var(--bg);
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }
    .shell { width: min(1100px, 100%); margin: 0 auto; padding: 24px 20px 42px; }
    .login-wrap { min-height: 84vh; display: grid; place-items: center; }
    .login-card {
      width: min(410px, 100%); padding: 30px; border: 1px solid var(--line);
      border-radius: 24px; background: var(--paper); box-shadow: var(--shadow); backdrop-filter: blur(16px);
    }
    .login-mark { font-size: 38px; }
    .login-card h1 { margin: 10px 0 8px; font-size: 25px; }
    .login-card p { margin: 0 0 18px; color: var(--muted); line-height: 1.65; font-size: 14px; }
    .login-card input {
      width: 100%; min-height: 46px; padding: 0 14px; border: 1px solid var(--line);
      border-radius: 12px; background: white; color: var(--ink); outline: none;
    }
    .login-card input:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(219, 92, 101, .11); }
    .primary {
      width: 100%; min-height: 46px; margin-top: 12px; border: 0; border-radius: 12px;
      background: var(--ink); color: white; font-weight: 750;
    }
    .primary:disabled { cursor: wait; opacity: .66; }
    .login-state { min-height: 22px; margin-top: 10px; color: var(--red); font-size: 13px; }
    .login-state.status { color: var(--muted); }
    .login-state.success { color: var(--green); }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .eyebrow { color: var(--gold); font-size: 12px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .topbar h1 { margin: 5px 0 5px; font-size: clamp(26px, 5vw, 43px); letter-spacing: -.045em; }
    .topbar p { margin: 0; color: var(--muted); font-size: 14px; }
    .live-state { text-align: right; color: var(--muted); font-size: 12px; line-height: 1.7; white-space: nowrap; }
    .score-nav { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .score-nav a { display: inline-flex; align-items: center; min-height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); background: rgba(255,255,255,.7); text-decoration: none; font-size: 12px; }
    .score-nav a:hover, .score-nav a:focus-visible { border-color: var(--blue); color: var(--blue); outline: none; }
    .live-line { color: var(--green); font-weight: 750; }
    .live-dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(60, 141, 106, .12); }
    .leader-card {
      display: flex; align-items: center; justify-content: space-between; gap: 18px;
      margin-bottom: 14px; padding: 17px 20px; border: 1px solid rgba(186, 131, 46, .25);
      border-radius: 18px; background: linear-gradient(120deg, #fffaf0, rgba(255,255,255,.88));
    }
    .leader-label { color: var(--muted); font-size: 12px; }
    .leader-value { margin-top: 3px; font-size: 20px; font-weight: 800; }
    .leader-total { color: var(--gold); font-size: 13px; text-align: right; }
    .duel { display: grid; grid-template-columns: 1fr 70px 1fr; align-items: stretch; gap: 12px; }
    .competitor {
      min-width: 0; padding: 22px; border: 1px solid var(--line); border-radius: 22px;
      background: var(--paper); box-shadow: var(--shadow); position: relative; overflow: hidden;
    }
    .competitor::before { content: ""; position: absolute; inset: 0 0 auto; height: 5px; background: var(--accent); }
    .competitor.red { --accent: var(--red); --soft: var(--red-soft); }
    .competitor.blue { --accent: var(--blue); --soft: var(--blue-soft); }
    .member-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .member-name { font-size: 22px; font-weight: 820; }
    .rank-tag { padding: 4px 9px; border-radius: 999px; background: var(--soft); color: var(--accent); font-size: 12px; font-weight: 760; }
    .total-label { margin-top: 23px; color: var(--muted); font-size: 12px; }
    .total-score { margin-top: 2px; color: var(--accent); font-size: clamp(38px, 7vw, 62px); font-weight: 850; letter-spacing: -.045em; line-height: 1; }
    .total-score small { margin-left: 4px; font-size: 15px; letter-spacing: 0; }
    .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 22px; }
    .score-cell { padding: 12px; border-radius: 13px; background: var(--soft); }
    .score-cell span { display: block; color: var(--muted); font-size: 11px; }
    .score-cell strong { display: block; margin-top: 4px; font-size: 18px; }
    .member-meta { margin-top: 15px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .source-warn { color: var(--red); }
    .versus { display: grid; place-items: center; color: #9a8e87; font-size: 15px; font-weight: 850; }
    .versus span { display: grid; place-items: center; width: 52px; height: 52px; border: 1px solid var(--line); border-radius: 50%; background: white; }
    .share { margin: 15px 0 24px; }
    .share-bar { display: flex; height: 10px; overflow: hidden; border-radius: 999px; background: #e8e3df; }
    .share-bar span { min-width: 2px; transition: width .35s ease; }
    .share-a { background: var(--red); }
    .share-b { background: var(--blue); }
    .share-labels { display: flex; justify-content: space-between; margin-top: 7px; color: var(--muted); font-size: 11px; }
    .section-head { display: flex; justify-content: space-between; gap: 14px; align-items: end; margin-bottom: 10px; }
    .section-head h2 { margin: 0; font-size: 19px; }
    .section-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .ghost { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: white; color: var(--ink); }
    .timeline { border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--paper); }
    .gift-row { display: grid; grid-template-columns: 155px 110px minmax(120px, 1fr) minmax(130px, 1fr) 90px; gap: 12px; align-items: center; padding: 14px 17px; border-bottom: 1px solid var(--line); font-size: 13px; }
    .gift-row:last-child { border-bottom: 0; }
    .gift-time, .gift-sender { color: var(--muted); }
    .gift-member { font-weight: 780; }
    .gift-score { text-align: right; color: var(--gold); font-weight: 820; font-variant-numeric: tabular-nums; }
    .empty { padding: 34px 18px; color: var(--muted); text-align: center; line-height: 1.7; }
    footer { margin-top: 24px; color: var(--muted); text-align: center; font-size: 11px; line-height: 1.8; }
    footer a { color: inherit; }
    @media (max-width: 760px) {
      .shell { padding: 18px 13px 32px; }
      .topbar { display: block; }
      .live-state { margin-top: 10px; text-align: left; }
      .duel { grid-template-columns: 1fr; }
      .versus { height: 20px; }
      .versus span { width: 42px; height: 42px; position: relative; z-index: 2; }
      .competitor { padding: 19px; }
      .total-score { font-size: 44px; }
      .gift-row { grid-template-columns: 1fr auto; gap: 5px 12px; }
      .gift-time, .gift-sender, .gift-name { grid-column: 1; }
      .gift-member, .gift-score { grid-column: 2; text-align: right; }
      .gift-member { grid-row: 1; }
      .gift-score { grid-row: 2 / span 2; align-self: center; font-size: 17px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section id="loginWrap" class="login-wrap">
      <form id="loginForm" class="login-card">
        <div class="login-mark">⚡</div>
        <h1>房间计分 PK</h1>
        <p>查看 17:15 之后双方的新增积分，以及计入基础分后的实时累计。</p>
        <input id="passwordInput" type="password" autocomplete="current-password" placeholder="请输入访问密码" required>
        <button id="loginBtn" class="primary" type="submit">验证并进入</button>
        <div id="loginState" class="login-state" role="alert"></div>
      </form>
    </section>

    <section id="app" hidden>
      <header class="topbar">
        <div>
          <div class="eyebrow">Live Room Score</div>
          <h1 id="eventTitle">房间计分 PK</h1>
          <p id="startText">统计起点加载中</p>
        </div>
        <div class="live-state">
          <div class="live-line"><span class="live-dot"></span>自动更新中</div>
          <div id="generatedText">等待数据</div>
          <nav class="score-nav" aria-label="计分页面导航">
            <a href="/score-gifts" data-track="score_nav_gifts">计分礼物</a>
          </nav>
        </div>
      </header>

      <section class="leader-card">
        <div>
          <div class="leader-label">当前局势</div>
          <div id="leaderText" class="leader-value">计算中</div>
        </div>
        <div id="newScoreText" class="leader-total"></div>
      </section>

      <section class="duel">
        <article id="competitorA" class="competitor red"></article>
        <div class="versus"><span>VS</span></div>
        <article id="competitorB" class="competitor blue"></article>
      </section>

      <section class="share" aria-label="累计积分占比">
        <div class="share-bar"><span id="shareA" class="share-a"></span><span id="shareB" class="share-b"></span></div>
        <div class="share-labels"><span id="shareLabelA"></span><span id="shareLabelB"></span></div>
      </section>

      <section>
        <div class="section-head">
          <div><h2>17:15 后计分明细</h2><p id="detailMeta">等待数据</p></div>
          <button id="refreshBtn" class="ghost" type="button">立即刷新</button>
        </div>
        <div id="timeline" class="timeline"><div class="empty">正在加载计分数据…</div></div>
      </section>

      <footer>
        <div>统计仅采用房间计分礼物；累计积分 = 17:15 前基础分 + 17:15 后新增积分。</div>
        {% if site_police_icp %}<a href="https://beian.mps.gov.cn/#/query/webSearch?code={{ site_police_icp_code }}" target="_blank" rel="noopener noreferrer">{{ site_police_icp }}</a>{% endif %}
        {% if site_icp %}<span> · </span><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">{{ site_icp }}</a>{% endif %}
      </footer>
    </section>
  </main>

  <script src="/static/js/tracker.js?v={{ static_version('js/tracker.js') }}"></script>
  <script>
  (function() {
    "use strict";
    var password = "";
    var loginVerified = false;
    var refreshTimer = null;
    var loginWrap = document.getElementById("loginWrap");
    var loginForm = document.getElementById("loginForm");
    var loginBtn = document.getElementById("loginBtn");
    var passwordInput = document.getElementById("passwordInput");
    var loginState = document.getElementById("loginState");
    var app = document.getElementById("app");
    var refreshBtn = document.getElementById("refreshBtn");

    function track(eventType, data) {
      if (typeof window.trackEvent === "function") {
        window.trackEvent(eventType, Object.assign({ area: "pk_score" }, data || {}));
      }
    }

    function setLoginState(text, kind) {
      loginState.textContent = text || "";
      loginState.className = "login-state" + (kind ? " " + kind : "");
    }

    async function request(path) {
      var response = await fetch(path, { headers: { "X-PK-Score-Password": password }, cache: "no-store" });
      var body = await response.json().catch(function() { return {}; });
      if (!response.ok) throw new Error(body.detail || "数据加载失败");
      return body;
    }

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();
      if (!loginVerified) password = passwordInput.value;
      if (!password) return;
      loginBtn.disabled = true;
      setLoginState(loginVerified ? "正在重试加载数据…" : "正在验证密码…", "status");
      if (!loginVerified) track("login_attempt", { action: "pk_score_login", result: "submitted" });
      try {
        if (!loginVerified) {
          await request("/api/pk-score/verify");
          loginVerified = true;
          setLoginState("密码正确，正在加载数据…", "success");
        }
        var doc = await request("/api/pk-score/data");
        render(doc);
        loginWrap.hidden = true;
        app.hidden = false;
        passwordInput.value = "";
        track("login_attempt", { action: "pk_score_login", result: "success" });
      } catch (error) {
        if (loginVerified) {
          setLoginState((error.message || "数据加载失败") + "，可直接重试加载");
          loginBtn.textContent = "重试加载";
        } else {
          setLoginState(error.message || "验证失败");
          track("login_attempt", { action: "pk_score_login", result: "failure" });
        }
      } finally {
        loginBtn.disabled = false;
        if (!loginVerified) loginBtn.textContent = "验证并进入";
      }
    });

    refreshBtn.addEventListener("click", function() {
      loadData(true);
    });

    async function loadData(manual) {
      refreshBtn.disabled = true;
      refreshBtn.textContent = "刷新中…";
      try {
        var doc = await request("/api/pk-score/data");
        render(doc);
        if (manual) track("admin_update", { action: "pk_score_refresh", result: "success" });
      } catch (error) {
        document.getElementById("generatedText").textContent = error.message || "刷新失败";
        if (manual) track("admin_update", { action: "pk_score_refresh", result: "failure" });
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.textContent = "立即刷新";
      }
    }

    function render(doc) {
      var competitors = Array.isArray(doc.competitors) ? doc.competitors : [];
      if (competitors.length !== 2) throw new Error("双方数据不完整");
      document.getElementById("eventTitle").textContent = doc.title || "房间计分 PK";
      document.getElementById("startText").textContent = "统计起点：" + (doc.starts_at || "-") + "（北京时间）";
      document.getElementById("generatedText").textContent = "更新于 " + (doc.generated_at || "-");

      var summary = doc.summary || {};
      document.getElementById("leaderText").textContent = summary.leader_name
        ? summary.leader_name + "领先 " + score(summary.score_gap) + " 分"
        : "双方暂时持平";
      document.getElementById("newScoreText").textContent = "双方合计新增 " + score(summary.total_new_score) + " 分";
      renderCompetitor(document.getElementById("competitorA"), competitors[0], summary.leader_name);
      renderCompetitor(document.getElementById("competitorB"), competitors[1], summary.leader_name);
      renderShare(competitors);
      renderItems(Array.isArray(doc.items) ? doc.items : []);

      window.clearInterval(refreshTimer);
      refreshTimer = window.setInterval(function() { loadData(false); }, Math.max(10, Number(doc.refresh_interval_seconds || 30)) * 1000);
    }

    function renderCompetitor(node, item, leaderName) {
      node.textContent = "";
      var row = element("div", "member-row");
      row.appendChild(element("div", "member-name", item.name || "成员"));
      row.appendChild(element("div", "rank-tag", leaderName === item.name ? "领先" : "追赶中"));
      node.appendChild(row);
      node.appendChild(element("div", "total-label", "当前累计积分"));
      var total = element("div", "total-score", score(item.total_score));
      total.appendChild(element("small", "", "分"));
      node.appendChild(total);
      var grid = element("div", "score-grid");
      grid.appendChild(scoreCell("17:15 前基础", item.base_score));
      grid.appendChild(scoreCell("17:15 后新增", item.new_score, "+"));
      node.appendChild(grid);
      var sourceText = item.source_status === "ready"
        ? "数据源更新：" + (item.source_updated_at || "-")
        : "房间数据源尚未就绪";
      var meta = element("div", "member-meta" + (item.source_status === "ready" ? "" : " source-warn"));
      meta.appendChild(document.createTextNode("计分礼物 " + Number(item.gift_records || 0) + " 条 · 礼物 " + Number(item.gift_count || 0) + " 个"));
      meta.appendChild(document.createElement("br"));
      meta.appendChild(document.createTextNode(sourceText));
      node.appendChild(meta);
    }

    function scoreCell(label, value, prefix) {
      var cell = element("div", "score-cell");
      cell.appendChild(element("span", "", label));
      cell.appendChild(element("strong", "", (prefix || "") + score(value)));
      return cell;
    }

    function renderShare(competitors) {
      var first = Number(competitors[0].total_score || 0);
      var second = Number(competitors[1].total_score || 0);
      var total = first + second;
      var firstPercent = total ? first / total * 100 : 50;
      document.getElementById("shareA").style.width = firstPercent + "%";
      document.getElementById("shareB").style.width = (100 - firstPercent) + "%";
      document.getElementById("shareLabelA").textContent = competitors[0].name + " " + firstPercent.toFixed(1) + "%";
      document.getElementById("shareLabelB").textContent = competitors[1].name + " " + (100 - firstPercent).toFixed(1) + "%";
    }

    function renderItems(items) {
      var timeline = document.getElementById("timeline");
      timeline.textContent = "";
      document.getElementById("detailMeta").textContent = "共 " + items.length + " 条计分礼物，按时间倒序";
      if (!items.length) {
        timeline.appendChild(element("div", "empty", "17:15 后暂时还没有新增计分礼物。"));
        return;
      }
      items.forEach(function(item) {
        var row = element("div", "gift-row");
        row.appendChild(element("div", "gift-time", item.event_time || "-"));
        row.appendChild(element("div", "gift-member", item.competitor_name || "-"));
        row.appendChild(element("div", "gift-sender", item.sender_name || "未知用户"));
        row.appendChild(element("div", "gift-name", (item.gift_name || "计分礼物") + " × " + Number(item.gift_count || 0)));
        row.appendChild(element("div", "gift-score", "+" + score(item.total_score)));
        timeline.appendChild(row);
      });
    }

    function element(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function score(value) {
      return Number(value || 0).toLocaleString("zh-CN", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    }
  })();
  </script>
</body>
</html>
