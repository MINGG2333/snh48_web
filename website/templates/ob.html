<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site_title }} · 观察</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0e17;
      --surface: #131a2b;
      --surface-hover: #1a2440;
      --border: #1e2d4a;
      --text: #c8d6e5;
      --text-dim: #6b7f99;
      --accent: #7c4dff;
      --accent-glow: rgba(124, 77, 255, 0.15);
      --notif: #ff4757;
      --green: #2ed573;
      --gold: #ffa502;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Login Overlay ── */
    #loginOverlay {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }
    #loginOverlay.hidden { display: none; }
    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      width: 340px;
      text-align: center;
    }
    .login-box h1 { font-size: 24px; margin-bottom: 8px; }
    .login-box p { color: var(--text-dim); font-size: 14px; margin-bottom: 24px; }
    .login-box input {
      width: 100%; padding: 12px 16px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); font-size: 16px;
      outline: none; transition: border-color .2s;
    }
    .login-box input:focus { border-color: var(--accent); }
    .login-box input::placeholder { color: var(--text-dim); }
    .login-box .error { color: var(--notif); font-size: 13px; margin-top: 12px; display: none; }
    .login-box .error.show { display: block; }
    .login-box .error.status { color: var(--accent); }
    .login-box .error.success { color: var(--green); }
    .login-btn {
      width: 100%; margin-top: 16px; padding: 12px;
      background: var(--accent); border: none; border-radius: 10px;
      color: #fff; font-size: 16px; cursor: pointer;
      transition: opacity .2s;
    }
    .login-btn:hover { opacity: .85; }
    .login-btn:disabled { cursor: wait; opacity: .68; }

    /* ── Header ── */
    header {
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    header .stats { color: var(--text-dim); font-size: 13px; }
    header .stats span { color: var(--accent); font-weight: 600; }

    .inbox-panel {
      display: none;
      margin: 20px 32px 0;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
    }
    .inbox-panel.visible { display: block; }
    .inbox-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .inbox-header h2 { font-size: 16px; }
    .inbox-count { color: var(--gold); font-size: 13px; }
    .inbox-list { display: grid; gap: 10px; }
    .inbox-item { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--bg); }
    .inbox-item-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .origin-chip { border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 600; }
    .origin-chip.tencent { color: #60a5fa; background: rgba(96,165,250,.14); border: 1px solid rgba(96,165,250,.35); }
    .origin-chip.aliyun { color: #f59e0b; background: rgba(245,158,11,.14); border: 1px solid rgba(245,158,11,.35); }
    .inbox-status { color: var(--text-dim); font-size: 11px; }
    .inbox-time { margin-left: auto; color: var(--text-dim); font-size: 11px; }
    .inbox-detail { margin-top: 8px; color: var(--text-dim); font-size: 13px; white-space: pre-wrap; word-break: break-word; }
    .inbox-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .inbox-action { border: 1px solid var(--border); background: transparent; color: var(--text); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 11px; }
    .inbox-action:hover { border-color: var(--accent); }
    .chat-admin-panel {
      display: none;
      margin: 20px 32px 0;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
    }
    .chat-admin-panel.visible { display: block; }
    .chat-admin-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .chat-admin-header h2 { font-size: 16px; }
    .chat-admin-count { color: var(--gold); font-size: 13px; }
    .chat-admin-layout { display: grid; grid-template-columns: minmax(180px, 0.72fr) minmax(0, 1.28fr); gap: 12px; }
    .chat-admin-list,
    .chat-admin-detail { min-height: 280px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); }
    .chat-admin-list { max-height: 480px; overflow-y: auto; padding: 8px; }
    .chat-admin-item { width: 100%; display: grid; gap: 4px; padding: 10px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--text); text-align: left; cursor: pointer; }
    .chat-admin-item:hover, .chat-admin-item.active { border-color: var(--accent); background: var(--surface-hover); }
    .chat-admin-item.pending .chat-admin-item-title { color: var(--gold); }
    .chat-admin-item-title { font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    .chat-admin-item-meta { color: var(--text-dim); font-size: 11px; }
    .chat-admin-detail { display: flex; flex-direction: column; overflow: hidden; }
    .chat-admin-detail-head { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text-dim); font-size: 12px; }
    .chat-admin-messages { min-height: 0; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 12px; }
    .chat-admin-message { max-width: 84%; display: grid; gap: 3px; }
    .chat-admin-message.visitor { align-self: flex-start; }
    .chat-admin-message.support { align-self: flex-end; text-align: right; }
    .chat-admin-bubble { padding: 8px 10px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; font-size: 12px; line-height: 1.5; }
    .chat-admin-message.visitor .chat-admin-bubble { background: var(--surface-hover); }
    .chat-admin-message.support .chat-admin-bubble { background: rgba(124, 77, 255, 0.2); }
    .chat-admin-time { color: var(--text-dim); font-size: 10px; }
    .chat-admin-composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
    .chat-admin-composer textarea { min-width: 0; flex: 1; min-height: 40px; max-height: 110px; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); resize: vertical; outline: none; font: inherit; font-size: 12px; }
    .chat-admin-composer textarea:focus { border-color: var(--accent); }
    .chat-admin-send { flex: 0 0 auto; align-self: flex-end; padding: 8px 12px; border: 1px solid var(--accent); border-radius: 8px; background: rgba(124, 77, 255, 0.18); color: var(--text); cursor: pointer; font-size: 12px; }
    .chat-admin-send:hover, .chat-admin-send:focus-visible { background: rgba(124, 77, 255, 0.3); outline: none; }
    .chat-admin-send:disabled { cursor: wait; opacity: .55; }
    .chat-admin-empty { display: grid; place-items: center; min-height: 260px; padding: 20px; color: var(--text-dim); font-size: 12px; text-align: center; }

    .ob-note {
      display: none;
      margin: 16px 32px 0;
      padding: 12px 16px;
      border: 1px solid rgba(124, 77, 255, 0.3);
      border-radius: 12px;
      background: rgba(124, 77, 255, 0.08);
      color: var(--text-dim);
      font-size: 12px;
      line-height: 1.7;
    }
    .ob-note.visible { display: block; }

    /* ── Estimated visitor profiles ── */
    .groups-container {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      padding: 24px 32px;
      flex: 1;
      align-content: flex-start;
    }
    .groups-container.empty {
      display: flex; align-items: center; justify-content: center;
      color: var(--text-dim); font-size: 15px;
    }
    .groups-container.empty::before { content: '暂无数据'; }

    .group-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      cursor: pointer;
      transition: all .25s ease;
      position: relative;
      width: fit-content;
      max-width: 360px;
    }
    .group-card:hover {
      border-color: var(--accent);
      background: var(--surface-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--accent-glow);
    }
    .group-card:active { transform: translateY(0); }
    .group-card.legacy { border-color: rgba(255, 165, 2, 0.35); }

    .profile-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .profile-title { font-size: 14px; font-weight: 650; word-break: break-word; }
    .profile-kind {
      flex-shrink: 0;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 10px;
      color: var(--green);
      border: 1px solid rgba(46, 213, 115, 0.35);
      background: rgba(46, 213, 115, 0.09);
    }
    .profile-kind.legacy {
      color: var(--gold);
      border-color: rgba(255, 165, 2, 0.35);
      background: rgba(255, 165, 2, 0.09);
    }
    .profile-metrics { margin-top: 8px; color: var(--text-dim); font-size: 11px; }
    .profile-facts { display: grid; gap: 6px; margin-top: 10px; }
    .profile-fact { display: flex; align-items: flex-start; gap: 6px; font-size: 11px; }
    .profile-fact-label { color: var(--text-dim); flex-shrink: 0; }
    .profile-fact-values { display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; }
    .fact-chip {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 8px;
      color: var(--text);
      background: rgba(255,255,255,.025);
      overflow-wrap: anywhere;
    }
    .fact-chip.network { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* Notification badge */
    .notif-badge {
      position: absolute;
      top: -6px; right: -6px;
      background: var(--notif);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      min-width: 22px; height: 22px;
      border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 6px;
      box-shadow: 0 2px 8px rgba(255, 71, 87, 0.4);
    }

    /* User avatars */
    .group-users {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .user-chip {
      background: rgba(124, 77, 255, 0.1);
      border: 1px solid rgba(124, 77, 255, 0.2);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 12px;
      color: var(--accent);
      font-family: monospace;
    }
    .group-time {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 12px;
    }

    /* ── Modal ── */
    #eventModal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      display: none;
      backdrop-filter: blur(4px);
    }
    #eventModal.open { display: flex; align-items: center; justify-content: center; }

    .modal-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 90%;
      max-width: 800px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: modalIn .25s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .modal-header h2 { font-size: 16px; }
    .modal-header .users-list { font-size: 12px; color: var(--text-dim); }
    .modal-close {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      transition: all .2s;
    }
    .modal-close:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .modal-body {
      padding: 16px 24px;
      overflow-y: auto;
      flex: 1;
    }

    .profile-summary {
      display: grid;
      gap: 14px;
      padding: 4px 0 16px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .summary-block h3 { font-size: 12px; margin-bottom: 7px; color: var(--text); }
    .summary-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .summary-chip {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 8px;
      color: var(--text-dim);
      font-size: 11px;
      overflow-wrap: anywhere;
    }
    .summary-chip.network { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .legacy-hint { color: var(--gold); font-size: 11px; line-height: 1.6; }
    .visits-list { display: grid; gap: 6px; }
    .visit-row {
      display: grid;
      grid-template-columns: minmax(118px, auto) minmax(90px, 1fr) minmax(130px, 1.2fr) minmax(105px, auto);
      gap: 8px;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 11px;
    }
    .visit-time, .visit-device { color: var(--text-dim); }
    .visit-page { color: var(--accent); overflow-wrap: anywhere; }
    .visit-ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }

    /* ── Notification Nav ── */
    .notif-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 71, 87, 0.05);
      flex-shrink: 0;
      overflow-y: auto;
      max-height: 140px;
      align-content: flex-start;
    }
    .notif-nav-label {
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .notif-nav-btn {
      padding: 4px 12px;
      border-radius: 6px;
      border: 1px solid var(--notif);
      background: rgba(255, 71, 87, 0.1);
      color: var(--notif);
      font-size: 11px;
      cursor: pointer;
      transition: all .2s;
      flex-shrink: 0;
    }
    .notif-nav-btn:hover {
      background: rgba(255, 71, 87, 0.2);
    }
    .notif-nav-btn.active {
      background: var(--notif);
      color: #fff;
    }
    .notif-nav-btn.dim {
      opacity: 0.4;
      pointer-events: none;
    }
    .mark-all-read-btn {
      padding: 4px 12px;
      border-radius: 6px;
      border: 1px solid var(--green);
      background: rgba(46, 213, 115, 0.1);
      color: var(--green);
      font-size: 11px;
      cursor: pointer;
      transition: all .2s;
      flex-shrink: 0;
      margin-left: auto;
    }
    .mark-all-read-btn:hover {
      background: rgba(46, 213, 115, 0.25);
    }
    .notif-nav::-webkit-scrollbar { width: 4px; }
    .notif-nav::-webkit-scrollbar-track { background: transparent; }
    .notif-nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Event Items ── */
    .event-item {
      display: flex;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      transition: background .2s;
      margin-bottom: 4px;
      scroll-margin-top: 80px;
    }
    .event-item:hover { background: rgba(255,255,255,0.03); }
    .event-item.highlight {
      background: rgba(124, 77, 255, 0.08);
      border: 1px solid var(--accent);
      animation: highlightPulse 2s ease;
    }
    @keyframes highlightPulse {
      0%, 100% { box-shadow: 0 0 0 0 transparent; }
      50% { box-shadow: 0 0 20px var(--accent-glow); }
    }
    .event-item .ev-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .event-item .ev-icon.new_user { background: rgba(46, 213, 115, 0.15); }
    .event-item .ev-icon.qa_submit { background: rgba(124, 77, 255, 0.15); }
    .event-item .ev-icon.email_submit { background: rgba(255, 165, 2, 0.15); }
    .event-item .ev-icon.complaint_submit { background: rgba(255, 71, 87, 0.15); }
    .event-item .ev-icon.page_view { background: rgba(70, 130, 255, 0.15); }
    .event-item .ev-icon.other { background: rgba(107, 127, 153, 0.15); }

    .event-item .ev-body {
      flex: 1;
      min-width: 0;
    }
    .event-item .ev-header {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .event-item .ev-type {
      font-size: 13px;
      font-weight: 500;
    }
    .event-item .ev-user {
      font-size: 11px;
      color: var(--accent);
      font-family: monospace;
    }
    .event-item .ev-time {
      font-size: 11px;
      color: var(--text-dim);
      margin-left: auto;
    }
    .event-item .ev-detail {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 4px;
      word-break: break-word;
    }
    .event-item .ev-detail .q { color: var(--gold); }
    .event-item .notif-tag {
      display: inline-block;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(255, 71, 87, 0.15);
      color: var(--notif);
      margin-left: 6px;
    }
    .event-item .mark-read-btn {
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 4px;
      border: 1px solid var(--green);
      background: transparent;
      color: var(--green);
      cursor: pointer;
      transition: all .2s;
      margin-left: 8px;
    }
    .event-item .mark-read-btn:hover {
      background: rgba(46, 213, 115, 0.15);
    }
    .event-item .mark-read-btn.done {
      opacity: 0.4;
      pointer-events: none;
    }

    .empty-events {
      text-align: center;
      color: var(--text-dim);
      padding: 40px 0;
      font-size: 14px;
    }

    /* ── Scrollbar ── */
    .modal-body::-webkit-scrollbar { width: 6px; }
    .modal-body::-webkit-scrollbar-track { background: transparent; }
    .modal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      header { padding: 16px 20px; }
      .groups-container {
        padding: 16px 20px;
      }
      .inbox-panel { margin: 16px 20px 0; }
      .chat-admin-panel { margin: 16px 20px 0; }
      .chat-admin-layout { grid-template-columns: 1fr; }
      .chat-admin-list { max-height: 220px; }
      .ob-note { margin: 14px 20px 0; }
      .modal-content { width: 95%; max-height: 90vh; }
      .modal-body { padding: 12px 16px; }
      .visit-row { grid-template-columns: 1fr; gap: 3px; }
    }
  </style>
</head>
<body>

<!-- ── Login Overlay ── -->
<div id="loginOverlay">
  <div class="login-box">
    <h1>🔍 观察</h1>
    <p>请输入管理员密码以访问</p>
    <input type="password" id="passwordInput" placeholder="密码" autofocus>
    <div class="error" id="loginError">密码错误</div>
    <button class="login-btn" id="loginBtn">进入</button>
  </div>
</div>

<!-- ── Header ── -->
<header id="mainHeader" style="display:none">
  <h1>🔍 观察 · 估算访客动态</h1>
  <div class="stats">
    <span id="visitorCount">0</span> 个估算访客 ·
    <span id="stableProfileCount">0</span> 个稳定浏览器档案 ·
    <span id="legacySessionCount">0</span> 个旧会话 ·
    <span id="totalNotifs">0</span> 条通知 ·
    <span id="inboxPendingCount">0</span> 条待处理请求
  </div>
</header>

<div class="ob-note" id="obNote">
  估算口径：一个第一方浏览器档案视为一名访客，可跨标签页和 IP 变化聚合；同一人使用多台设备或多个浏览器时仍可能多算，共用浏览器时可能少算，因此不等同于实名自然人数。旧记录没有稳定档案，只按会话单列。这里只记录访问时的设备类型、IP 和页面，不查询城市或经纬度。
</div>

<!-- ── Cross-server durable action inbox ── -->
<section class="inbox-panel" id="inboxPanel">
  <div class="inbox-header">
    <h2>📥 双服务器可靠待处理箱</h2>
    <span class="inbox-count" id="inboxCount"></span>
  </div>
  <div class="inbox-list" id="inboxList"></div>
</section>

<section class="chat-admin-panel" id="chatAdminPanel">
  <div class="chat-admin-header">
    <h2><i class="fas fa-headset" aria-hidden="true"></i> 客服聊天</h2>
    <span class="chat-admin-count" id="chatAdminCount"></span>
  </div>
  <div class="chat-admin-layout">
    <div class="chat-admin-list" id="chatAdminList"></div>
    <div class="chat-admin-detail">
      <div class="chat-admin-detail-head" id="chatAdminDetailHead">选择一个会话查看消息</div>
      <div class="chat-admin-messages" id="chatAdminMessages">
        <div class="chat-admin-empty">暂无客服聊天记录</div>
      </div>
      <form class="chat-admin-composer" id="chatAdminForm">
        <textarea id="chatAdminInput" maxlength="2000" rows="2" placeholder="回复当前会话"></textarea>
        <button class="chat-admin-send" id="chatAdminSend" type="submit"><i class="fas fa-paper-plane" aria-hidden="true"></i> 回复</button>
      </form>
    </div>
  </div>
</section>

<!-- ── Groups Grid ── -->
<div class="groups-container" id="groupsContainer"></div>

<!-- ── Event Modal ── -->
<div id="eventModal">
  <div class="modal-content">
    <div class="modal-header">
      <div>
        <h2 id="modalTitle">用户活动</h2>
        <div class="users-list" id="modalUsers"></div>
      </div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="notif-nav" id="notifNav" style="display:none"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="/static/js/tracker.js?v={{ static_version('js/tracker.js') }}"></script>
<script>
(function() {
  'use strict';

  // ── State ──
  let obPassword = '';
  let groupsData = [];
  let inboxData = [];
  let statsData = {};
  let currentGroupId = -1;
  let currentNotifIdx = -1;
  let loginBusy = false;
  let loginVerified = false;
  let chatConversations = [];
  let selectedChatId = '';

  // ── DOM refs ──
  const loginOverlay = document.getElementById('loginOverlay');
  const passwordInput = document.getElementById('passwordInput');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const mainHeader = document.getElementById('mainHeader');
  const groupsContainer = document.getElementById('groupsContainer');
  const visitorCount = document.getElementById('visitorCount');
  const stableProfileCount = document.getElementById('stableProfileCount');
  const legacySessionCount = document.getElementById('legacySessionCount');
  const totalNotifs = document.getElementById('totalNotifs');
  const inboxPendingCount = document.getElementById('inboxPendingCount');
  const inboxPanel = document.getElementById('inboxPanel');
  const inboxCount = document.getElementById('inboxCount');
  const inboxList = document.getElementById('inboxList');
  const eventModal = document.getElementById('eventModal');
  const modalTitle = document.getElementById('modalTitle');
  const modalUsers = document.getElementById('modalUsers');
  const modalBody = document.getElementById('modalBody');
  const modalClose = document.getElementById('modalClose');
  const notifNav = document.getElementById('notifNav');
  const obNote = document.getElementById('obNote');
  const chatAdminPanel = document.getElementById('chatAdminPanel');
  const chatAdminCount = document.getElementById('chatAdminCount');
  const chatAdminList = document.getElementById('chatAdminList');
  const chatAdminDetailHead = document.getElementById('chatAdminDetailHead');
  const chatAdminMessages = document.getElementById('chatAdminMessages');
  const chatAdminForm = document.getElementById('chatAdminForm');
  const chatAdminInput = document.getElementById('chatAdminInput');
  const chatAdminSend = document.getElementById('chatAdminSend');

  function trackAdminEvent(eventType, data) {
    if (!window._trackEvent) return;
    window._trackEvent(eventType, Object.assign({
      area: 'ob'
    }, data || {}));
  }

  // ── Login ──
  function setLoginFeedback(kind, message) {
    loginError.textContent = message;
    loginError.classList.add('show');
    loginError.classList.toggle('status', kind === 'verifying');
    loginError.classList.toggle('success', kind === 'loading' || kind === 'retry');
    loginBtn.disabled = kind === 'verifying' || kind === 'loading';
    passwordInput.disabled = kind !== 'idle';
    loginBtn.textContent = kind === 'verifying' ? '正在验证…' : (kind === 'loading' ? '正在加载…' : (kind === 'retry' ? '重试加载' : '进入'));
  }

  function resetLoginForPassword(message) {
    loginBusy = false;
    loginVerified = false;
    obPassword = '';
    passwordInput.disabled = false;
    passwordInput.value = '';
    loginBtn.disabled = false;
    loginBtn.textContent = '进入';
    loginError.textContent = message || '密码错误';
    loginError.classList.remove('status', 'success');
    loginError.classList.add('show');
    loginOverlay.classList.remove('hidden');
    passwordInput.focus();
  }

  function showLoginLoadRetry(message) {
    loginBusy = false;
    loginVerified = true;
    setLoginFeedback('retry', message || '密码正确，但数据加载失败，请点击重试加载');
  }

  async function verifyLoginPassword() {
    const resp = await fetch('/api/ob/verify', {
      headers: { 'X-Ob-Password': obPassword },
      cache: 'no-store'
    });
    if (!resp.ok) {
      const error = await resp.json().catch(() => ({}));
      throw new Error(error.detail || '密码验证失败');
    }
  }

  async function doLogin() {
    if (loginBusy) return;
    if (!loginVerified) {
      const pw = passwordInput.value.trim();
      if (!pw) return;
      obPassword = pw;
    }
    loginBusy = true;
    trackAdminEvent('login_attempt', { action: 'ob_login', result: 'submitted' });
    if (!loginVerified) {
      setLoginFeedback('verifying', '正在验证密码…');
      try {
        await verifyLoginPassword();
        loginVerified = true;
      } catch (error) {
        resetLoginForPassword(error.message || '密码验证失败，请重试');
        trackAdminEvent('login_attempt', { action: 'ob_login', result: 'failure' });
        return;
      }
    }
    setLoginFeedback('loading', '密码正确，正在加载观察数据…');
    await fetchData({ loginAttempt: true });
  }

  passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  loginBtn.addEventListener('click', doLogin);

  function renderChatMessages(messages) {
    chatAdminMessages.replaceChildren();
    if (!messages.length) {
      const empty = document.createElement('div');
      empty.className = 'chat-admin-empty';
      empty.textContent = '这个会话还没有消息';
      chatAdminMessages.appendChild(empty);
      return;
    }
    messages.forEach((message) => {
      const row = document.createElement('div');
      row.className = 'chat-admin-message ' + (message.sender === 'support' ? 'support' : 'visitor');
      const bubble = document.createElement('div');
      bubble.className = 'chat-admin-bubble';
      bubble.textContent = message.content || '';
      const time = document.createElement('div');
      time.className = 'chat-admin-time';
      time.textContent = message.created_at || '';
      row.appendChild(bubble);
      row.appendChild(time);
      chatAdminMessages.appendChild(row);
    });
    chatAdminMessages.scrollTop = chatAdminMessages.scrollHeight;
  }

  async function loadChatHistory(conversationId) {
    if (!conversationId) return;
    try {
      const resp = await fetch('/api/feedback-chat/admin-history', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Ob-Password': obPassword },
        body: JSON.stringify({ conversation_id: conversationId }),
        cache: 'no-store',
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(data.detail || '聊天记录加载失败');
      renderChatMessages(data.messages || []);
      const item = chatConversations.find((entry) => entry.conversation_id === conversationId);
      chatAdminDetailHead.textContent = item
        ? '识别码会话 · ' + conversationId.slice(0, 12) + '… · ' + item.message_count + ' 条消息'
        : '客服聊天';
    } catch (error) {
      chatAdminDetailHead.textContent = error.message || '聊天记录加载失败';
    }
  }

  function renderChatConversations() {
    chatAdminList.replaceChildren();
    const pending = chatConversations.filter((item) => item.pending_reply).length;
    chatAdminPanel.classList.toggle('visible', chatConversations.length > 0);
    chatAdminCount.textContent = chatConversations.length + ' 个会话，其中 ' + pending + ' 个待回复';
    if (!chatConversations.length) {
      const empty = document.createElement('div');
      empty.className = 'chat-admin-empty';
      empty.textContent = '暂无客服聊天记录';
      chatAdminList.appendChild(empty);
      selectedChatId = '';
      renderChatMessages([]);
      chatAdminDetailHead.textContent = '选择一个会话查看消息';
      return;
    }
    chatConversations.forEach((conversation) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'chat-admin-item' + (conversation.pending_reply ? ' pending' : '') + (conversation.conversation_id === selectedChatId ? ' active' : '');
      const title = document.createElement('span');
      title.className = 'chat-admin-item-title';
      title.textContent = conversation.conversation_id.slice(0, 16) + '…';
      const meta = document.createElement('span');
      meta.className = 'chat-admin-item-meta';
      meta.textContent = (conversation.pending_reply ? '待回复 · ' : '') + conversation.message_count + ' 条 · ' + (conversation.latest_at || '');
      button.appendChild(title);
      button.appendChild(meta);
      button.addEventListener('click', () => {
        selectedChatId = conversation.conversation_id;
        renderChatConversations();
        loadChatHistory(selectedChatId);
      });
      chatAdminList.appendChild(button);
    });
    if (selectedChatId && chatConversations.some((item) => item.conversation_id === selectedChatId)) {
      loadChatHistory(selectedChatId);
    } else {
      selectedChatId = chatConversations[0].conversation_id;
      renderChatConversations();
      loadChatHistory(selectedChatId);
    }
  }

  async function fetchChatConversations() {
    try {
      const resp = await fetch('/api/feedback-chat/conversations', {
        headers: { 'X-Ob-Password': obPassword },
        cache: 'no-store',
      });
      if (resp.status === 401 || resp.status === 403) return;
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(data.detail || '客服会话加载失败');
      chatConversations = data.conversations || [];
      renderChatConversations();
    } catch (error) {
      chatAdminPanel.classList.remove('visible');
    }
  }

  async function sendChatReply(event) {
    event.preventDefault();
    const content = chatAdminInput.value.trim();
    if (!selectedChatId || !content || chatAdminSend.disabled) return;
    chatAdminSend.disabled = true;
    try {
      const resp = await fetch('/api/feedback-chat/reply', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Ob-Password': obPassword },
        body: JSON.stringify({ conversation_id: selectedChatId, content }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(data.detail || '回复失败');
      chatAdminInput.value = '';
      renderChatMessages(data.messages || []);
      await fetchChatConversations();
    } catch (error) {
      chatAdminDetailHead.textContent = error.message || '回复失败';
    } finally {
      chatAdminSend.disabled = false;
    }
  }

  chatAdminForm.addEventListener('submit', sendChatReply);

  // ── Fetch Data ──
  async function fetchData(options) {
    options = options || {};
    const wasLoginVisible = !loginOverlay.classList.contains('hidden');
    const attemptedLogin = wasLoginVisible && Boolean(obPassword);
    try {
      const resp = await fetch('/api/ob/data', {
        headers: { 'X-Ob-Password': obPassword },
        cache: 'no-store'
      });
      if (resp.status === 401 || resp.status === 403) {
        const error = await resp.json().catch(() => ({}));
        resetLoginForPassword(error.detail || '密码错误');
        if (attemptedLogin) {
          trackAdminEvent('login_attempt', { action: 'ob_login', result: 'failure' });
        }
        return;
      }
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();
      groupsData = data.groups || [];
      inboxData = data.inbox || [];
      statsData = data.stats || {};
      loginOverlay.classList.add('hidden');
      mainHeader.style.display = 'flex';
      obNote.classList.add('visible');
      loginBusy = false;
      if (attemptedLogin) {
        trackAdminEvent('login_attempt', { action: 'ob_login', result: 'success' });
      }
      renderGroups();
      renderInbox();
      await fetchChatConversations();
    } catch (err) {
      if (options.loginAttempt && wasLoginVisible) {
        showLoginLoadRetry('密码正确，但观察数据加载失败，请点击重试加载');
      } else {
        loginError.textContent = '加载失败: ' + err.message;
        loginError.classList.add('show');
      }
    }
  }

  function renderInbox() {
    inboxList.innerHTML = '';
    inboxPanel.classList.toggle('visible', inboxData.length > 0);
    const pending = inboxData.filter(item => item.status === 'pending' || item.status === 'processing').length;
    inboxPendingCount.textContent = pending;
    inboxCount.textContent = inboxData.length + ' 条记录，其中 ' + pending + ' 条待处理';
    inboxData.forEach((event) => {
      const payload = event.payload || {};
      const item = document.createElement('article');
      item.className = 'inbox-item';
      const head = document.createElement('div');
      head.className = 'inbox-item-head';
      const type = document.createElement('strong');
      type.textContent = event.event_type === 'complaint' ? '📋 投诉举报' : '📧 邮箱请求';
      head.appendChild(type);
      const origin = document.createElement('span');
      origin.className = 'origin-chip ' + (event.origin_node || '');
      origin.textContent = '来源：' + (event.origin_label || event.origin_node || '未知服务器');
      head.appendChild(origin);
      const status = document.createElement('span');
      status.className = 'inbox-status';
      const statusLabels = { pending: '待处理', processing: '处理中', resolved: '已完成', rejected: '已驳回' };
      status.textContent = '状态：' + (statusLabels[event.status] || event.status || '待处理');
      head.appendChild(status);
      const time = document.createElement('span');
      time.className = 'inbox-time';
      time.textContent = event.created_at || '';
      head.appendChild(time);
      item.appendChild(head);

      const detail = document.createElement('div');
      detail.className = 'inbox-detail';
      if (event.event_type === 'complaint') {
        detail.textContent = [
          '编号：' + (payload.ticket_id || event.event_id),
          '类型：' + (payload.type_label || payload.type || ''),
          payload.content || '',
          payload.email ? '联系邮箱：' + payload.email : ''
        ].filter(Boolean).join('\n');
      } else {
        detail.textContent = [
          '任务：' + (payload.task_id || ''),
          payload.question ? '问题：' + payload.question : '',
          payload.email ? '联系邮箱：' + payload.email : ''
        ].filter(Boolean).join('\n');
      }
      item.appendChild(detail);

      const actions = document.createElement('div');
      actions.className = 'inbox-actions';
      [['processing', '开始处理'], ['resolved', '标记完成'], ['rejected', '驳回']].forEach(([value, label]) => {
        const button = document.createElement('button');
        button.className = 'inbox-action';
        button.textContent = label;
        button.disabled = event.status === value;
        button.addEventListener('click', () => updateInboxStatus(event.event_id, value));
        actions.appendChild(button);
      });
      item.appendChild(actions);
      inboxList.appendChild(item);
    });
  }

  async function updateInboxStatus(eventId, nextStatus) {
    try {
      const resp = await fetch('/api/ob/inbox/status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Ob-Password': obPassword },
        body: JSON.stringify({ event_id: eventId, status: nextStatus, note: '' }),
      });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      trackAdminEvent('admin_update', { action: 'inbox_status', result: 'success', event_id: eventId, status: nextStatus });
      await fetchData();
    } catch (err) {
      trackAdminEvent('admin_update', { action: 'inbox_status', result: 'failure', event_id: eventId, status: nextStatus });
    }
  }

  // ── Render Groups ──
  function renderGroups() {
    groupsContainer.innerHTML = '';
    visitorCount.textContent = statsData.estimated_visitors ?? groupsData.length;
    stableProfileCount.textContent = statsData.stable_profiles ?? 0;
    legacySessionCount.textContent = statsData.legacy_sessions ?? 0;
    let totalN = 0;
    groupsData.forEach(g => totalN += g.notification_count);
    totalNotifs.textContent = totalN;

    if (groupsData.length === 0) {
      groupsContainer.classList.add('empty');
      return;
    }
    groupsContainer.classList.remove('empty');

    groupsData.forEach((group) => {
      const card = document.createElement('div');
      card.className = 'group-card';
      card.classList.toggle('legacy', Boolean(group.is_legacy));
      card.dataset.groupId = group.id;

      // Notification badge
      if (group.notification_count > 0) {
        const badge = document.createElement('div');
        badge.className = 'notif-badge';
        badge.textContent = group.notification_count > 99 ? '99+' : group.notification_count;
        card.appendChild(badge);
      }

      const profileHead = document.createElement('div');
      profileHead.className = 'profile-head';
      const title = document.createElement('div');
      title.className = 'profile-title';
      title.textContent = group.profile_label || group.visitor_id;
      profileHead.appendChild(title);
      const kind = document.createElement('span');
      kind.className = 'profile-kind' + (group.is_legacy ? ' legacy' : '');
      kind.textContent = group.is_legacy ? '旧会话' : '稳定档案';
      profileHead.appendChild(kind);
      card.appendChild(profileHead);

      const metrics = document.createElement('div');
      metrics.className = 'profile-metrics';
      metrics.textContent = (group.visits || []).length + ' 次已关联页面访问 · '
        + (group.networks || []).length + ' 个曾用 IP · '
        + group.users.length + ' 个会话 ID';
      card.appendChild(metrics);

      const facts = document.createElement('div');
      facts.className = 'profile-facts';
      appendFact(facts, '设备', (group.devices || []).map(item => item.value), false, group.is_legacy ? '旧记录未知' : '暂无');
      appendFact(facts, 'IP', (group.networks || []).map(item => item.value), true, '暂无');
      card.appendChild(facts);

      // Anonymous session IDs remain visible as supporting evidence.
      const usersDiv = document.createElement('div');
      usersDiv.className = 'group-users';
      group.users.forEach((uid) => {
        const chip = document.createElement('span');
        chip.className = 'user-chip';
        chip.textContent = uid;
        usersDiv.appendChild(chip);
      });
      card.appendChild(usersDiv);

      // Latest activity time
      if (group.recent_time) {
        const timeDiv = document.createElement('div');
        timeDiv.className = 'group-time';
        timeDiv.textContent = '最近活动: ' + group.recent_time;
        card.appendChild(timeDiv);
      }

      card.addEventListener('click', () => openModal(group.id));
      groupsContainer.appendChild(card);
    });
  }

  function appendFact(container, label, values, network, emptyText) {
    const row = document.createElement('div');
    row.className = 'profile-fact';
    const name = document.createElement('span');
    name.className = 'profile-fact-label';
    name.textContent = label + '：';
    row.appendChild(name);
    const list = document.createElement('div');
    list.className = 'profile-fact-values';
    const normalizedValues = values.length ? values : [emptyText];
    normalizedValues.slice(0, 4).forEach(value => {
      const chip = document.createElement('span');
      chip.className = 'fact-chip' + (network ? ' network' : '');
      chip.textContent = value;
      list.appendChild(chip);
    });
    if (normalizedValues.length > 4) {
      const more = document.createElement('span');
      more.className = 'fact-chip';
      more.textContent = '+' + (normalizedValues.length - 4);
      list.appendChild(more);
    }
    row.appendChild(list);
    container.appendChild(row);
  }

  // ── Open Modal ──
  function openModal(groupId) {
    const group = groupsData.find(g => g.id === groupId);
    if (!group) return;
    currentGroupId = groupId;
    currentNotifIdx = -1;
    trackAdminEvent('admin_modal', {
      action: 'open_ob_group',
      group_id: groupId,
      event_count: group.events.length,
      notification_count: group.notifications.length
    });

    modalTitle.textContent = group.profile_label || '估算访客活动';
    modalUsers.textContent = (group.is_legacy ? '旧会话 ID：' : '关联会话 ID：') + group.users.join(', ');

    // Notification navigation
    if (group.notifications.length > 0) {
      notifNav.style.display = 'flex';
      notifNav.innerHTML = '<span class="notif-nav-label">🔔 导航:</span>';

      // "全部已读" button
      const markAllBtn = document.createElement('button');
      markAllBtn.className = 'mark-all-read-btn';
      markAllBtn.textContent = '✅ 全部已读';
      markAllBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        markAllRead(group);
      });
      notifNav.appendChild(markAllBtn);

      group.notifications.forEach((notif, ni) => {
        const btn = document.createElement('button');
        btn.className = 'notif-nav-btn';
        btn.textContent = (ni + 1) + '. ' + (notif.type_label || notif.event_id);
        btn.dataset.notifIdx = ni;
        btn.addEventListener('click', () => navigateToNotif(groupId, ni));
        notifNav.appendChild(btn);
      });
    } else {
      notifNav.style.display = 'none';
    }

    renderEvents(group);
    eventModal.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  // ── Navigate to Notification ──
  function navigateToNotif(groupId, notifIdx) {
    const group = groupsData.find(g => g.id === groupId);
    if (!group || notifIdx >= group.notifications.length) return;
    currentNotifIdx = notifIdx;

    const notif = group.notifications[notifIdx];
    const eventIdx = notif.event_idx;

    // Highlight nav button
    document.querySelectorAll('.notif-nav-btn').forEach((btn, i) => {
      btn.classList.toggle('active', i === notifIdx);
    });

    // Scroll to event
    const eventEl = document.querySelector(`.event-item[data-event-idx="${eventIdx}"]`);
    if (eventEl) {
      // Remove previous highlight
      document.querySelectorAll('.event-item.highlight').forEach(el => el.classList.remove('highlight'));
      eventEl.classList.add('highlight');
      eventEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  // ── Render Events ──
  function renderEvents(group) {
    modalBody.innerHTML = '';
    renderProfileSummary(group);
    if (group.events.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-events';
      empty.textContent = '暂无其他事件记录';
      modalBody.appendChild(empty);
      return;
    }

    group.events.forEach((ev, idx) => {
      const item = document.createElement('div');
      item.className = 'event-item';
      item.dataset.eventIdx = idx;

      // Icon
      const iconDiv = document.createElement('div');
      iconDiv.className = 'ev-icon ' + (ev.type || 'other');
      iconDiv.textContent = getEmoji(ev.type);
      item.appendChild(iconDiv);

      // Body
      const body = document.createElement('div');
      body.className = 'ev-body';

      const header = document.createElement('div');
      header.className = 'ev-header';

      const typeSpan = document.createElement('span');
      typeSpan.className = 'ev-type';
      typeSpan.textContent = ev.type_label;
      header.appendChild(typeSpan);

      const userSpan = document.createElement('span');
      userSpan.className = 'ev-user';
      userSpan.textContent = ev.client_id;
      header.appendChild(userSpan);

      if (ev.is_notification) {
        const tag = document.createElement('span');
        tag.className = 'notif-tag';
        tag.textContent = '通知';
        header.appendChild(tag);

        // Mark as read button
        const readBtn = document.createElement('button');
        readBtn.className = 'mark-read-btn';
        if (ev.status && ev.status !== '⏳ 待处理') {
          readBtn.classList.add('done');
          readBtn.textContent = '✅ 已处理';
        } else {
          readBtn.textContent = '○ 标为已读';
        }
        readBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (readBtn.classList.contains('done')) return;
          readBtn.classList.add('done');
          readBtn.textContent = '✅ 已处理';
          // Update in data
          ev.status = '✅ 已处理';
          updateNotifCounts();
          // Persist to server
          markReadOnServer(ev.event_id);
        });
        header.appendChild(readBtn);
      }

      const timeSpan = document.createElement('span');
      timeSpan.className = 'ev-time';
      timeSpan.textContent = ev.time_str;
      header.appendChild(timeSpan);

      body.appendChild(header);

      // Detail
      if (ev.page || ev.question || ev.detail) {
        const detail = document.createElement('div');
        detail.className = 'ev-detail';
        const parts = [];
        if (ev.page) parts.push('📄 ' + ev.page);
        if (ev.question) parts.push('<span class="q">❓ ' + escHtml(ev.question) + '</span>');
        if (ev.detail) parts.push(escHtml(ev.detail));
        detail.innerHTML = parts.join(' · ');
        body.appendChild(detail);
      }

      item.appendChild(body);
      modalBody.appendChild(item);
    });
  }

  function renderProfileSummary(group) {
    const summary = document.createElement('section');
    summary.className = 'profile-summary';

    const devices = document.createElement('div');
    devices.className = 'summary-block';
    appendSummaryTitle(devices, '设备环境');
    appendSummaryChips(devices, (group.devices || []).map(item => {
      const count = item.visit_count == null ? '' : ' · ' + item.visit_count + ' 次';
      return item.value + count;
    }), false, group.is_legacy ? '旧记录没有设备关联' : '暂无设备记录');
    summary.appendChild(devices);

    const networks = document.createElement('div');
    networks.className = 'summary-block';
    appendSummaryTitle(networks, '曾用 IP');
    appendSummaryChips(networks, (group.networks || []).map(item => {
      const count = item.visit_count == null ? ' · 旧记录，具体访问未知' : ' · ' + item.visit_count + ' 次';
      return item.value + count;
    }), true, '暂无 IP 记录');
    summary.appendChild(networks);

    const visits = document.createElement('div');
    visits.className = 'summary-block';
    appendSummaryTitle(visits, '逐次页面访问（设备与 IP）');
    if ((group.visits || []).length === 0) {
      const hint = document.createElement('div');
      hint.className = 'legacy-hint';
      hint.textContent = group.is_legacy
        ? '旧记录只保存了“会话曾用哪些 IP”，没有保存每次访问对应的设备和 IP，不能可靠倒推。新访问会自动记录。'
        : '暂无页面访问记录。';
      visits.appendChild(hint);
    } else {
      const list = document.createElement('div');
      list.className = 'visits-list';
      group.visits.forEach(visit => {
        const row = document.createElement('div');
        row.className = 'visit-row';
        appendVisitCell(row, 'visit-time', visit.time_str || '');
        appendVisitCell(row, 'visit-page', visit.page || '/');
        appendVisitCell(row, 'visit-device', visit.device_label || '未知设备');
        appendVisitCell(row, 'visit-ip', visit.ip || '未知 IP');
        list.appendChild(row);
      });
      visits.appendChild(list);
    }
    summary.appendChild(visits);
    modalBody.appendChild(summary);
  }

  function appendSummaryTitle(container, text) {
    const title = document.createElement('h3');
    title.textContent = text;
    container.appendChild(title);
  }

  function appendSummaryChips(container, values, network, emptyText) {
    const list = document.createElement('div');
    list.className = 'summary-chips';
    (values.length ? values : [emptyText]).forEach(value => {
      const chip = document.createElement('span');
      chip.className = 'summary-chip' + (network ? ' network' : '');
      chip.textContent = value;
      list.appendChild(chip);
    });
    container.appendChild(list);
  }

  function appendVisitCell(row, className, text) {
    const cell = document.createElement('div');
    cell.className = className;
    cell.textContent = text;
    row.appendChild(cell);
  }

  function getEmoji(type) {
    const map = {
      'new_user': '🆕',
      'qa_submit': '🤖',
      'email_submit': '📧',
      'complaint_submit': '📋',
      'page_view': '📄',
      'login_attempt': '🔑',
      'click': '👆',
      'screenshot': '📸',
      'admin_filter': '🔎',
      'admin_export': '📤',
      'admin_update': '🛠️',
      'admin_modal': '🪟',
    };
    return map[type] || '❓';
  }

  function escHtml(s) {
    if (!s) return '';
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function updateNotifCounts() {
    // Recalculate notification counts
    groupsData.forEach(g => {
      let count = 0;
      g.events.forEach(ev => {
        if (ev.is_notification && ev.status === '⏳ 待处理') count++;
      });
      g.notification_count = count;
    });
    // Update header
    let totalN = 0;
    groupsData.forEach(g => totalN += g.notification_count);
    totalNotifs.textContent = totalN;
    // Re-render group cards to update badges
    renderGroups();
  }

  // ── Close Modal ──
  function closeModal() {
    eventModal.classList.remove('open');
    document.body.style.overflow = '';
    currentGroupId = -1;
    currentNotifIdx = -1;
  }

  modalClose.addEventListener('click', closeModal);
  eventModal.addEventListener('click', (e) => {
    if (e.target === eventModal) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && eventModal.classList.contains('open')) closeModal();
  });

  // ── Mark read on server ──
  async function markReadOnServer(eventId) {
    try {
      const resp = await fetch('/api/ob/mark-read', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Ob-Password': obPassword },
        body: JSON.stringify({ event_id: eventId }),
      });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      trackAdminEvent('admin_update', {
        action: 'ob_mark_read',
        result: 'success',
        event_id: eventId
      });
      // Immediately refresh data from server after successful mark
      fetchData();
    } catch (_) {
      trackAdminEvent('admin_update', {
        action: 'ob_mark_read',
        result: 'failure',
        event_id: eventId
      });
    }
  }

  // ── Mark all notifications as read for a group ──
  function markAllRead(group) {
    const toMark = [];
    group.events.forEach(ev => {
      if (ev.is_notification && ev.status === '⏳ 待处理') {
        ev.status = '✅ 已处理';
        toMark.push(ev.event_id);
      }
    });
    group.notification_count = 0;

    // Update UI immediately
    document.querySelectorAll('.mark-read-btn').forEach(btn => {
      if (!btn.classList.contains('done')) {
        btn.classList.add('done');
        btn.textContent = '✅ 已处理';
      }
    });
    document.querySelectorAll('.notif-nav-btn').forEach(btn => btn.classList.add('dim'));
    document.querySelectorAll('.mark-all-read-btn').forEach(btn => {
      btn.textContent = '✅ 全部已读';
      btn.style.opacity = '0.4';
      btn.style.pointerEvents = 'none';
    });
    updateNotifCounts();

    // Persist to server
    trackAdminEvent('admin_update', {
      action: 'ob_mark_all_read',
      result: 'submitted',
      group_id: group.id,
      count: toMark.length
    });
    toMark.forEach(eid => {
      fetch('/api/ob/mark-read', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Ob-Password': obPassword },
        body: JSON.stringify({ event_id: eid }),
      }).catch(() => {});
    });
  }

  // ── Auto-refresh every 10s ──
  setInterval(fetchData, 10000);

  // ── Focus password input ──
  passwordInput.focus();

})();
</script>
</body>
</html>
