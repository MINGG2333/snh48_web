<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>社交凭据管理</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f3f5f7;color:#17212b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:0}
    main{width:min(920px,calc(100% - 32px));margin:0 auto;padding:48px 0 72px} h1{font-size:26px;margin:0 0 8px} p{margin:0;color:#5b6670}
    .top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding-bottom:24px;border-bottom:1px solid #ccd3d9}
    button{border:1px solid #7b8791;background:#fff;color:#17212b;border-radius:6px;min-height:40px;padding:8px 14px;font-weight:650;cursor:pointer}
    button.primary{background:#176b4d;border-color:#176b4d;color:#fff} button:disabled{opacity:.55;cursor:wait}
    .login{max-width:440px;margin:72px auto 0;padding:28px;background:#fff;border:1px solid #d5dbe0;border-radius:8px}
    label{display:block;font-weight:650;margin:18px 0 8px} input,select,textarea{width:100%;border:1px solid #9aa5ae;border-radius:6px;background:#fff;color:#17212b;font:inherit;padding:10px 12px}
    input,select{height:44px} textarea{min-height:128px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}
    .actions{display:flex;align-items:center;gap:12px;margin-top:18px}.message{min-height:24px;margin-top:16px;color:#8a2d23}.message.ok{color:#176b4d}
    .workspace{display:none}.workspace.visible{display:block}.platform{padding:26px 0;border-bottom:1px solid #ccd3d9}.platform h2{font-size:19px;margin:0 0 4px}
    .slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:18px}.slot{background:#fff;border:1px solid #d5dbe0;border-radius:8px;padding:18px}
    #pocket-sms-form{border-radius:8px 8px 0 0;margin-bottom:0}#pocket-code-form{border-top:0;border-radius:0 0 8px 8px;margin-top:0!important;padding-top:0}
    .slot-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.slot h3{font-size:15px;margin:0}.state{font-size:13px;color:#5b6670}.state.valid{color:#176b4d}
    @media(max-width:680px){main{width:min(100% - 24px,920px);padding-top:28px}.top{display:block}.top button{margin-top:18px}.slots{grid-template-columns:1fr}.login{margin-top:40px;padding:22px}}
  </style>
</head>
<body>
<main>
  <section id="login" class="login">
    <h1>社交凭据管理</h1>
    <p>请输入管理员密码。</p>
    <form id="login-form">
      <label for="password">密码</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <div class="actions"><button class="primary" type="submit">登录</button></div>
      <div id="login-message" class="message" role="status"></div>
    </form>
  </section>
  <section id="workspace" class="workspace">
    <header class="top"><div><h1>社交凭据管理</h1><p>新 Cookie 验证成功后才会替换当前槽位。</p></div><button id="logout" type="button">退出</button></header>
    <div id="platforms"></div>
    <section class="platform" id="pocket-login">
      <h2>口袋48账号 Token</h2><p>使用失效账号的手机号接收验证码，登录成功后自动保存 Token 并刷新后台数据。</p>
      <form id="pocket-sms-form" class="slot" style="margin-top:18px;max-width:560px">
        <label>手机号</label><input id="pocket-phone" inputmode="tel" autocomplete="tel" required>
        <label>区号</label><select id="pocket-area"><option value="86">中国大陆 +86</option><option value="852">香港 +852</option></select>
        <div class="actions"><button class="primary" type="submit">发送验证码</button></div>
      </form>
      <form id="pocket-code-form" class="slot" style="margin-top:18px;max-width:560px">
        <label>短信验证码</label><input id="pocket-code" inputmode="numeric" autocomplete="one-time-code" required>
        <div class="actions"><button id="pocket-code-submit" class="primary" type="submit" disabled>登录并更新 Token</button></div>
      </form>
      <form id="pocket-security-form" class="slot" style="display:none;margin-top:18px;max-width:560px">
        <label id="pocket-question">安全验证</label><select id="pocket-option"></select>
        <div class="actions"><button class="primary" type="submit">提交安全验证并发送验证码</button></div>
      </form>
      <div id="pocket-message" class="message" role="status"></div>
    </section>
    <div id="update-message" class="message" role="status"></div>
  </section>
</main>
<script>
const api='/api/social-credentials';
const names={weibo:'微博',douyin:'抖音',bilibili:'B站'};
const slotNames={primary:'主 Cookie',backup:'备用 Cookie'};
const login=document.querySelector('#login'); const workspace=document.querySelector('#workspace');
const loginMessage=document.querySelector('#login-message'); const updateMessage=document.querySelector('#update-message');
async function request(path,options={}){const r=await fetch(api+path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})},cache:'no-store'});let data={};try{data=await r.json()}catch{}if(!r.ok){const e=new Error(data.detail||'请求失败');e.status=r.status;throw e}return data}
function showWorkspace(){login.style.display='none';workspace.classList.add('visible')}
function render(data){const root=document.querySelector('#platforms');root.replaceChildren();for(const platform of data.platforms){const section=document.createElement('section');section.className='platform';section.innerHTML=`<h2>${names[platform.id]||platform.id}</h2><p>手机号用于标识该槽位对应的实际账号；Cookie 仍只显示状态。</p><div class="slots"></div>`;const slots=section.querySelector('.slots');for(const slot of platform.slots){const form=document.createElement('form');form.className='slot';form.innerHTML=`<div class="slot-head"><h3>${slotNames[slot.id]||slot.id}${slot.is_primary?' · 当前主账号':''}</h3><span class="state ${slot.last_result==='valid'?'valid':''}">${slot.phone_masked} · ${slot.configured?'已配置':'未配置'}${slot.last_validated_at?' · '+slot.last_validated_at:''}</span></div><label>账号手机号（可修改）</label><input class="phone" inputmode="tel" value="" placeholder="留空保持现有手机号；修改时输入完整手机号"><label>新 Cookie</label><textarea autocomplete="off" spellcheck="false" required></textarea><div class="actions"><button class="primary" type="submit">验证并更新</button>${platform.id!=='bilibili'&&!slot.is_primary?'<button type="button" class="make-primary">设为主账号</button>':''}</div>`;form.addEventListener('submit',async e=>{e.preventDefault();const button=form.querySelector('button');const textarea=form.querySelector('textarea');button.disabled=true;updateMessage.className='message';updateMessage.textContent='正在验证并更新…';try{await request('/update',{method:'POST',body:JSON.stringify({platform:platform.id,slot:slot.id,cookie:textarea.value,phone:form.querySelector('.phone').value})});textarea.value='';updateMessage.className='message ok';updateMessage.textContent=`${names[platform.id]} ${slotNames[slot.id]}已验证并更新`;await load()}catch(err){updateMessage.textContent=err.message}finally{button.disabled=false}});const primaryButton=form.querySelector('.make-primary');if(primaryButton)primaryButton.addEventListener('click',async()=>{primaryButton.disabled=true;try{await request('/set-primary',{method:'POST',body:JSON.stringify({platform:platform.id,slot:slot.id})});updateMessage.className='message ok';updateMessage.textContent=`${names[platform.id]} ${slotNames[slot.id]}已设为主账号`;await load()}catch(err){updateMessage.textContent=err.message}finally{primaryButton.disabled=false}});slots.append(form)}root.append(section)}}
async function load(){const data=await request('/status');showWorkspace();render(data)}
document.querySelector('#login-form').addEventListener('submit',async e=>{e.preventDefault();loginMessage.className='message';loginMessage.textContent='正在登录并验证权限…';const button=e.target.querySelector('button');button.disabled=true;try{await request('/login',{method:'POST',body:JSON.stringify({password:document.querySelector('#password').value})});document.querySelector('#password').value='';loginMessage.className='message ok';loginMessage.textContent='密码正确，正在加载凭据状态…';await load()}catch(err){loginMessage.textContent=err.message;button.disabled=false}});
document.querySelector('#logout').addEventListener('click',async()=>{await request('/logout',{method:'POST',body:'{}'});location.reload()});
let pocketSession='';
const pocketMsg=document.querySelector('#pocket-message');
document.querySelector('#pocket-sms-form').addEventListener('submit',async e=>{e.preventDefault();pocketMsg.className='message';pocketMsg.textContent='正在发送验证码…';try{const r=await request('/pocket48/send-sms',{method:'POST',body:JSON.stringify({phone:document.querySelector('#pocket-phone').value,area:document.querySelector('#pocket-area').value})});pocketSession=r.session_id;if(r.state==='awaiting_security'){const select=document.querySelector('#pocket-option');select.replaceChildren(...(r.options||[]).map(o=>new Option(o.value,o.option)));document.querySelector('#pocket-question').textContent=r.question||'安全验证';document.querySelector('#pocket-security-form').style.display='block';pocketMsg.textContent='请完成安全验证';return}document.querySelector('#pocket-code-submit').disabled=false;pocketMsg.className='message ok';pocketMsg.textContent='验证码已发送至 '+r.phone_masked}catch(err){pocketMsg.textContent=err.message}});
document.querySelector('#pocket-security-form').addEventListener('submit',async e=>{e.preventDefault();pocketMsg.textContent='正在提交安全验证…';try{const r=await request('/pocket48/security-answer',{method:'POST',body:JSON.stringify({session_id:pocketSession,option:document.querySelector('#pocket-option').value})});document.querySelector('#pocket-security-form').style.display='none';document.querySelector('#pocket-code-submit').disabled=false;pocketMsg.className='message ok';pocketMsg.textContent='验证码已发送至 '+r.phone_masked}catch(err){pocketMsg.textContent=err.message}});
document.querySelector('#pocket-code-form').addEventListener('submit',async e=>{e.preventDefault();pocketMsg.className='message';pocketMsg.textContent='正在登录并保存 Token…';try{const r=await request('/pocket48/verify-code',{method:'POST',body:JSON.stringify({session_id:pocketSession,code:document.querySelector('#pocket-code').value})});pocketMsg.className='message ok';pocketMsg.textContent='登录成功，账号 '+(r.account?.nickname||r.account?.id||'')+' 的 Token 已保存，后台刷新已启动。';document.querySelector('#pocket-code').value='';}catch(err){pocketMsg.textContent=err.message}});
load().catch(err=>{if(err.status===401||err.status===403){login.style.display='block';return}loginMessage.textContent='加载失败：'+err.message});
</script>
</body>
</html>
