<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site_title }} · 全员计分榜</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0c1016;
      --panel: #151b24;
      --panel-2: #1b2430;
      --line: #2c394b;
      --text: #e8eef6;
      --muted: #95a4b6;
      --faint: #657386;
      --ink: #091017;
      --teal: #41b9aa;
      --gold: #f0b84b;
      --blue: #67a8ff;
      --pink: #e87da7;
      --green: #4dc27c;
      --red: #e36f6f;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(180deg, rgba(65, 185, 170, 0.08), transparent 240px), var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      line-height: 1.45;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    #loginOverlay {
      position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
      background: var(--bg); padding: 24px;
    }
    #loginOverlay.hidden { display: none; }
    .login-box { width: min(360px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 28px; box-shadow: 0 18px 50px rgba(0,0,0,.28); }
    .login-box h1 { font-size: 20px; font-weight: 720; margin-bottom: 8px; }
    .login-box p { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
    .login-box input { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 8px; background: var(--ink); color: var(--text); padding: 0 12px; outline: none; }
    .login-box input:focus { border-color: var(--teal); }
    .login-btn { width: 100%; min-height: 44px; margin-top: 12px; border: 0; border-radius: 8px; background: var(--teal); color: var(--ink); font-weight: 760; }
    .login-btn:disabled { cursor: wait; opacity: .72; }
    .login-error { display: none; margin-top: 10px; color: var(--red); font-size: 13px; }
    .login-error.show { display: block; }
    .page { display: none; min-height: 100vh; }
    .page.ready { display: block; }
    .topbar { position: sticky; top: 0; z-index: 10; background: rgba(12,16,22,.96); border-bottom: 1px solid var(--line); backdrop-filter: blur(12px); }
    .topbar-inner { width: min(1500px, 100%); margin: 0 auto; padding: 18px 24px; display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
    .title h1 { font-size: 21px; font-weight: 760; }
    .title p { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .score-nav-wrap { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .score-nav-wrap label { color: var(--faint); font-size: 12px; white-space: nowrap; }
    .score-nav-select { min-height: 30px; padding: 0 28px 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); font-size: 12px; outline: none; }
    .score-nav-select:hover, .score-nav-select:focus-visible { border-color: var(--teal); color: var(--teal); }
    .page-actions { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .filter-btn { min-height: 36px; padding: 0 14px; border: 1px solid var(--teal); border-radius: 8px; background: rgba(65,185,170,.12); color: var(--teal); font-weight: 700; }
    .filter-btn:hover, .filter-btn:focus-visible { background: var(--teal); color: var(--ink); outline: none; }
    .active-filters { color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .refresh { text-align: right; color: var(--muted); font-size: 13px; white-space: nowrap; }
    .refresh-actions { display: flex; gap: 6px; margin-top: 9px; }
    .refresh-btn { min-height: 30px; margin-top: 0; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--text); background: var(--panel); font-size: 12px; }
    .refresh-btn:hover { border-color: var(--teal); color: var(--teal); }
    .filter-trigger { border-color: var(--teal); color: var(--teal); font-weight: 700; }
    main { width: min(1500px, 100%); margin: 0 auto; padding: 22px 24px 36px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(5, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .kpi { min-height: 92px; border: 1px solid var(--line); border-radius: 8px; background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.015)), var(--panel); padding: 14px; }
    .kpi .label { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .kpi .value { font-size: 25px; font-weight: 780; }
    .kpi .sub { color: var(--faint); font-size: 12px; margin-top: 4px; }
    .kpi.total .value { color: var(--gold); }
    .kpi.room .value { color: var(--teal); }
    .kpi.live .value { color: var(--pink); }
    .toolbar { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 14px; margin-bottom: 16px; }
    .toolbar-grid { display: grid; grid-template-columns: repeat(8, minmax(110px, 1fr)); gap: 10px; align-items: end; }
    .field label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .field input, .field select { width: 100%; min-height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--ink); color: var(--text); padding: 0 9px; outline: none; }
    .field input:focus, .field select:focus { border-color: var(--teal); }
    .segment { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .segment button { flex: 1; min-height: 38px; border: 0; background: var(--ink); color: var(--muted); font-size: 12px; }
    .segment button.active { background: var(--teal); color: var(--ink); font-weight: 700; }
    .actions { display: flex; gap: 8px; }
    .btn { min-height: 38px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); color: var(--text); }
    .btn.primary { background: var(--teal); border-color: var(--teal); color: var(--ink); font-weight: 700; }
    .coverage { display: none; margin-bottom: 16px; border: 1px solid #6b5320; border-radius: 8px; background: rgba(240,184,75,.08); color: #f2d38b; padding: 11px 14px; font-size: 13px; }
    .coverage.show { display: block; }
    .coverage-badge { margin-left: 8px; padding: 2px 7px; border: 1px solid #8a6420; border-radius: 99px; background: rgba(240,184,75,.14); color: var(--gold); font-size: 11px; font-weight: 700; vertical-align: middle; }
    .coverage-badge:hover, .coverage-badge:focus-visible { background: var(--gold); color: var(--ink); outline: none; }
    .provenance-inline { margin-left: 5px; color: #8fd8f2; font-size: 11px; font-weight: 600; }
    .gap-headline { margin: 14px 14px 0; padding: 11px 13px; border: 1px solid #6b5320; border-radius: 8px; background: rgba(240,184,75,.08); color: #f2d38b; font-size: 13px; }
    .gap-card { margin: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); padding: 13px 14px; }
    .gap-card h3 { margin: 0 0 10px; font-size: 15px; color: var(--gold); }
    .gap-row { display: grid; grid-template-columns: 96px 1fr; gap: 9px; padding: 5px 0; border-bottom: 1px dashed rgba(149,164,182,.18); font-size: 13px; }
    .gap-row:last-child { border-bottom: 0; }
    .gap-row .k { color: var(--faint); }
    .gap-row .v { color: var(--text); word-break: break-all; }
    .gap-reason { margin-top: 10px; padding: 9px 10px; border-left: 3px solid var(--gold); background: rgba(240,184,75,.06); color: #f2d38b; font-size: 12px; line-height: 1.55; }
    .two-col { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; margin-bottom: 16px; }
    .panel { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 15px; border-bottom: 1px solid var(--line); }
    .panel-head h2 { font-size: 15px; font-weight: 720; }
    .panel-head span { color: var(--faint); font-size: 12px; }
    .bar-list { padding: 12px 15px 15px; display: grid; gap: 10px; }
    .bar-row { display: grid; grid-template-columns: minmax(80px, 150px) 1fr 72px; gap: 10px; align-items: center; font-size: 13px; }
    .bar-track { height: 8px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--teal), var(--blue)); }
    .bar-row .num { text-align: right; color: var(--gold); font-variant-numeric: tabular-nums; }
    .table-panel { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; }
    .table-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 15px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .table-head h2 { font-size: 15px; font-weight: 720; }
    .table-head .meta { color: var(--faint); font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    th { color: var(--muted); font-size: 12px; font-weight: 600; background: rgba(255,255,255,.02); position: sticky; top: 0; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tbody tr.member-row { cursor: pointer; }
    tbody tr.member-row:hover { background: rgba(65,185,170,.06); }
    .rank { color: var(--faint); font-variant-numeric: tabular-nums; }
    .member-name { font-weight: 650; }
    .member-sub { color: var(--faint); font-size: 11px; margin-top: 2px; }
    .tag { display: inline-flex; align-items: center; min-height: 20px; padding: 0 7px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 11px; }
    .score-main { color: var(--gold); font-weight: 760; }
    .detail-row td { background: var(--panel-2); padding: 0; }
    .detail-box { padding: 12px 16px 16px; }
    .detail-title { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .gift-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .gift-chip { border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; background: var(--panel); font-size: 12px; }
    .gift-chip strong { color: var(--gold); }
    .pagination { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 15px; color: var(--muted); font-size: 12px; }
    .pagination .actions { gap: 6px; }
    .empty { padding: 34px 20px; text-align: center; color: var(--faint); }
    .footer { color: var(--faint); text-align: center; font-size: 12px; padding: 20px 12px 30px; }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal.hidden { display: none; }
    .modal-backdrop { position: absolute; inset: 0; background: rgba(5,8,12,.72); backdrop-filter: blur(8px); }
    .modal-dialog {
      position: relative;
      width: min(780px, 100%);
      max-height: min(760px, calc(100vh - 48px));
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 22px 70px rgba(0,0,0,.36);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-head { min-height: 52px; padding: 13px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .modal-head h2 { font-size: 16px; font-weight: 740; }
    .modal-body { overflow: auto; }
    .modal .toolbar { border: 0; background: transparent; margin: 0; padding: 14px; }
    .modal .toolbar-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .modal .filter-actions-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (max-width: 1100px) {
      .kpi-grid { grid-template-columns: repeat(3, 1fr); }
      .toolbar-grid { grid-template-columns: repeat(4, 1fr); }
      .two-col { grid-template-columns: 1fr; }
    }
    @media (max-width: 680px) {
      .topbar-inner { flex-direction: column; padding: 12px 14px; gap: 8px; }
      .title h1 { font-size: 18px; }
      .title p { font-size: 12px; }
      .score-nav-wrap { width: 100%; margin-top: 6px; }
      .score-nav-select { flex: 1; min-width: 0; }
      .refresh { text-align: left; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      #generatedAt { font-size: 11px; }
      .refresh-actions { margin-top: 0; }
      main { padding: 12px 10px 26px; }
      .page-actions { margin-bottom: 10px; }
      .filter-btn { min-height: 34px; }
      .active-filters { font-size: 11px; }
      .kpi-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; margin-bottom: 12px; }
      .kpi { min-height: 56px; padding: 9px 2px 8px; text-align: center; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
      .kpi .label { font-size: clamp(9.5px, 2.5vw, 11px); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .kpi .value { font-size: clamp(11px, 3.5vw, 15px); line-height: 1.15; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
      .kpi .sub { display: none; }
      .toolbar-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .modal .toolbar-grid, .modal .filter-actions-grid { grid-template-columns: 1fr; }
      .bar-row { grid-template-columns: 1fr; gap: 4px; }
      .bar-row .num { text-align: left; }
      .col-records { display: none; }
      th, td { padding: 8px; }
      .modal { padding: 12px; align-items: flex-end; }
      .modal-dialog { max-height: calc(100vh - 24px); }
    }
  </style>
</head>
<body>
  <div id="loginOverlay">
    <div class="login-box">
      <h1>全员计分榜</h1>
      <p>请输入全员计分榜密码</p>
      <input type="password" id="passwordInput" placeholder="密码" autocomplete="new-password" autofocus>
      <button class="login-btn" id="loginBtn">进入</button>
      <div class="login-error" id="loginError">密码错误</div>
    </div>
  </div>

  <div class="page" id="page">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="title">
          <h1>全员计分榜</h1>
          <p>Score all members · 按赛程统计全部成员的计分礼物</p>
          <div class="score-nav-wrap">
            <label for="scoreNavSelect">页面</label>
            <select class="score-nav-select" id="scoreNavSelect" aria-label="计分页面">
              <option value="/score/2026-winter">2026 冬季 · 红蓝歌会</option>
              <option value="/score/2026-summer">2026 夏季 · 青春盛典</option>
              <option value="/score/all-members">全员计分榜</option>
            </select>
          </div>
        </div>
        <div class="refresh">
          <div id="generatedAt">生成时间：-</div>
          <div class="refresh-actions">
            <button class="refresh-btn filter-trigger" id="openFiltersBtn" type="button">筛选</button>
            <button class="refresh-btn" id="manualRefreshBtn" type="button">刷新</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="kpi-grid" aria-label="全员计分统计">
        <div class="kpi total"><div class="label">总分</div><div class="value" id="kpiScore">0</div><div class="sub" id="kpiScoreSub">礼物数 0</div></div>
        <div class="kpi"><div class="label">计分成员</div><div class="value" id="kpiMembers">0</div><div class="sub" id="kpiRecords">0 条记录</div></div>
        <div class="kpi room"><div class="label">房间分</div><div class="value" id="kpiRoom">0</div><div class="sub">成员房间消息</div></div>
        <div class="kpi live"><div class="label">直播分</div><div class="value" id="kpiLive">0</div><div class="sub">成员直播间</div></div>
        <div class="kpi"><div class="label">赛季</div><div class="value" id="kpiCoverage">-</div><div class="sub" id="kpiCoverageSub">-</div></div>
      </section>

      <div id="coverageNotice" class="coverage"></div>

      <section class="two-col">
        <div class="panel">
          <div class="panel-head"><h2>队伍分布</h2><span id="teamMeta">-</span></div>
          <div class="bar-list" id="teamBars"><div class="empty">暂无数据</div></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>礼物分布</h2><span id="giftMeta">-</span></div>
          <div class="bar-list" id="giftBars"><div class="empty">暂无数据</div></div>
        </div>
      </section>

      <section class="table-panel">
        <div class="table-head"><h2>成员排名</h2><span class="active-filters" id="activeFiltersTop">全部成员</span><span class="meta" id="tableMeta">-</span></div>
        <div style="overflow-x:auto;">
          <table>
            <thead><tr><th class="num">#</th><th>成员</th><th>团体 / 队伍</th><th class="num">总分</th><th class="num">房间分</th><th class="num">直播分</th><th class="num">礼物数</th><th class="num col-records">记录</th></tr></thead>
            <tbody id="memberRows"><tr><td colspan="8" class="empty">加载中…</td></tr></tbody>
          </table>
        </div>
        <div class="pagination" style="display:none"><span id="pageMeta">-</span><div class="actions"><button class="btn" id="prevBtn" type="button">上一页</button><button class="btn" id="nextBtn" type="button">下一页</button></div></div>
      </section>
    </main>
    <div class="footer">{{ site_title }} · 仅限管理员访问</div>
  </div>

  <div class="modal hidden" id="filtersModal" role="dialog" aria-modal="true" aria-labelledby="filtersModalTitle">
    <div class="modal-backdrop" id="filtersModalBackdrop"></div>
    <div class="modal-dialog">
      <div class="modal-head">
        <h2 id="filtersModalTitle">筛选条件</h2>
        <button class="btn" id="closeFiltersBtn" type="button">关闭</button>
      </div>
      <div class="modal-body">
      <section class="toolbar" aria-label="筛选条件">
        <div class="toolbar-grid">
          <div class="field"><label for="seasonSelect">赛季</label><select id="seasonSelect"></select></div>
          <div class="field"><label for="groupSelect">团体</label><select id="groupSelect"><option value="">全部团体</option></select></div>
          <div class="field"><label for="teamSelect">队伍</label><select id="teamSelect"><option value="">全部队伍</option></select></div>
          <div class="field"><label for="memberInput">成员</label><input id="memberInput" type="search" placeholder="昵称或 ID"></div>
          <div class="field"><label for="giftSelect">礼物</label><select id="giftSelect"><option value="">全部计分礼物</option></select></div>
          <div class="field"><label>来源</label><div class="segment" id="sourceSegment"><button type="button" data-source="all" class="active">全部</button><button type="button" data-source="room">房间</button><button type="button" data-source="live">直播</button></div></div>
          <div class="field"><label for="dateFromInput">开始日期</label><input id="dateFromInput" type="date"></div>
          <div class="field"><label for="dateToInput">结束日期</label><input id="dateToInput" type="date"></div>
        </div>
        <div class="toolbar-grid filter-actions-grid" style="margin-top:10px;">
          <div class="field"><label for="sortSelect">排序</label><select id="sortSelect"><option value="score_desc">按总分</option><option value="team_asc">按队伍</option><option value="name_asc">按成员名</option></select></div>
          <div class="actions"><button class="btn primary" id="applyBtn" type="button">筛选</button><button class="btn" id="resetBtn" type="button">重置</button></div>
        </div>
      </section>

      </div>
    </div>
  </div>

  <div class="modal hidden" id="gapModal" role="dialog" aria-modal="true" aria-labelledby="gapModalTitle">
    <div class="modal-backdrop" id="gapModalBackdrop"></div>
    <div class="modal-dialog">
      <div class="modal-head">
        <h2 id="gapModalTitle">数据缺口说明</h2>
        <button class="btn" id="closeGapBtn" type="button">关闭</button>
      </div>
      <div class="modal-body" id="gapModalBody"></div>
    </div>
  </div>

  <script>
    (function () {
      var password = "";
      var loginBusy = false;
      var data = null;
      var page = 1;
      var pageSize = 1000;
      var totalPages = 1;
      var sourceFilter = "all";
      var expanded = {};
      var SEASON_LABELS = {};
      var COVERAGE_NOTES = {};

      var loginOverlay = document.getElementById("loginOverlay");
      var passwordInput = document.getElementById("passwordInput");
      var loginBtn = document.getElementById("loginBtn");
      var loginError = document.getElementById("loginError");
      var pageEl = document.getElementById("page");
      var seasonSelect = document.getElementById("seasonSelect");
      var groupSelect = document.getElementById("groupSelect");
      var teamSelect = document.getElementById("teamSelect");
      var memberInput = document.getElementById("memberInput");
      var giftSelect = document.getElementById("giftSelect");
      var dateFromInput = document.getElementById("dateFromInput");
      var dateToInput = document.getElementById("dateToInput");
      var sortSelect = document.getElementById("sortSelect");
      var sourceSegment = document.getElementById("sourceSegment");
      var memberRows = document.getElementById("memberRows");
      var generatedAt = document.getElementById("generatedAt");
      var activeFiltersTop = document.getElementById("activeFiltersTop");
      var filtersModal = document.getElementById("filtersModal");
      var openFiltersBtn = document.getElementById("openFiltersBtn");
      var closeFiltersBtn = document.getElementById("closeFiltersBtn");
      var filtersModalBackdrop = document.getElementById("filtersModalBackdrop");
      var gapModal = document.getElementById("gapModal");
      var gapModalBackdrop = document.getElementById("gapModalBackdrop");
      var gapModalBody = document.getElementById("gapModalBody");
      var gapModalTitle = document.getElementById("gapModalTitle");
      var closeGapBtn = document.getElementById("closeGapBtn");
      var coverageNotice = document.getElementById("coverageNotice");
      var scoreNavSelect = document.getElementById("scoreNavSelect");

      function formatScore(value) {
        var n = Number(value || 0);
        if (!isFinite(n)) return "0";
        return n.toLocaleString("zh-CN", { maximumFractionDigits: 6 });
      }
      function formatNumber(value) {
        return Number(value || 0).toLocaleString("zh-CN");
      }
      function escapeHtml(value) {

        var navPath = location.pathname.replace(/\/$/, "");
        if (navPath === "/score/all") navPath = "/score/all-members";
        if (scoreNavSelect.querySelector('option[value="' + navPath + '"]')) scoreNavSelect.value = navPath;
        scoreNavSelect.addEventListener("change", function () { location.href = scoreNavSelect.value; });
      }
    })();
  </script>
</body>
</html>
