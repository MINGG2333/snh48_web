<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site_title }} · 业务管理</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c1016;
      --panel: #151b24;
      --panel-2: #1b2430;
      --line: #2c394b;
      --text: #e8eef6;
      --muted: #95a4b6;
      --ink: #091017;
      --teal: #41b9aa;
      --gold: #f0b84b;
      --blue: #67a8ff;
      --green: #4dc27c;
      --red: #e36f6f;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, rgba(65, 185, 170, 0.08), transparent 240px), var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      line-height: 1.45;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    #loginOverlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 24px;
    }
    #loginOverlay.hidden { display: none; }

    .login-box {
      width: min(360px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
    }
    .login-box h1 { font-size: 20px; font-weight: 720; margin-bottom: 8px; }
    .login-box p { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
    .login-box input {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--ink);
      color: var(--text);
      padding: 0 12px;
      outline: none;
    }
    .login-box input:focus { border-color: var(--teal); }
    .login-btn {
      width: 100%;
      min-height: 44px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: var(--teal);
      color: var(--ink);
      font-weight: 760;
    }
    .login-btn:disabled { cursor: wait; opacity: 0.72; }
    .login-error { display: none; margin-top: 10px; color: var(--red); font-size: 13px; }
    .login-error.show { display: block; }
    .login-error.status { color: var(--teal); }
    .login-error.success { color: var(--green); }

    .page { display: none; min-height: 100vh; }
    .page.ready { display: block; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(12, 16, 22, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    .topbar-inner {
      width: min(1200px, 100%);
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .title h1 { font-size: 21px; font-weight: 760; }
    .title p { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .topbar-actions { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }

    .btn {
      min-height: 34px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font-size: 13px;
    }
    .btn:hover { border-color: var(--teal); color: var(--teal); }
    .btn.primary { background: var(--teal); border-color: var(--teal); color: var(--ink); font-weight: 700; }
    .btn.danger { border-color: var(--green); color: var(--green); }
    .btn.danger:hover { background: var(--green); color: var(--ink); }
    .btn:disabled { cursor: wait; opacity: 0.6; }

    main { width: min(1200px, 100%); margin: 0 auto; padding: 20px 24px 40px; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .kpi {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 12px 14px;
    }
    .kpi .label { color: var(--muted); font-size: 12px; }
    .kpi .value { font-size: 24px; font-weight: 760; margin-top: 4px; }
    .kpi.s-pending .value { color: var(--gold); }
    .kpi.s-done .value { color: var(--green); }

    .filter-bar {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 10px 16px;
      margin-bottom: 18px;
    }
    .filter-row { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
    .filter-row .filter-label { color: var(--muted); font-size: 13px; line-height: 28px; flex-shrink: 0; }
    .chips-col { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .chip.group-btn { font-weight: 600; border-color: var(--teal); color: var(--text); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
    .chip {
      min-height: 28px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
    }
    .chip:hover { border-color: var(--teal); color: var(--teal); }
    .chip.active { background: var(--teal); border-color: var(--teal); color: var(--ink); font-weight: 700; }

    .add-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      margin-bottom: 18px;
    }
    .add-panel summary {
      cursor: pointer;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
      color: var(--teal);
      list-style: none;
    }
    .add-panel summary::before { content: "＋ "; }
    .add-panel[open] summary::before { content: "－ "; }
    .add-form {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0 16px 16px;
    }
    .add-form .field label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .add-form input, .add-form textarea {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--ink);
      color: var(--text);
      padding: 6px 10px;
      outline: none;
      font-size: 13px;
      color-scheme: dark;
    }
    .add-form textarea { min-height: 60px; resize: vertical; grid-column: span 3; }
    .add-form .field.wide { grid-column: span 3; }
    .add-form input:focus, .add-form textarea:focus { border-color: var(--teal); }
    .add-form .check-field { display: flex; align-items: flex-end; padding-bottom: 6px; gap: 8px; color: var(--muted); font-size: 13px; }
    .add-form .check-field input { width: auto; min-height: 0; }
    .add-form .add-actions { grid-column: span 3; display: flex; align-items: center; gap: 10px; }
    .add-status { font-size: 13px; color: var(--muted); }

    .fan-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      margin-bottom: 14px;
      overflow: visible;
    }
    .fan-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-2);
      border-radius: 8px 8px 0 0;
    }
    .fan-head h2 { font-size: 15px; font-weight: 740; }
    .fan-head .count { color: var(--muted); font-size: 12px; }
    .fan-head .earliest { color: var(--gold); font-size: 12px; }

    .task-row {
      display: grid;
      grid-template-columns: minmax(140px, 1.2fr) 96px 150px minmax(160px, 1.4fr) auto auto;
      gap: 8px;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid rgba(44, 57, 75, 0.5);
    }
    .task-row:last-child { border-bottom: 0; }
    .task-row.row-done .task-biz { opacity: 0.55; text-decoration: line-through; }
    .task-biz { font-size: 14px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .badge {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 999px;
      font-size: 11px;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .badge.secret { color: var(--gold); border-color: var(--gold); }
    .badge.pickup-off { color: var(--green); border-color: var(--green); }
    .badge.pickup-mail { color: var(--teal); border-color: var(--teal); }
    .badge.tag-btn { cursor: pointer; }
    .badge.tag-btn:hover { border-color: var(--text); color: var(--text); }
    .fan-bulk { display: inline-flex; gap: 6px; align-items: center; margin-left: auto; }
    .fan-bulk input[type="date"] {
      min-height: 28px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--ink);
      color: var(--text);
      padding: 0 8px;
      font-size: 12px;
    }
    .task-row input[type="date"], .task-row input[type="text"] {
      width: 100%;
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--ink);
      color: var(--text);
      padding: 4px 8px;
      font-size: 13px;
      outline: none;
      color-scheme: dark;
    }
    .task-row input:focus { border-color: var(--teal); }

    .done-toggle {
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .done-toggle.done { border-color: var(--green); color: var(--green); }
    .done-toggle:hover { border-color: var(--teal); }

    .info-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      line-height: 1;
    }
    .info-btn:hover, .info-btn.active { border-color: var(--teal); color: var(--teal); }

    .save-btn {
      min-height: 30px;
      padding: 0 12px;
      border: 1px solid var(--teal);
      border-radius: 6px;
      background: transparent;
      color: var(--teal);
      font-size: 13px;
    }
    .save-btn:hover { background: var(--teal); color: var(--ink); }
    .save-btn:disabled { cursor: wait; opacity: 0.6; }
    .save-btn.saved { border-color: var(--green); color: var(--green); }

    .detail-pop {
      position: fixed;
      z-index: 40;
      max-width: min(360px, calc(100vw - 32px));
      background: var(--panel-2);
      border: 1px solid var(--teal);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      color: var(--text);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .detail-pop .src { display: block; margin-top: 8px; color: #657386; font-size: 11px; }
    .detail-pop .ref-img {
      display: block;
      max-width: 100%;
      max-height: 420px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .detail-pop .ref-pending { color: var(--muted); }

    .empty-state { color: var(--muted); text-align: center; padding: 40px 0; font-size: 14px; }

    @media (max-width: 900px) {
      .add-form { grid-template-columns: 1fr; }
      .add-form textarea, .add-form .field.wide, .add-form .add-actions { grid-column: span 1; }
      .task-row { grid-template-columns: 1fr 100px; }
      .task-biz { grid-column: span 2; }
    }
  </style>
</head>
<body>
  <div id="loginOverlay">
    <div class="login-box">
      <h1>应援会业务管理</h1>
      <p>请输入业务管理页密码</p>
      <input type="password" id="passwordInput" placeholder="密码" autocomplete="current-password" autofocus>
      <button class="login-btn" id="loginBtn">进入</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <div class="page" id="page">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="title">
          <h1>应援会业务管理</h1>
          <p>按粉丝分组的业务完成状态跟踪（仅内部可见，数据仅保存腾讯云）</p>
        </div>
        <div class="topbar-actions">
          <span id="updatedAt">更新于：-</span>
          <button class="btn" id="reloadBtn" type="button">重新加载</button>
        </div>
      </div>
    </header>

    <main>
      <div class="filter-bar" id="filterBar" style="display:none">
        <div class="filter-row">
          <span class="filter-label">业务类型</span>
          <div class="chips-col" id="bizChips"></div>
          <button class="btn danger" id="batchDoneBtn" type="button">筛选结果全部标记为已完成</button>
        </div>
        <div class="filter-row">
          <span class="filter-label">领取方式</span>
          <div class="chips" id="pickupChips"></div>
        </div>
        <div class="filter-row">
          <span class="filter-label">来源标签</span>
          <div class="chips" id="tagChips"></div>
        </div>
      </div>

      <section class="kpi-grid" aria-label="筛选结果统计">
        <div class="kpi"><div class="label">粉丝数</div><div class="value" id="statFans">0</div></div>
        <div class="kpi s-pending"><div class="label">未完成</div><div class="value" id="statPending">0</div></div>
        <div class="kpi s-done"><div class="label">已完成</div><div class="value" id="statDone">0</div></div>
      </section>

      <details class="add-panel" id="addPanel">
        <summary>新增业务</summary>
        <form class="add-form" id="addForm">
          <div class="field"><label>粉丝名称 *</label><input id="addFan" required maxlength="80"></div>
          <div class="field"><label>业务类型 *</label><input id="addBiz" required maxlength="80" placeholder="如：点唱 / 手写奖状"></div>
          <div class="field"><label>类别标注</label><input id="addCategory" maxlength="80" placeholder="如：暗账 / 瓜 / 总选服"></div>
          <div class="field"><label>计划完成时间</label><input id="addPlanned" type="date"></div>
          <div class="field"><label>备注</label><input id="addNote" maxlength="500"></div>
          <div class="check-field"><input type="checkbox" id="addDone"><label for="addDone">已完成</label></div>
          <div class="field wide"><label>详情（“?”图标悬浮内容）</label><textarea id="addDetail" maxlength="500"></textarea></div>
          <div class="add-actions">
            <button class="btn primary" type="submit" id="addSubmit">添加</button>
            <span class="add-status" id="addStatus2"></span>
          </div>
        </form>
      </details>

      <div id="groupList"></div>
      <div class="empty-state" id="emptyState" style="display:none">暂无业务数据</div>
    </main>
  </div>

  <div class="detail-pop" id="detailPop" style="display:none"></div>

  <script src="/static/js/tracker.js?v={{ static_version('js/tracker.js') }}"></script>
  <script>
    (function () {
      "use strict";

      var password = "";
      var loginBusy = false;
      var loginVerified = false;
      var tasks = [];
      var activeTypes = new Set();
      var activePickup = "";
      var activeTag = "";

      var loginOverlay = document.getElementById("loginOverlay");
      var passwordInput = document.getElementById("passwordInput");
      var loginBtn = document.getElementById("loginBtn");
      var loginError = document.getElementById("loginError");
      var pageEl = document.getElementById("page");
      var detailPop = document.getElementById("detailPop");

      function trackAdminEvent(eventType, data) {
        if (!window._trackEvent) return;
        window._trackEvent(eventType, Object.assign({ area: "business_admin" }, data || {}));
      }

      function setLoginFeedback(kind, message) {
        loginError.textContent = message;
        loginError.classList.add("show");
        loginError.classList.toggle("status", kind === "verifying");
        loginError.classList.toggle("success", kind === "loading" || kind === "retry");
        loginBtn.disabled = kind === "verifying" || kind === "loading";
        passwordInput.disabled = kind !== "idle";
        loginBtn.textContent = kind === "verifying" ? "正在验证…" : (kind === "loading" ? "正在加载…" : (kind === "retry" ? "重试加载" : "进入"));
      }

      function resetLoginForPassword(message) {
        loginBusy = false;
        loginVerified = false;
        password = "";
        passwordInput.disabled = false;
        passwordInput.value = "";
        loginBtn.disabled = false;
        loginBtn.textContent = "进入";
        loginError.textContent = message || "密码错误";
        loginError.classList.remove("status", "success");
        loginError.classList.add("show");
        loginOverlay.classList.remove("hidden");
        passwordInput.focus();
      }

      function showLoginLoadRetry(message) {
        loginBusy = false;
        loginVerified = true;
        setLoginFeedback("retry", message || "密码正确，但数据加载失败，请点击重试加载");
      }

      async function readError(resp) {
        try {
          var body = await resp.json();
          if (body && body.detail) return String(body.detail);
        } catch (e) { /* ignore */ }
        return "";
      }

      async function verifyLoginPassword() {
        var resp = await fetch("/api/business/verify", {
          headers: { "X-Business-Admin-Password": password },
          cache: "no-store"
        });
        if (!resp.ok) throw new Error(await readError(resp) || "密码验证失败");
      }

      async function doLogin() {
        if (loginBusy) return;
        if (!loginVerified) {
          var value = passwordInput.value.trim();
          if (!value) return;
          password = value;
        }
        loginBusy = true;
        trackAdminEvent("login_attempt", { action: "business_admin_login", result: "submitted" });
        if (!loginVerified) {
          setLoginFeedback("verifying", "正在验证密码…");
          try {
            await verifyLoginPassword();
            loginVerified = true;
          } catch (error) {
            resetLoginForPassword(error.message || "密码验证失败，请重试");
            trackAdminEvent("login_attempt", { action: "business_admin_login", result: "failure" });
            return;
          }
        }
        setLoginFeedback("loading", "密码正确，正在加载业务数据…");
        await loadData(true);
      }

      async function loadData(fromLogin) {
        try {
          var resp = await fetch("/api/business/data", {
            headers: { "X-Business-Admin-Password": password },
            cache: "no-store"
          });
          if (resp.status === 401 || resp.status === 403) {
            resetLoginForPassword(loginVerified ? "密码已失效，请重新输入" : "密码错误");
            return;
          }
          if (!resp.ok) throw new Error(await readError(resp) || "数据加载失败");
          var data = await resp.json();
          tasks = Array.isArray(data.tasks) ? data.tasks : [];
          renderBizChips();
          renderPickupChips();
          renderGroups();
          document.getElementById("updatedAt").textContent = "更新于：" + (data.updated_at || data.generated_at || "-");
          loginBusy = false;
          loginOverlay.classList.add("hidden");
          pageEl.classList.add("ready");
          if (fromLogin) trackAdminEvent("login_attempt", { action: "business_admin_login", result: "success" });
        } catch (error) {
          if (loginOverlay.classList.contains("hidden")) {
            alert(error.message || "数据加载失败，请稍后重试");
            loginBusy = false;
          } else {
            showLoginLoadRetry("密码正确，但数据加载失败：" + (error.message || "请重试"));
          }
        }
      }

      function renderStats(items) {
        var done = 0;
        items.forEach(function (item) { if (item.status === "已完成") done += 1; });
        document.getElementById("statFans").textContent = new Set(items.map(function (i) { return i.fan_name; })).size;
        document.getElementById("statPending").textContent = items.length - done;
        document.getElementById("statDone").textContent = done;
      }

      function tagsOf(task) {
        var raw = task.source_section || "";
        if (!raw) return [];
        var seen = [];
        raw.split("、").forEach(function (part) {
          var tag = part.trim().replace(/（累计补登）$/, "");
          if (!tag || /^[〇零一二三四五六七八九十]+$/.test(tag)) return;
          if (tag === "线下领取确认名单") return; // 与领取方式徽章/筛选重复，不展示
          if (seen.indexOf(tag) < 0) seen.push(tag);
        });
        return seen;
      }

      function pickupOf(task) {
        var note = task.note || "";
        if (note.indexOf("邮寄") >= 0) return "邮寄";
        if (note.indexOf("线下领取") >= 0 || note.indexOf("现场交付") >= 0) return "面取";
        return "未确定";
      }

      function groupTagOf(task) {
        if (PHYSICAL_ORDER.indexOf(task.biz_type) >= 0) return "实体";
        if (ONLINE_ORDER.indexOf(task.biz_type) >= 0) return "虚拟";
        return "";
      }

      function visibleTasks(ignoreTag) {
        var out = tasks;
        if (activeTypes.size) {
          out = out.filter(function (item) { return activeTypes.has(item.biz_type); });
        }
        if (activePickup) {
          out = out.filter(function (item) { return pickupOf(item) === activePickup; });
        }
        if (activeTag && !ignoreTag) {
          out = out.filter(function (item) {
            return tagsOf(item).indexOf(activeTag) >= 0 || groupTagOf(item) === activeTag;
          });
        }
        return out;
      }

      // 业务类型分组：实体（按交付链路排序）、线上、其他；未列入的归入"其他"
      var PHYSICAL_ORDER = [
        "手写奖状", "挑礼物＋选购原因卡片", "仪嘉人签名", "甲鱼/顺顺两寸照或顺顺毛发护身符",
        "手作盲盒 A（消耗型）", "手作盲盒 B（保存型）", "感恩手写信", "手写感谢信",
        "甲鱼的神秘礼物", "随机拼豆", "指定拼豆"
      ];
      var ONLINE_ORDER = [
        "ID 合影", "顺呆点 ID 合影", "加入背景墙", "抖音点唱", "点唱", "自拍",
        "指定手势舞", "指定造型", "感谢视频", "画头像", "写 ID 发口袋",
        "指定风格写真（需甲鱼审核）", "翻跟斗", "查水表", "答案之书", "圣诞树"
      ];

      function groupTypes(types) {
        var pick = function (order) {
          return order.filter(function (t) { return types.indexOf(t) >= 0; });
        };
        var physical = pick(PHYSICAL_ORDER);
        var online = pick(ONLINE_ORDER);
        var other = types.filter(function (t) {
          return PHYSICAL_ORDER.indexOf(t) < 0 && ONLINE_ORDER.indexOf(t) < 0;
        }).sort();
        return [["实体", physical], ["虚拟", online], ["其他", other]].filter(function (g) { return g[1].length; });
      }

      function renderBizChips() {
        var bar = document.getElementById("filterBar");
        var chips = document.getElementById("bizChips");
        chips.innerHTML = "";
        var types = [];
        tasks.forEach(function (item) {
          if (item.biz_type && types.indexOf(item.biz_type) < 0) types.push(item.biz_type);
        });
        if (!types.length) { bar.style.display = "none"; return; }
        bar.style.display = "flex";

        function makeChip(label, isActive, onClick, extraClass) {
          var chip = document.createElement("button");
          chip.type = "button";
          chip.className = "chip" + (extraClass || "") + (isActive ? " active" : "");
          chip.textContent = label;
          chip.addEventListener("click", onClick);
          return chip;
        }

        var allRow = document.createElement("div");
        allRow.className = "chip-row";
        allRow.appendChild(makeChip("全部", activeTypes.size === 0, function () {
          activeTypes.clear();
          renderBizChips();
          renderGroups();
        }));
        chips.appendChild(allRow);

        groupTypes(types).forEach(function (group) {
          var groupName = group[0], groupList = group[1];
          var row = document.createElement("div");
          row.className = "chip-row";
          var allIn = groupList.every(function (t) { return activeTypes.has(t); });
          row.appendChild(makeChip(groupName, allIn, function () {
            if (allIn) {
              groupList.forEach(function (t) { activeTypes.delete(t); });
            } else {
              groupList.forEach(function (t) { activeTypes.add(t); });
            }
            renderBizChips();
            renderGroups();
          }, " group-btn"));
          groupList.forEach(function (type) {
            row.appendChild(makeChip(type, activeTypes.has(type), function () {
              if (activeTypes.has(type)) activeTypes.delete(type);
              else activeTypes.add(type);
              renderBizChips();
              renderGroups();
            }));
          });
          chips.appendChild(row);
        });
      }

      function renderPickupChips() {
        var box = document.getElementById("pickupChips");
        box.innerHTML = "";
        [["", "全部"], ["面取", "面取"], ["邮寄", "邮寄"], ["未确定", "未确定"]].forEach(function (pair) {
          var chip = document.createElement("button");
          chip.type = "button";
          chip.className = "chip" + (pair[0] === activePickup ? " active" : "");
          chip.textContent = pair[1];
          chip.addEventListener("click", function () {
            activePickup = pair[0];
            renderPickupChips();
            renderGroups();
          });
          box.appendChild(chip);
        });
      }

      function renderTagChips() {
        var box = document.getElementById("tagChips");
        box.innerHTML = "";
        // 可选标签随前两个筛选动态变化
        var counts = new Map();
        visibleTasks(true).forEach(function (item) {
          tagsOf(item).forEach(function (tag) {
            counts.set(tag, (counts.get(tag) || 0) + 1);
          });
          var g = groupTagOf(item);
          if (g) counts.set(g, (counts.get(g) || 0) + 1);
        });
        if (activeTag && !counts.has(activeTag)) activeTag = "";
        var all = document.createElement("button");
        all.type = "button";
        all.className = "chip" + (activeTag === "" ? " active" : "");
        all.textContent = "全部";
        all.addEventListener("click", function () {
          activeTag = "";
          renderGroups();
        });
        box.appendChild(all);
        var orderedTags = ["实体", "虚拟"].filter(function (t) { return counts.has(t); })
          .concat(Array.from(counts.keys()).filter(function (t) { return t !== "实体" && t !== "虚拟"; }).sort());
        orderedTags.forEach(function (tag) {
          var chip = document.createElement("button");
          chip.type = "button";
          chip.className = "chip" + (tag === activeTag ? " active" : "");
          chip.textContent = tag + " (" + counts.get(tag) + ")";
          chip.addEventListener("click", function () {
            activeTag = (activeTag === tag) ? "" : tag;
            renderGroups();
          });
          box.appendChild(chip);
        });
      }

      function earliestPlanned(items) {
        var dates = items.map(function (t) { return t.planned_date || ""; }).filter(Boolean);
        if (!dates.length) return "";
        return dates.sort()[0];
      }

      function renderGroups() {
        var container = document.getElementById("groupList");
        container.innerHTML = "";
        renderTagChips();
        var visible = visibleTasks();
        renderStats(visible);
        document.getElementById("emptyState").style.display = visible.length ? "none" : "block";
        if (!visible.length && tasks.length) {
          document.getElementById("emptyState").textContent = "当前筛选下没有业务";
        } else {
          document.getElementById("emptyState").textContent = "暂无业务数据";
        }
        var groups = new Map();
        visible.forEach(function (task) {
          var key = task.fan_name || "（未命名）";
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(task);
        });
        var entries = Array.from(groups.entries());
        entries.sort(function (a, b) {
          var da = earliestPlanned(a[1]);
          var db = earliestPlanned(b[1]);
          if (da && db && da !== db) return da < db ? -1 : 1;
          if (da && !db) return -1;
          if (!da && db) return 1;
          return a[0].localeCompare(b[0], "zh-Hans-CN");
        });
        entries.forEach(function (pair) {
          container.appendChild(buildFanCard(pair[0], pair[1]));
        });
      }

      function buildFanCard(fan, items) {
        var card = document.createElement("section");
        card.className = "fan-card";
        var head = document.createElement("div");
        head.className = "fan-head";
        var title = document.createElement("h2");
        title.textContent = fan;

        var bulk = document.createElement("span");
        bulk.className = "fan-bulk";
        var bulkDate = document.createElement("input");
        bulkDate.type = "date";
        bulkDate.title = "选择日期后点右侧按钮，批量设置该粉丝所有未面取实体礼物的计划领取时间";
        var bulkBtn = document.createElement("button");
        bulkBtn.type = "button";
        bulkBtn.className = "save-btn";
        bulkBtn.textContent = "批量设面取日期";
        bulkBtn.addEventListener("click", async function () {
          if (!bulkDate.value) { alert("请先选择日期"); return; }
          var ids = items.filter(function (t) {
            return t.status !== "已完成" && PHYSICAL_ORDER.indexOf(t.biz_type) >= 0;
          }).map(function (t) { return t.id; });
          if (!ids.length) { alert("该粉丝没有未完成的实体业务"); return; }
          if (!confirm("将把「" + fan + "」的 " + ids.length + " 条未完成实体业务的计划时间设为 " + bulkDate.value + "，确认？")) return;
          bulkBtn.disabled = true;
          try {
            var resp = await fetch("/api/business/update", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-Business-Admin-Password": password
              },
              body: JSON.stringify({ action: "set_planned", ids: ids, planned_date: bulkDate.value })
            });
            if (resp.status === 401 || resp.status === 403) {
              resetLoginForPassword("密码已失效，请重新输入");
              return;
            }
            if (!resp.ok) throw new Error(await readError(resp) || "批量设置失败");
            var body = await resp.json();
            var changed = body.updated_count || 0;
            tasks = tasks.map(function (item) {
              return ids.indexOf(item.id) >= 0 && item.status !== "已完成"
                ? Object.assign({}, item, { planned_date: bulkDate.value })
                : item;
            });
            renderGroups();
            alert("已设置 " + changed + " 条");
          } catch (error) {
            alert(error.message || "批量设置失败，请重试");
          } finally {
            bulkBtn.disabled = false;
          }
        });
        bulk.appendChild(bulkDate);
        bulk.appendChild(bulkBtn);

        var right = document.createElement("span");
        right.className = "count";
        var earliest = earliestPlanned(items);
        right.textContent = items.length + " 项业务" + (earliest ? " · 最近计划 " + earliest : "");
        head.appendChild(title);
        head.appendChild(bulk);
        head.appendChild(right);
        card.appendChild(head);
        items.forEach(function (task) {
          card.appendChild(buildTaskRow(task));
        });
        return card;
      }

      function buildTaskRow(task) {
        var row = document.createElement("div");
        row.className = "task-row" + (task.status === "已完成" ? " row-done" : "");
        row.dataset.id = task.id;

        var biz = document.createElement("div");
        biz.className = "task-biz";
        var bizText = document.createElement("span");
        bizText.textContent = task.biz_type || "（未分类）";
        biz.appendChild(bizText);
        if (task.category) {
          // 与来源标签重复的类别徽章不显示（暗账实体奖励 / 总选计分奖励）
          var srcTags = tagsOf(task);
          var dup = (task.category === "暗账" && srcTags.indexOf("暗账实体奖励") >= 0) ||
                    (task.category === "计分奖励" && srcTags.indexOf("总选计分奖励") >= 0);
          if (!dup) {
            var badge = document.createElement("span");
            badge.className = "badge" + (task.category === "暗账" ? " secret" : "");
            badge.textContent = task.category;
            biz.appendChild(badge);
          }
        }
        if (task.source_section) {
          tagsOf(task).forEach(function (tag) {
            var src = document.createElement("span");
            src.className = "badge tag-btn";
            src.textContent = tag;
            src.title = "点击按此标签筛选";
            src.addEventListener("click", function (event) {
              event.stopPropagation();
              activeTag = (activeTag === tag) ? "" : tag;
              renderGroups();
            });
            biz.appendChild(src);
          });
        }
        var pickup = pickupOf(task);
        if (pickup !== "未确定") {
          var pk = document.createElement("span");
          pk.className = "badge tag-btn " + (pickup === "面取" ? "pickup-off" : "pickup-mail");
          pk.textContent = pickup;
          pk.title = "点击按此领取方式筛选";
          pk.addEventListener("click", function (event) {
            event.stopPropagation();
            activePickup = (activePickup === pickup) ? "" : pickup;
            renderPickupChips();
            renderGroups();
          });
          biz.appendChild(pk);
        }
        row.appendChild(biz);

        var toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "done-toggle" + (task.status === "已完成" ? " done" : "");
        toggle.textContent = task.status === "已完成" ? "✓ 已完成" : "未完成";
        toggle.addEventListener("click", function () {
          var done = !toggle.classList.contains("done");
          toggle.classList.toggle("done", done);
          toggle.textContent = done ? "✓ 已完成" : "未完成";
          row.classList.toggle("row-done", done);
        });
        row.appendChild(toggle);

        var planned = document.createElement("input");
        planned.type = "date";
        planned.value = task.planned_date || "";
        planned.title = "计划完成时间";
        row.appendChild(planned);

        var note = document.createElement("input");
        note.type = "text";
        note.value = task.note || "";
        note.placeholder = "备注";
        note.maxLength = 500;
        row.appendChild(note);

        var infoCell = document.createElement("div");
        var info = document.createElement("button");
        info.type = "button";
        info.className = "info-btn";
        info.textContent = "?";
        info.addEventListener("mouseenter", function () {
          openDetailPop(info, task);
        });
        info.addEventListener("mouseleave", function () {
          scheduleCloseDetail();
        });
        info.addEventListener("click", function (event) {
          event.stopPropagation();
          if (detailPop.style.display !== "none" && detailPop.dataset.id === task.id) {
            closeDetailPop();
          } else {
            openDetailPop(info, task);
          }
        });
        infoCell.appendChild(info);
        row.appendChild(infoCell);

        var save = document.createElement("button");
        save.type = "button";
        save.className = "save-btn";
        save.textContent = "保存";
        save.addEventListener("click", function () {
          saveTask(task.id, toggle.classList.contains("done") ? "已完成" : "未完成", planned.value, note.value, save);
        });
        row.appendChild(save);

        return row;
      }

      var detailCloseTimer = null;

      function closeDetailPop() {
        clearTimeout(detailCloseTimer);
        detailPop.style.display = "none";
        detailPop.dataset.id = "";
        document.querySelectorAll(".info-btn.active").forEach(function (btn) { btn.classList.remove("active"); });
      }

      function scheduleCloseDetail() {
        clearTimeout(detailCloseTimer);
        detailCloseTimer = setTimeout(closeDetailPop, 250);
      }

      function openDetailPop(anchor, task) {
        clearTimeout(detailCloseTimer);
        if (detailPop.style.display !== "none" && detailPop.dataset.id === task.id) return;
        document.querySelectorAll(".info-btn.active").forEach(function (btn) { btn.classList.remove("active"); });
        anchor.classList.add("active");
        detailPop.innerHTML = "";
        var hasContent = false;
        if (task.detail) {
          var text = document.createElement("div");
          text.textContent = task.detail;
          detailPop.appendChild(text);
          hasContent = true;
        }
        var refImages = task.ref_images || [];
        if (refImages.length) {
          hasContent = true;
          refImages.forEach(function (name) {
            var img = document.createElement("img");
            img.className = "ref-img";
            img.alt = name;
            img.loading = "lazy";
            img.src = "/api/business/reference-image?name=" + encodeURIComponent(name);
            detailPop.appendChild(img);
          });
        }
        if (!hasContent) {
          var pending = document.createElement("div");
          pending.className = "ref-pending";
          pending.textContent = "待添加";
          detailPop.appendChild(pending);
        }
        var src = document.createElement("span");
        src.className = "src";
        src.textContent = "来源：" + (task.source_section || "-") + "；更新于 " + (task.updated_at || "-");
        detailPop.appendChild(src);
        detailPop.dataset.id = task.id;
        detailPop.style.display = "block";
        var rect = anchor.getBoundingClientRect();
        var top = rect.bottom + 8;
        var left = Math.min(rect.left, window.innerWidth - detailPop.offsetWidth - 16);
        if (top + detailPop.offsetHeight > window.innerHeight - 8) {
          top = Math.max(8, rect.top - detailPop.offsetHeight - 8);
        }
        detailPop.style.top = top + "px";
        detailPop.style.left = Math.max(8, left) + "px";
      }

      document.addEventListener("click", function () {
        closeDetailPop();
      });
      detailPop.addEventListener("click", function (event) { event.stopPropagation(); });
      detailPop.addEventListener("mouseenter", function () { clearTimeout(detailCloseTimer); });
      detailPop.addEventListener("mouseleave", function () { scheduleCloseDetail(); });

      async function saveTask(id, statusValue, plannedValue, noteValue, button) {
        button.disabled = true;
        button.classList.remove("saved");
        try {
          var resp = await fetch("/api/business/update", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Business-Admin-Password": password
            },
            body: JSON.stringify({
              action: "update",
              id: id,
              status: statusValue,
              planned_date: plannedValue,
              note: noteValue
            })
          });
          if (resp.status === 401 || resp.status === 403) {
            resetLoginForPassword("密码已失效，请重新输入");
            return;
          }
          if (!resp.ok) throw new Error(await readError(resp) || "保存失败");
          var body = await resp.json();
          var updated = body.task || {};
          tasks = tasks.map(function (item) { return item.id === id ? Object.assign({}, item, updated) : item; });
          renderStats(visibleTasks());
          button.textContent = "已保存";
          button.classList.add("saved");
          setTimeout(function () { button.textContent = "保存"; button.classList.remove("saved"); }, 1600);
          trackAdminEvent("save_task", { action: "business_task_update", result: "success" });
        } catch (error) {
          alert(error.message || "保存失败，请重试");
          trackAdminEvent("save_task", { action: "business_task_update", result: "failure" });
        } finally {
          button.disabled = false;
        }
      }

      document.getElementById("batchDoneBtn").addEventListener("click", async function () {
        var pending = visibleTasks().filter(function (item) { return item.status !== "已完成"; });
        if (!pending.length) {
          alert("当前筛选结果中没有未完成的业务");
          return;
        }
        var scopeParts = [];
        if (activeTypes.size) scopeParts.push("选中的 " + activeTypes.size + " 个类型");
        if (activePickup) scopeParts.push("领取方式「" + activePickup + "」");
        var scope = scopeParts.length ? scopeParts.join("＋") : "全部业务";
        if (!confirm("将把" + scope + "中 " + pending.length + " 条未完成业务全部标记为已完成，确认执行？")) {
          return;
        }
        var btn = document.getElementById("batchDoneBtn");
        btn.disabled = true;
        try {
          var resp = await fetch("/api/business/update", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Business-Admin-Password": password
            },
            body: JSON.stringify({
              action: "batch_complete",
              ids: pending.map(function (item) { return item.id; })
            })
          });
          if (resp.status === 401 || resp.status === 403) {
            resetLoginForPassword("密码已失效，请重新输入");
            return;
          }
          if (!resp.ok) throw new Error(await readError(resp) || "批量操作失败");
          var body = await resp.json();
          trackAdminEvent("save_task", { action: "business_batch_complete", result: "success", count: body.updated_count });
          await loadData(false);
          alert("已将 " + (body.updated_count || 0) + " 条业务标记为已完成");
        } catch (error) {
          alert(error.message || "批量操作失败，请重试");
        } finally {
          btn.disabled = false;
        }
      });

      document.getElementById("addForm").addEventListener("submit", async function (event) {
        event.preventDefault();
        var submit = document.getElementById("addSubmit");
        var statusEl = document.getElementById("addStatus2");
        submit.disabled = true;
        statusEl.textContent = "保存中…";
        try {
          var resp = await fetch("/api/business/update", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Business-Admin-Password": password
            },
            body: JSON.stringify({
              action: "add",
              fan_name: document.getElementById("addFan").value,
              biz_type: document.getElementById("addBiz").value,
              category: document.getElementById("addCategory").value,
              status: document.getElementById("addDone").checked ? "已完成" : "未完成",
              planned_date: document.getElementById("addPlanned").value,
              note: document.getElementById("addNote").value,
              detail: document.getElementById("addDetail").value
            })
          });
          if (resp.status === 401 || resp.status === 403) {
            resetLoginForPassword("密码已失效，请重新输入");
            return;
          }
          if (!resp.ok) throw new Error(await readError(resp) || "添加失败");
          var body = await resp.json();
          if (body.task && body.task.id) tasks.push(body.task);
          statusEl.textContent = "已添加";
          event.target.reset();
          await loadData(false);
        } catch (error) {
          statusEl.textContent = error.message || "添加失败，请重试";
        } finally {
          submit.disabled = false;
        }
      });

      document.getElementById("reloadBtn").addEventListener("click", function () { loadData(false); });
      loginBtn.addEventListener("click", doLogin);
      passwordInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") doLogin();
      });
    })();
  </script>
</body>
</html>
