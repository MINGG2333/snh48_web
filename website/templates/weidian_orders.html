<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>微店订单管理 · {{ site_title }}</title>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --line:#e4e7ec; --text:#1f2937; --muted:#6b7280; --pink:#d9467f; --green:#0f9f6e; --amber:#b45309; --red:#c0392b; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    .hidden { display:none !important; }
    #loginOverlay { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; background:var(--bg); padding:24px; }
    .login-box { width:min(380px,100%); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px; box-shadow:0 18px 50px rgba(0,0,0,.15); }
    .login-box h1 { font-size:20px; margin:0 0 8px; }
    .login-box p { color:var(--muted); font-size:14px; margin:0 0 18px; }
    .login-box input { width:100%; min-height:44px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--text); padding:0 12px; outline:none; }
    .login-box input:focus { border-color:var(--pink); }
    .login-btn { width:100%; min-height:44px; margin-top:12px; border:0; border-radius:8px; background:var(--pink); color:#fff; font-weight:700; cursor:pointer; }
    .login-btn:disabled { opacity:.7; cursor:wait; }
    .login-error { display:none; margin-top:10px; color:var(--red); font-size:13px; }
    .login-error.show { display:block; }
    .page { display:none; }
    .page.ready { display:block; }
    .wrap { max-width:1400px; margin:0 auto; padding:18px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    h1 { font-size:20px; margin:0; }
    .sub { color:var(--muted); font-size:12px; margin-top:4px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
    .toolbar input, .toolbar select { height:34px; border:1px solid var(--line); border-radius:8px; padding:0 10px; background:#fff; color:var(--text); }
    .toolbar input[type=text] { min-width:220px; }
    .btn { height:34px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--text); padding:0 12px; cursor:pointer; }
    .btn:hover { border-color:var(--pink); color:var(--pink); }
    .btn.primary { background:var(--pink); border-color:var(--pink); color:#fff; }
    .btn.primary:hover { opacity:.9; color:#fff; }
    .btn.mini { height:28px; padding:0 8px; font-size:12px; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .chk { display:inline-flex; align-items:center; gap:5px; color:var(--muted); font-size:12px; }
    .multi { position:relative; }
    .multi > summary { list-style:none; height:34px; display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:8px; padding:0 10px; background:#fff; cursor:pointer; user-select:none; }
    .multi > summary::-webkit-details-marker { display:none; }
    .multi > summary::after { content:"▾"; color:var(--muted); font-size:11px; }
    .multi[open] > summary { border-color:var(--pink); color:var(--pink); }
    .multi-panel { position:absolute; z-index:20; top:calc(100% + 4px); left:0; width:min(360px,90vw); max-height:320px; overflow:auto; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 12px 30px rgba(0,0,0,.12); padding:8px; }
    .multi-actions { display:flex; gap:6px; margin-bottom:6px; }
    .multi-options label { display:flex; align-items:center; gap:8px; padding:6px; border-radius:6px; cursor:pointer; font-size:13px; }
    .multi-options label:hover { background:#fafafa; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-weight:600; font-size:12px; white-space:nowrap; }
    tr:hover td { background:#fafafa; }
    .name { font-weight:600; }
    .raw { color:var(--muted); font-size:12px; }
    .muted { color:var(--muted); }
    .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; background:#eef2f7; color:#334155; white-space:nowrap; }
    .pill.awaiting { background:#fff7e6; color:var(--amber); }
    .pill.shipped, .pill.completed { background:#e8f7f0; color:var(--green); }
    .pill.pending { background:#fff1f2; color:var(--red); }
    .pill.closed { background:#f1f5f9; color:#475569; }
    .pill.refunded { background:#fef2f2; color:#b91c1c; }
    .actions { display:flex; flex-wrap:wrap; gap:6px; }
    .toast { position:fixed; right:18px; bottom:18px; background:#111827; color:#fff; padding:10px 14px; border-radius:10px; max-width:min(520px,90vw); opacity:0; transform:translateY(8px); transition:.2s; pointer-events:none; z-index:50; }
    .toast.show { opacity:1; transform:none; }
    .toast.err { background:#991b1b; }
    .statusbar { color:var(--muted); font-size:12px; min-height:18px; margin-left:6px; }
    .multi-group { color:var(--muted); font-size:12px; font-weight:600; padding:6px 6px 2px; }
    .job { color:var(--muted); font-size:12px; }
    th input[type=checkbox], td input[type=checkbox] { width:15px; height:15px; accent-color:var(--pink); vertical-align:middle; }
    @media (max-width: 900px) { th:nth-child(2), td:nth-child(2) { display:none; } }
  </style>
</head>
<body>
<div id="loginOverlay">
  <div class="login-box">
    <h1>微店订单管理</h1>
    <p>请输入管理密码</p>
    <input id="passwordInput" type="password" autocomplete="new-password" placeholder="密码">
    <button class="login-btn" id="loginBtn">进入</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div class="page" id="page">
<div class="wrap">
  <header>
    <div>
      <h1>微店订单管理</h1>
      <div class="sub">所有商品 · 数据来自本机 canonical 订单库 · 不展示地址/完整电话 · 账号仅展示脱敏信息</div>
    </div>
    <div class="actions">
      <a class="btn" href="/business/redblue2026">红蓝台账</a>
      <a class="btn" href="/business">业务管理</a>
    </div>
  </header>

  <div class="card">
    <div class="toolbar">
      <button class="btn primary" id="refreshBtn">立即刷新订单</button>
      <button class="btn" id="shipSelectedBtn" disabled>批量无需物流发货</button>
      <details class="multi" id="statusMenu">
        <summary id="statusSummary">全部状态</summary>
        <div class="multi-panel">
          <div class="multi-actions">
            <button type="button" class="btn mini" id="statusAll">全选</button>
            <button type="button" class="btn mini" id="statusClear">清空</button>
          </div>
          <div class="multi-options" id="statusOptions"></div>
        </div>
      </details>
      <select id="itemFilter"><option value="all">全部商品</option></select>
      <details class="multi" id="accountMenu">
        <summary id="accountSummary">全部账号</summary>
        <div class="multi-panel">
          <div class="multi-actions">
            <button type="button" class="btn mini" id="accountAll">全选</button>
            <button type="button" class="btn mini" id="accountClear">清空</button>
          </div>
          <div class="multi-options" id="accountOptions"></div>
        </div>
      </details>
      <input type="text" id="keyword" placeholder="订单号 / 昵称 / 账号 / 备注 / 商品">
      <label class="chk"><input type="checkbox" id="includeTest" checked> 重播含测试群</label>
      <label class="chk"><input type="checkbox" id="marker" checked> 标记（更正播报）</label>
      <span class="statusbar" id="statusBar"></span>
    </div>
    <div style="overflow:auto;">
      <table>
        <thead>
          <tr>
            <th style="width:34px;"><input type="checkbox" id="selectAll" aria-label="全选当前可发货订单" title="全选当前可发货订单"></th>
            <th>时间</th><th>订单号</th><th>商品</th><th>状态</th><th>播报名 / 收货人</th>
            <th>备注</th><th>金额 / 计分</th><th>发货</th><th>自动播报</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="11" class="muted">加载中…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var allOrders = [];
  var selectedAccounts = {};
  var selectedStatuses = {};
  var selectedOrders = {};
  var STATUS_GROUPS = [
    { label: "进行中", items: [["pending_payment", "待付款（未付款）"], ["awaiting_shipment", "待发货（已付款）"], ["shipped", "已发货（运输中）"]] },
    { label: "已结束", items: [["completed", "已完成（交易成功）"], ["closed", "已关闭（未付款/取消）"]] },
    { label: "退款/售后", items: [["refunding", "退款中（退款处理中）"], ["refunded_only", "已退款（钱已退回买家）"]] }
  ];
  var loading = false;

  function $(id) { return document.getElementById(id); }
  var page = $("page"), loginOverlay = $("loginOverlay"), loginError = $("loginError");
  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch];
    });
  }
  function toast(message, isError) {
    var el = $("toast");
    el.textContent = message;
    el.className = "toast show" + (isError ? " err" : "");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { el.className = "toast"; }, 4200);
  }
  function setStatus(text) { $("statusBar").textContent = text || ""; }

  function showLogin(message) {
    page.classList.remove("ready");
    loginOverlay.classList.remove("hidden");
    $("passwordInput").value = "";
    if (message) {
      loginError.textContent = message;
      loginError.classList.add("show");
    }
    setTimeout(function () { $("passwordInput").focus(); }, 30);
  }

  function showApp() {
    loginOverlay.classList.add("hidden");
    page.classList.add("ready");
  }

  async function api(path, options) {
    var resp = await fetch(path, Object.assign({credentials: "same-origin", cache: "no-store"}, options || {}));
    if (resp.status === 401 || resp.status === 403) {
      showLogin("登录已失效，请重新输入密码");
      throw new Error("登录已失效，请重新输入密码");
    }
    var data = await resp.json().catch(function () { return {}; });
    if (!resp.ok) throw new Error(data.detail || data.error || ("HTTP " + resp.status));
    return data;
  }

  async function doLogin() {
    var value = $("passwordInput").value.trim();
    if (!value) { loginError.textContent = "请输入密码"; loginError.classList.add("show"); return; }
    $("loginBtn").disabled = true;
    loginError.classList.remove("show");
    try {
      var response = await fetch("/api/weidian-orders/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({password: value}),
        credentials: "same-origin",
        cache: "no-store"
      });
      if (!response.ok) {
        var body = await response.json().catch(function () { return {}; });
        throw new Error(body.detail || "密码错误");
      }
      $("passwordInput").value = "";
      loginError.classList.remove("show");
      showApp();
      await loadData();
    } catch (error) {
      if (page.classList.contains("ready")) toast(error.message || "加载失败", true);
      else {
        loginError.textContent = error.message || "密码错误";
        loginError.classList.add("show");
      }
    } finally { $("loginBtn").disabled = false; }
  }

  async function loadData() {
    if (loading) return;
    loading = true;
    setStatus("加载中…");
    try {
      var data = await api("/api/weidian-orders/data");
      allOrders = data.orders || [];
      var stillSelectable = {};
      allOrders.forEach(function (order) {
        if (isSelectable(order)) stillSelectable[order.order_id] = true;
      });
      Object.keys(selectedOrders).forEach(function (orderId) {
        if (!stillSelectable[orderId]) delete selectedOrders[orderId];
      });
      renderItems();
      renderAccounts();
      render();
      setStatus("更新 " + (data.generated_at || "-") + " · 共 " + allOrders.length + " 单");
      return true;
    } catch (error) {
      if (page.classList.contains("ready")) toast(error.message || "加载失败", true);
      setStatus("");
      return false;
    } finally {
      loading = false;
    }
  }

  function renderItems() {
    var select = $("itemFilter");
    var current = select.value || "all";
    var seen = {};
    var options = ['<option value="all">全部商品</option>'];
    allOrders.forEach(function (row) {
      if (!row.item_id || seen[row.item_id]) return;
      seen[row.item_id] = true;
      options.push('<option value="' + esc(row.item_id) + '">' + esc(row.item_name) + '</option>');
    });
    select.innerHTML = options.join("");
    select.value = seen[current] ? current : "all";
  }

  function statusText(row) {
    if (row.status_kind === "refunded") {
      if (row.refund_state === "refunding") return "退款中";
      if (row.refund_state === "refunded") return "已退款";
    }
    return row.status_label || row.status || row.status_kind || "未知";
  }

  function statusTitle(row) {
    var parts = [];
    if (row.status_description) parts.push(row.status_description);
    if (row.refund_state_description) parts.push(row.refund_state_description);
    return parts.join(" · ");
  }

  function statusPill(row) {
    var kind = row.status_kind || "unknown";
    var title = statusTitle(row);
    return '<span class="pill ' + esc(kind) + '"' + (title ? ' title="' + esc(title) + '"' : '') + '>' + esc(statusText(row)) + '</span>';
  }

  function broadcastText(row) {
    if (!row.broadcast_at) return '<span class="muted">未自动播报</span>';
    if (row.broadcast_at === "baseline") return '<span class="muted">历史基线</span>';
    var channels = (row.broadcast_channels || []).map(function (value) {
      return value === "prod" ? "生产" : (value === "test" ? "测试" : value);
    });
    var text = '<span class="pill completed">已自动播报</span>';
    if (channels.length) text += '<div class="raw">' + esc(channels.join(" / ")) + '</div>';
    if (row.manual_broadcast_count) text += '<div class="raw">手动 ' + row.manual_broadcast_count + ' 次</div>';
    return text;
  }

  function moneyText(row) {
    if (Number(row.score) > 0) return Number(row.score) + "分";
    return "¥" + Number(row.amount || 0).toFixed(2);
  }

  // WEIDIAN_ACCOUNT_FILTER_PURE_START
  function accountKey(row) {
    var id = row.buyer_id ? String(row.buyer_id) : "";
    return id || "__unknown__";
  }

  function accountLabel(row) {
    var id = row.buyer_id ? String(row.buyer_id) : "";
    var phone = row.buyer_phone_masked ? String(row.buyer_phone_masked) : "";
    if (phone && id) return phone + " · ID " + id;
    if (phone) return phone;
    if (id) return "ID " + id;
    return "未知账号";
  }

  function statusMatches(row, statuses) {
    var keys = Object.keys(statuses || {});
    if (!keys.length) return true;
    for (var i = 0; i < keys.length; i++) {
      var key = keys[i];
      if (key === "refunding") {
        if (row.status_kind === "refunded" && row.refund_state === "refunding") return true;
      } else if (key === "refunded_only") {
        if (row.status_kind === "refunded" && row.refund_state === "refunded") return true;
      } else if (row.status_kind === key) {
        return true;
      }
    }
    return false;
  }

  function orderMatchesFilters(row, filters) {
    if (!statusMatches(row, filters.statuses)) return false;
    if (filters.item && filters.item !== "all" && row.item_id !== filters.item) return false;
    var accounts = filters.accounts || {};
    var accountKeys = Object.keys(accounts);
    if (accountKeys.length && accountKeys.indexOf(accountKey(row)) === -1) return false;
    var keyword = (filters.keyword || "").toLowerCase();
    if (keyword) {
      var hay = [row.order_id, row.display_name, row.receiver_name, row.buyer_id, row.buyer_phone_masked, row.buyer_note, row.seller_note, row.item_name, row.sku_title].join(" ").toLowerCase();
      if (hay.indexOf(keyword) === -1) return false;
    }
    return true;
  }
  // WEIDIAN_ACCOUNT_FILTER_PURE_END

  // WEIDIAN_BULK_SHIP_PURE_START
  function isSelectable(row) {
    return Boolean(row) && !row.shipped && row.status_kind === "awaiting_shipment";
  }

  function selectableRows(rows) {
    return (rows || []).filter(isSelectable);
  }

  function selectedShipRows(rows, selected) {
    var picked = selected || {};
    return selectableRows(rows).filter(function (row) {
      return Boolean(picked[row.order_id]);
    });
  }
  // WEIDIAN_BULK_SHIP_PURE_END

  function updateAccountSummary() {
    var count = Object.keys(selectedAccounts).length;
    $("accountSummary").textContent = count ? ("已选 " + count + " 个账号") : "全部账号";
  }

  function renderAccounts() {
    var container = $("accountOptions");
    if (!container) return;
    var seen = {};
    var accounts = [];
    allOrders.forEach(function (row) {
      var key = accountKey(row);
      if (seen[key]) return;
      seen[key] = true;
      accounts.push({ key: key, label: accountLabel(row) });
    });
    accounts.sort(function (left, right) {
      if (left.key === "__unknown__") return 1;
      if (right.key === "__unknown__") return -1;
      return left.label.localeCompare(right.label, "zh-CN");
    });
    var valid = {};
    accounts.forEach(function (item) { valid[item.key] = true; });
    Object.keys(selectedAccounts).forEach(function (key) {
      if (!valid[key]) delete selectedAccounts[key];
    });
    container.innerHTML = accounts.map(function (item) {
      var checked = selectedAccounts[item.key] ? " checked" : "";
      return '<label><input type="checkbox" data-account-key="' + esc(item.key) + '"' + checked + '> <span>' + esc(item.label) + '</span></label>';
    }).join("");
    updateAccountSummary();
  }

  function updateStatusSummary() {
    var count = Object.keys(selectedStatuses).length;
    $("statusSummary").textContent = count ? ("已选 " + count + " 个状态") : "全部状态";
  }

  function renderStatusOptions() {
    var container = $("statusOptions");
    if (!container) return;
    container.innerHTML = STATUS_GROUPS.map(function (group) {
      var items = group.items.map(function (item) {
        var checked = selectedStatuses[item[0]] ? " checked" : "";
        return '<label><input type="checkbox" data-status-key="' + esc(item[0]) + '"' + checked + '> <span>' + esc(item[1]) + '</span></label>';
      }).join("");
      return '<div class="multi-group">' + esc(group.label) + '</div>' + items;
    }).join("");
    updateStatusSummary();
  }

  function updateSelectAll(rows) {
    var eligible = selectableRows(rows);
    var picked = selectedShipRows(rows, selectedOrders);
    var box = $("selectAll");
    if (!box) return;
    box.disabled = !eligible.length;
    box.checked = Boolean(eligible.length) && picked.length === eligible.length;
    box.indeterminate = picked.length > 0 && picked.length < eligible.length;
    updateShipSelectedButton();
  }

  function updateShipSelectedButton() {
    var button = $("shipSelectedBtn");
    if (!button) return;
    var picked = selectedShipRows(allOrders, selectedOrders);
    button.disabled = !picked.length;
    button.textContent = picked.length ? ("批量无需物流发货（" + picked.length + "）") : "批量无需物流发货";
  }

  function filteredRows() {
    var filters = {
      statuses: selectedStatuses,
      item: $("itemFilter").value,
      keyword: $("keyword").value.trim(),
      accounts: selectedAccounts
    };
    return allOrders.filter(function (row) { return orderMatchesFilters(row, filters); });
  }

  function render() {
    var rows = filteredRows();
    if (!rows.length) {
      $("rows").innerHTML = '<tr><td colspan="11" class="muted">没有匹配的订单</td></tr>';
      updateSelectAll(rows);
      return;
    }
    $("rows").innerHTML = rows.map(function (row) {
      var notes = [];
      if (row.seller_note) notes.push("商家：" + row.seller_note);
      if (row.buyer_note) notes.push("买家：" + row.buyer_note);
      var raw = row.receiver_name && row.receiver_name !== row.display_name ? '<div class="raw">收货人：' + esc(row.receiver_name) + '</div>' : "";
      var account = (row.buyer_id || row.buyer_phone_masked) ? '<div class="raw">下单账号：' + esc(accountLabel(row)) + '</div>' : "";
      var ship = row.shipped
        ? '<span class="pill shipped">已发货</span><div class="raw">' + esc(row.shipped_at || "") + '</div>'
        : (row.status_kind === "awaiting_shipment" ? '<span class="pill awaiting">待发货</span>' : '<span class="muted">-</span>');
      var shipBtn = (!row.shipped && row.status_kind === "awaiting_shipment")
        ? '<button class="btn mini" data-ship="' + esc(row.order_id) + '" data-item="' + esc(row.item_id) + '">发货</button>' : "";
      var selectable = isSelectable(row);
      var checkbox = selectable
        ? '<input type="checkbox" data-select="' + esc(row.order_id) + '"' + (selectedOrders[row.order_id] ? " checked" : "") + ' aria-label="选择订单 ' + esc(row.order_id) + '">'
        : "";
      return '<tr>' +
        '<td>' + checkbox + '</td>' +
        '<td class="muted">' + esc(row.add_time || "") + '</td>' +
        '<td class="raw">' + esc(row.order_id || "") + '</td>' +
        '<td>' + esc(row.item_name || "") + (row.sku_title ? '<div class="raw">' + esc(row.sku_title) + '</div>' : "") + '</td>' +
        '<td>' + statusPill(row) + '</td>' +
        '<td><div class="name">' + esc(row.display_name || "") + '</div>' + raw + account + '</td>' +
        '<td class="muted">' + (notes.length ? esc(notes.join(" / ")) : "-") + '</td>' +
        '<td>' + moneyText(row) + '<div class="raw">¥' + Number(row.amount || 0).toFixed(2) + '</div></td>' +
        '<td>' + ship + '</td>' +
        '<td>' + broadcastText(row) + '</td>' +
        '<td><div class="actions">' +
          '<button class="btn mini" data-name="' + esc(row.order_id) + '" data-current="' + esc(row.display_name || "") + '">改名</button>' +
          '<button class="btn mini" data-rebroadcast="' + esc(row.order_id) + '" data-current="' + esc(row.display_name || "") + '">重播</button>' +
          shipBtn +
        '</div></td>' +
      '</tr>';
    }).join("");
    updateSelectAll(rows);
  }

  async function waitJob(jobId) {
    for (var i = 0; i < 60; i++) {
      await new Promise(function (resolve) { setTimeout(resolve, 2000); });
      var result = await api("/api/weidian-orders/jobs/" + encodeURIComponent(jobId));
      if (result.status === "done") return result;
      if (result.status === "error") throw new Error(result.error || "任务失败");
      setStatus("任务处理中… (" + (i + 1) + "/60)");
    }
    throw new Error("任务超时，请到后台查看 worker 状态");
  }

  async function submitJob(payload, label) {
    setStatus(label + "…");
    var job = await api("/api/weidian-orders/jobs", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload)
    });
    var result = await waitJob(job.job_id);
    setStatus("");
    return result;
  }

  async function refreshOrders() {
    var btn = $("refreshBtn");
    btn.disabled = true;
    try {
      await submitJob({type: "refresh"}, "刷新微店订单");
      await loadData();
      toast("订单已刷新");
    } catch (error) {
      toast(error.message || "刷新失败", true);
    } finally {
      btn.disabled = false;
    }
  }

  async function renameOrder(orderId, current) {
    var name = window.prompt("新的播报昵称（写入本地覆盖，不自动播报）", current || "");
    if (name == null) return;
    name = name.trim();
    if (!name) { toast("昵称不能为空", true); return; }
    try {
      var result = await api("/api/weidian-orders/name", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({order_id: orderId, name: name})
      });
      if (result.remote_synced === false) toast("本机已改，但对端同步失败：" + (result.remote_error || ""), true);
      else toast("昵称已保存；需要播报请点「重播」");
      await loadData();
    } catch (error) {
      toast(error.message || "改名失败", true);
    }
  }

  async function rebroadcastOrder(orderId, current) {
    var name = window.prompt("本次重播使用的昵称", current || "");
    if (name == null) return;
    name = name.trim();
    if (!name) { toast("昵称不能为空", true); return; }
    var includeTest = $("includeTest").checked;
    var marker = $("marker").checked ? "（更正播报）" : "";
    var target = "QQ 生产群" + (includeTest ? " + test 群" : "") + " + 飞书";
    if (!window.confirm("确认重新播报？\n昵称：" + name + "\n目标：" + target)) return;
    try {
      await submitJob({
        type: "rebroadcast", order_id: orderId, name: name,
        include_test: includeTest, channels: ["qq", "feishu"], marker: marker
      }, "重新播报");
      await loadData();
      toast("重播完成");
    } catch (error) {
      toast(error.message || "重播失败", true);
    }
  }

  async function shipRows(rows, single) {
    var selectedRows = selectableRows(rows);
    if (!selectedRows.length) {
      toast("请先选择待发货订单", true);
      return;
    }
    var total = selectedRows.reduce(function (sum, row) { return sum + Number(row.amount || 0); }, 0);
    var question = single
      ? "确认将该订单标记为无需物流发货？"
      : ("确认将选中的 " + selectedRows.length + " 笔订单标记为无需物流发货？\n合计 ¥" + total.toFixed(2));
    if (!window.confirm(question)) return;
    var button = $("shipSelectedBtn");
    if (button) button.disabled = true;
    try {
      var result = await submitJob({
        type: "ship",
        orders: selectedRows.map(function (row) {
          return {order_id: row.order_id, item_id: row.item_id};
        })
      }, single ? "发货" : "批量发货");
      var shipped = result.shipped || [];
      var errors = result.errors || [];
      var fresh = shipped.filter(function (item) { return item.ok && !item.already; }).length;
      var already = shipped.filter(function (item) { return item.already; }).length;
      selectedRows.forEach(function (row) { delete selectedOrders[row.order_id]; });
      if (errors.length) {
        toast("发货完成 " + (fresh + already) + " 笔，失败 " + errors.length + " 笔：" + (errors[0].error || "未知错误"), true);
      } else if (single) {
        toast(already ? "该订单已发货" : "发货成功");
      } else {
        toast("发货完成：" + (fresh + already) + " 笔" + (already ? "（其中 " + already + " 笔已发货）" : ""));
      }
      // 发货任务完成后立即重读订单库；worker 会在发货后刷新 canonical store。
      await loadData();
    } catch (error) {
      toast(error.message || "发货失败", true);
    } finally {
      updateShipSelectedButton();
    }
  }

  async function shipOrder(orderId, itemId) {
    var row = allOrders.filter(function (item) { return item.order_id === orderId; })[0];
    if (!row) row = {order_id: orderId, item_id: itemId, status_kind: "awaiting_shipment", shipped: false, amount: 0};
    await shipRows([row], true);
  }

  async function shipSelectedOrders() {
    await shipRows(selectedShipRows(allOrders, selectedOrders), false);
  }

  document.addEventListener("click", function (event) {
    var target = event.target;
    if (!target || !target.dataset) return;
    if (target.dataset.name) renameOrder(target.dataset.name, target.dataset.current);
    else if (target.dataset.rebroadcast) rebroadcastOrder(target.dataset.rebroadcast, target.dataset.current);
    else if (target.dataset.ship) shipOrder(target.dataset.ship, target.dataset.item);
  });
  $("shipSelectedBtn").addEventListener("click", shipSelectedOrders);
  $("selectAll").addEventListener("change", function (event) {
    var rows = selectableRows(filteredRows());
    rows.forEach(function (row) {
      if (event.target.checked) selectedOrders[row.order_id] = true;
      else delete selectedOrders[row.order_id];
    });
    render();
  });
  $("rows").addEventListener("change", function (event) {
    var target = event.target;
    if (!target || !target.dataset || !target.dataset.select) return;
    if (target.checked) selectedOrders[target.dataset.select] = true;
    else delete selectedOrders[target.dataset.select];
    updateSelectAll(filteredRows());
    updateShipSelectedButton();
  });
  $("refreshBtn").addEventListener("click", refreshOrders);
  $("itemFilter").addEventListener("change", render);
  $("statusOptions").addEventListener("change", function (event) {
    var target = event.target;
    if (!target || !target.dataset || !target.dataset.statusKey) return;
    if (target.checked) selectedStatuses[target.dataset.statusKey] = true;
    else delete selectedStatuses[target.dataset.statusKey];
    updateStatusSummary();
    render();
  });
  $("statusAll").addEventListener("click", function (event) {
    event.preventDefault();
    STATUS_GROUPS.forEach(function (group) {
      group.items.forEach(function (item) { selectedStatuses[item[0]] = true; });
    });
    renderStatusOptions();
    render();
  });
  $("statusClear").addEventListener("click", function (event) {
    event.preventDefault();
    selectedStatuses = {};
    renderStatusOptions();
    render();
  });
  $("accountOptions").addEventListener("change", function (event) {
    var target = event.target;
    if (!target || !target.dataset || !target.dataset.accountKey) return;
    if (target.checked) selectedAccounts[target.dataset.accountKey] = true;
    else delete selectedAccounts[target.dataset.accountKey];
    updateAccountSummary();
    render();
  });
  $("accountAll").addEventListener("click", function (event) {
    event.preventDefault();
    allOrders.forEach(function (row) { selectedAccounts[accountKey(row)] = true; });
    renderAccounts();
    render();
  });
  $("accountClear").addEventListener("click", function (event) {
    event.preventDefault();
    selectedAccounts = {};
    renderAccounts();
    render();
  });
  document.addEventListener("click", function (event) {
    ["accountMenu", "statusMenu"].forEach(function (id) {
      var menu = $(id);
      if (menu && menu.open && !menu.contains(event.target)) menu.open = false;
    });
  });
  $("keyword").addEventListener("input", render);
  $("loginBtn").addEventListener("click", doLogin);
  $("passwordInput").addEventListener("keydown", function (event) {
    if (event.key === "Enter") doLogin();
  });
  (async function boot() {
    renderStatusOptions();
    var ok = await loadData();
    if (ok) showApp();
    else showLogin("请输入管理密码");
  })();
  setInterval(function () {
    if (page.classList.contains("ready")) loadData();
  }, 60000);
})();
</script>
</body>
</html>
