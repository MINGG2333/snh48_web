<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site_title }} · 红蓝计分台账 2026</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0c1016; --panel: #151b24; --panel-2: #1b2430; --line: #2c394b;
      --text: #e8eef6; --muted: #95a4b6; --faint: #657386; --ink: #091017;
      --teal: #41b9aa; --gold: #f0b84b; --blue: #67a8ff; --pink: #e87da7;
      --green: #4dc27c; --red: #e36f6f;
    }
    body { min-height: 100vh; background: linear-gradient(180deg, rgba(65,185,170,.08), transparent 240px), var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; line-height: 1.45; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    #loginOverlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: var(--bg); padding: 24px; }
    .login-box { width: min(380px,100%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 28px; box-shadow: 0 18px 50px rgba(0,0,0,.3); }
    .login-box h1 { font-size: 20px; margin-bottom: 8px; }
    .login-box p { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
    .login-box input { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 8px; background: var(--ink); color: var(--text); padding: 0 12px; outline: none; }
    .login-box input:focus { border-color: var(--teal); }
    .login-btn { width: 100%; min-height: 44px; margin-top: 12px; border: 0; border-radius: 8px; background: var(--teal); color: var(--ink); font-weight: 760; }
    .login-btn:disabled { opacity: .7; cursor: wait; }
    .login-error { display: none; margin-top: 10px; color: var(--red); font-size: 13px; }
    .login-error.show { display: block; }
    .page { display: none; min-height: 100vh; }
    .page.ready { display: block; }
    .topbar { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
    .topbar-inner { width: min(1500px,100%); margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .title h1 { font-size: 21px; }
    .title p { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn { min-height: 34px; padding: 0 13px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); font-size: 13px; white-space: nowrap; }
    .btn:hover { border-color: var(--teal); color: var(--teal); }
    .btn.primary { background: var(--teal); border-color: var(--teal); color: var(--ink); font-weight: 760; }
    .btn.gold { border-color: rgba(240,184,75,.6); color: var(--gold); }
    .btn.pink { border-color: rgba(232,125,167,.6); color: var(--pink); }
    .btn.danger { border-color: rgba(227,111,111,.6); color: var(--red); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .wrap { width: min(1500px,100%); margin: 0 auto; padding: 20px 24px 48px; }
    .kpis { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 10px; margin-bottom: 14px; }
    .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; }
    .kpi .label { color: var(--muted); font-size: 12px; }
    .kpi .value { font-size: 25px; font-weight: 780; margin-top: 3px; }
    .kpi .value.teal { color: var(--teal); } .kpi .value.gold { color: var(--gold); } .kpi .value.pink { color: var(--pink); } .kpi .value.red { color: var(--red); } .kpi .value.blue { color: var(--blue); }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .toolbar .spacer { flex: 1; }
    .filters { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)) auto; gap: 8px; align-items: end; margin-top: 12px; }
    .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .field label { color: var(--faint); font-size: 12px; }
    .field input, .field select, .field textarea { width: 100%; min-height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--ink); color: var(--text); padding: 0 9px; outline: none; }
    .field textarea { min-height: 72px; padding: 8px 9px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--teal); }
    .check { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; min-height: 34px; }
    .check input { width: 15px; height: 15px; accent-color: var(--teal); }
    .analytics-grid { display: grid; grid-template-columns: minmax(0,.9fr) minmax(0,1.35fr); gap: 12px; margin-bottom: 14px; align-items: start; }
    .analytics-grid .panel { margin-bottom: 0; padding: 0; overflow: hidden; }
    .panel-head { min-height: 48px; padding: 13px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .panel-head h2 { font-size: 15px; font-weight: 740; }
    .panel-head .panel-count { color: var(--muted); font-size: 12px; }
    .panel-actions { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
    .bar-list { display: flex; flex-direction: column; gap: 10px; padding: 13px 14px 15px; }
    .bar-row { display: grid; grid-template-columns: minmax(0,1fr) minmax(88px,auto); gap: 10px; align-items: center; min-height: 36px; }
    .bar-label { min-width: 0; display: flex; align-items: center; gap: 9px; }
    .bar-name { min-width: 0; color: var(--text); font-size: 13px; font-weight: 680; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-meta { color: var(--faint); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { height: 7px; margin-top: 7px; border-radius: 999px; overflow: hidden; background: rgba(255,255,255,.06); }
    .bar-fill { width: var(--bar-width,0%); height: 100%; border-radius: inherit; background: var(--teal); }
    .bar-row.card .bar-fill { background: var(--blue); }
    .bar-row.leg .bar-fill { background: var(--pink); }
    .bar-row.warn .bar-name { color: var(--red); }
    .bar-value { color: var(--text); font-size: 13px; font-weight: 740; text-align: right; white-space: nowrap; }
    .split-score { color: var(--faint); font-size: 12px; margin-top: 2px; }
    .trend-block { border-top: 1px solid var(--line); padding: 13px 14px 15px; }
    .trend-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .trend-title { color: var(--text); font-size: 13px; font-weight: 740; }
    .trend-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .trend-canvas-wrap { position: relative; width: 100%; height: 300px; }
    .trend-canvas-wrap canvas { display: block; width: 100%; height: 100%; }
    .modal-card.daily-modal-card { width: min(1120px,100%); }
    .daily-modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .daily-toggle { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .daily-toggle .btn.active { border-color: var(--teal); color: var(--teal); background: rgba(65,185,170,.1); }
    .daily-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(300px,1fr)); gap: 12px; margin-top: 14px; }
    .daily-card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
    .daily-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .daily-card-title { color: var(--text); font-size: 13px; font-weight: 740; }
    .daily-card-total { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .daily-card-canvas { height: 190px; }
    .daily-card-canvas canvas { display: block; width: 100%; height: 100%; }
    .daily-combined { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 14px; }
    .daily-combined .trend-canvas-wrap { height: 320px; }
    @media (max-width: 620px) { .daily-card-canvas { height: 220px; } .daily-combined .trend-canvas-wrap { height: 280px; } }
    .distribution-more { display: none; width: calc(100% - 28px); min-height: 42px; margin: -3px 14px 14px; border: 1px solid rgba(65,185,170,.34); border-radius: 8px; background: linear-gradient(90deg, rgba(65,185,170,.12), rgba(240,184,75,.08)); color: var(--text); padding: 0 12px; align-items: center; justify-content: space-between; gap: 12px; position: relative; overflow: hidden; text-align: left; }
    .distribution-more.show { display: flex; }
    .distribution-more::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, var(--teal), var(--gold), var(--pink)); opacity: .9; }
    .distribution-more:hover, .distribution-more:focus-visible { border-color: var(--gold); outline: none; }
    .distribution-more-text { font-size: 13px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .distribution-more-action { color: var(--gold); font-size: 12px; font-weight: 760; white-space: nowrap; }
    .table-wrap { overflow-x: auto; margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; min-width: 1280px; }
    th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13px; }
    th { color: var(--faint); font-weight: 600; font-size: 12px; white-space: nowrap; }
    tr.row:hover { background: rgba(65,185,170,.04); }
    tr.warn td { background: rgba(227,111,111,.06); }
    .pill { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 11px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
    .pill.manual { color: var(--gold); border-color: rgba(240,184,75,.4); }
    .pill.weidian { color: var(--pink); border-color: rgba(232,125,167,.4); }
    .pill.room { color: var(--blue); border-color: rgba(103,168,255,.4); }
    .pill.live { color: var(--teal); border-color: rgba(65,185,170,.4); }
    .pill.card { color: var(--blue); border-color: rgba(103,168,255,.4); background: rgba(103,168,255,.08); }
    .pill.leg { color: var(--pink); border-color: rgba(232,125,167,.4); background: rgba(232,125,167,.08); }
    .pill.ok { color: var(--green); border-color: rgba(77,194,124,.4); }
    .pill.wait { color: var(--gold); border-color: rgba(240,184,75,.4); }
    .pill.bad { color: var(--red); border-color: rgba(227,111,111,.4); }
    .pill.dup { color: var(--faint); }
    .warn-icon { display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; border-radius: 50%; background: var(--red); color: #fff; font-size: 11px; font-weight: 800; margin-left: 4px; vertical-align: 1px; }
    .actions { display: flex; gap: 5px; flex-wrap: wrap; }
    .mini { min-height: 28px; padding: 0 8px; font-size: 12px; border-radius: 6px; }
    .business-btn { border-color: rgba(232,125,167,.45); color: var(--pink); }
    .business-btn.done { border-color: rgba(77,194,124,.55); color: var(--green); }
    .business-select { width: 100%; min-width: 160px; min-height: 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--ink); color: var(--text); padding: 0 6px; outline: none; font-size: 12px; }
    .business-select:focus { border-color: var(--teal); }
    .business-pair { display: flex; flex-direction: column; gap: 4px; }
    .business-pair .business-sublabel { color: var(--faint); font-size: 11px; line-height: 1; }
    .business-pair .business-select { min-width: 150px; }
    .empty { color: var(--faint); text-align: center; padding: 30px 10px; }
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 60; max-width: 360px; background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--teal); border-radius: 8px; padding: 12px 14px; color: var(--text); font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.35); display: none; }
    .toast.show { display: block; }
    .toast.error { border-left-color: var(--red); }
    .modal { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 18px; }
    .modal.hidden { display: none; }
    .modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.62); }
    .modal-card { position: relative; width: min(620px,100%); max-height: 90vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; box-shadow: 0 24px 80px rgba(0,0,0,.45); }
    .modal-card.wide { width: min(980px,100%); }
    .modal-card h2 { font-size: 19px; margin-bottom: 4px; }
    .modal-card .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-grid .full { grid-column: 1 / -1; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .suggest-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .suggest { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .suggest .raw { color: var(--muted); font-size: 12px; }
    .suggest .match { font-weight: 700; }
    .suggest .reason { color: var(--faint); font-size: 12px; margin-top: 2px; }
    .ai-panel { margin-top: 12px; }
    .notice { color: var(--muted); font-size: 12px; line-height: 1.6; }
    @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3,minmax(0,1fr)); } .filters { grid-template-columns: repeat(2,minmax(0,1fr)); } .analytics-grid { grid-template-columns: 1fr; } }
    @media (max-width: 620px) { .kpis { grid-template-columns: repeat(2,minmax(0,1fr)); } .filters { grid-template-columns: 1fr; } .form-grid { grid-template-columns: 1fr; } .trend-canvas-wrap { height: 260px; } }
  </style>
</head>
<body>
<div id="loginOverlay">
  <div class="login-box">
    <h1>红蓝计分台账 2026</h1>
    <p>请输入管理密码</p>
    <input id="passwordInput" type="password" autocomplete="new-password" placeholder="密码">
    <button class="login-btn" id="loginBtn">进入</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div class="page" id="page">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="title">
        <h1>红蓝计分台账 2026</h1>
        <p id="metaLine">自动同步：房间/直播 60s · 微店 5min · 按时间正序</p>
      </div>
      <div class="topbar-actions">
        <button class="btn" id="refreshBtn">刷新</button>
        <button class="btn" id="exportEntriesBtn">导出按条目</button>
        <button class="btn" id="logoutBtn">退出</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="kpis" id="kpis"></section>

    <section class="panel">
      <div class="toolbar">
        <button class="btn primary" id="addManualBtn">＋ 新增暗票</button>
        <button class="btn" id="syncRoomLiveBtn">立即同步房间/直播</button>
        <button class="btn pink" id="syncWeidianBtn">立即同步微店</button>
        <button class="btn gold" id="aiResolveBtn">AI 识别未登记</button>
        <button class="btn" id="applySelectedAiBtn">应用选中 AI 建议</button>
        <button class="btn pink" id="shipSelectedBtn">批量无需物流发货</button>
        <button class="btn" id="duplicateSelectedBtn">标记重复</button>
        <div class="spacer"></div>
        <span class="notice" id="actionStatus"></span>
      </div>
      <div class="filters">
        <div class="field"><label>来源</label><select id="sourceFilter"><option value="all">全部</option><option value="manual">暗票</option><option value="weidian">微店</option><option value="room">房间</option><option value="live">直播</option></select></div>
        <div class="field"><label>状态</label><select id="statusFilter"><option value="all">全部</option><option value="normal">正常</option><option value="pending">待投</option><option value="settled">已投</option><option value="warning">未登记</option><option value="duplicate">重复</option></select></div>
        <div class="field"><label>关键词</label><input id="keywordInput" placeholder="昵称 / ID / 备注"></div>
        <div class="field"><label>开始日期</label><input id="dateFrom" type="date"></div>
        <div class="field"><label>结束日期</label><input id="dateTo" type="date"></div>
        <div class="field"><label>排序</label><select id="sortFilter"><option value="time_asc">时间正序</option><option value="time_desc">时间倒序</option></select></div>
        <div class="field"><label>&nbsp;</label><label class="check"><input id="includeDuplicate" type="checkbox" checked> 显示重复</label></div>
      </div>
    </section>

    <section class="analytics-grid" aria-label="计分汇总">
      <section class="panel">
        <div class="panel-head">
          <h2>计分来源汇总</h2>
          <div class="panel-actions">
            <span class="panel-count" id="scoringSummaryCount">6 类</span>
            <button class="btn mini" id="openDailyModalBtn" type="button">查看每日走势</button>
          </div>
        </div>
        <div class="bar-list" id="scoringSummary"></div>
        <div class="trend-block">
          <div class="trend-head">
            <div>
              <div class="trend-title">每日计分走势</div>
              <div class="trend-sub" id="dailyTrendMeta">全部时间 · 按天堆叠</div>
            </div>
            <button class="btn mini" id="exportDailyBtn" type="button">下载 PNG</button>
          </div>
          <div class="trend-canvas-wrap"><canvas id="dailyTrendChart" role="img" aria-label="每日计分来源走势图"></canvas></div>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head">
          <h2>按昵称汇总</h2>
          <div class="panel-actions">
            <span class="panel-count" id="fanSummaryCount">0 人</span>
            <button class="btn mini" id="exportSummaryBtn" type="button">导出按昵称汇总</button>
            <button class="btn mini" id="openFanModalBtn" type="button" style="display:none;">全部</button>
          </div>
        </div>
        <div class="bar-list" id="fanSummary"></div>
        <button class="distribution-more" id="fanMoreBar" type="button" aria-haspopup="dialog" aria-controls="fanModal" aria-hidden="true">
          <span class="distribution-more-text" id="fanMoreText"></span>
          <span class="distribution-more-action">查看全部</span>
        </button>
      </section>
    </section>

    <section class="panel">
      <div class="toolbar"><strong style="font-size:15px;">条目</strong><span class="notice" id="entryHint"></span><div class="spacer"></div><label class="check"><input type="checkbox" id="selectAll"> 全选当前列表</label></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th style="width:34px;"></th><th>时间</th><th>当前昵称 / 口袋ID</th><th>来源</th><th>计分方式</th><th>分数</th><th>状态</th><th>业务</th><th>选定的业务</th><th>备注</th><th>操作</th></tr></thead>
          <tbody id="entryBody"></tbody>
        </table>
      </div>
      <div class="empty hidden" id="emptyState">当前筛选条件下没有条目</div>
    </section>

    <section class="panel hidden" id="aiPanel">
      <div class="toolbar"><strong style="font-size:15px;">AI 建议</strong><span class="notice" id="aiHint"></span><div class="spacer"></div><button class="btn" id="viewPromptBtn">查看 AI Prompt</button><button class="btn" id="closeAiPanelBtn">收起</button></div>
      <div class="suggest-list" id="aiSuggestList"></div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>

<div class="modal hidden" id="entryModal">
  <div class="modal-backdrop" data-close="entryModal"></div>
  <div class="modal-card">
    <h2 id="entryModalTitle">新增暗票</h2>
    <div class="sub" id="entryModalSub">暗票按登记时间计入，计分方式为计分卡；房间/直播/微店条目时间来自原始记录。</div>
    <div class="form-grid">
      <div class="field"><label>口袋48昵称</label><input id="entryName" placeholder="粉丝昵称"></div>
      <div class="field"><label>口袋48 ID</label><input id="entryId" placeholder="可选；填了会优先校验"></div>
      <div class="field"><label>分数</label><input id="entryScore" type="number" min="0.01" step="0.01" placeholder="1"></div>
      <div class="field"><label>状态</label><label class="check"><input id="entrySettled" type="checkbox" checked> 已投（计入已投合计）</label></div>
      <div class="field full"><label>选定的业务</label><select id="entryBusinessSelected"></select></div>
      <div class="field full hidden" id="entryBusinessBonusField"><label>鸡腿加赠业务</label><select id="entryBusinessBonus"></select></div>
      <div class="field full"><label>备注</label><textarea id="entryNote" placeholder="可选"></textarea></div>
      <div class="field full"><label class="check"><input id="entryBusinessDone" type="checkbox"> 业务已完成</label></div>
      <div class="field full"><label class="check"><input id="entryDuplicate" type="checkbox"> 标记为重复 / 不计入合计</label></div>
    </div>
    <div class="modal-actions">
      <button class="btn" data-close="entryModal">取消</button>
      <button class="btn primary" id="saveEntryBtn">保存</button>
    </div>
  </div>
</div>

<div class="modal hidden" id="fanModal">
  <div class="modal-backdrop" data-close="fanModal"></div>
  <div class="modal-card wide">
    <h2>按昵称汇总 · 全部</h2>

          <button class="btn mini" id="dailyViewCategoryBtn" type="button">按计分来源（6）</button>

        <button class="btn" type="button" data-close="dailyModal">关闭</button>

    <div class="daily-grid" id="dailyModalGrid"></div>

          <div class="trend-title" id="dailyCombinedTitle">合成走势</div>

  <div class="modal-card wide">
    <h2>AI Prompt</h2>

    <pre id="promptText" style="white-space:pre-wrap;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12px;line-height:1.6;max-height:65vh;overflow:auto;"></pre>

    <div class="sub" id="confirmText"></div>
    <div class="modal-actions">
      <button class="btn" data-close="confirmModal">取消</button>
      <button class="btn danger" id="confirmOkBtn">确认</button>

<script>
(function () {
  "use strict";
  var LEGACY_PASSWORD_KEY = "redblue_ledger_password_2026";
  var data = null;
  var selected = new Set();
  var editingId = "";
  var aiJobId = "";
  var aiSuggestions = {};
  var fanSummaryItems = [];
  var businessOptions = [];
  var pollTimer = null;
  var confirmAction = null;

  var $ = function (id) { return document.getElementById(id); };
  var loginOverlay = $("loginOverlay"), page = $("page"), loginError = $("loginError");

  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function score(value) {
    var n = Number(value || 0);
    return Math.abs(n - Math.round(n)) < 0.0001 ? String(Math.round(n)) : n.toFixed(2).replace(/0+$/,"").replace(/\.$/,"");
  }
  function showToast(message, isError) {
    var el = $("toast");
    el.textContent = message || "";
    el.classList.toggle("error", Boolean(isError));
    el.classList.add("show");
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(function () { el.classList.remove("show"); }, 4200);
  }
  function setStatus(message) { $("actionStatus").textContent = message || ""; }

  function showLogin(message) {
    page.classList.remove("ready");
    loginOverlay.classList.remove("hidden");
    $("passwordInput").value = "";
    if (message) {
      loginError.textContent = message;
      loginError.classList.add("show");
    }
    $("passwordInput").focus();
  }

  function showApp() {
    loginOverlay.classList.add("hidden");
    page.classList.add("ready");
  }

  async function api(path, options) {
    options = options || {};
    options.credentials = "same-origin";
    options.cache = "no-store";
    var response = await fetch(path, options);
    if (response.status === 401 || response.status === 403) {
      showLogin("登录已失效，请重新输入密码");
      throw new Error("登录已失效，请重新输入密码");
    }
    if (!response.ok) {
      var body = await response.json().catch(function () { return {}; });
      throw new Error(body.detail || ("HTTP " + response.status));
    }
    return response.json();
  }

  function filterQuery() {
    var params = new URLSearchParams();
    params.set("source", $("sourceFilter").value);
    params.set("status", $("statusFilter").value);
    params.set("keyword", $("keywordInput").value.trim());
    params.set("date_from", $("dateFrom").value);
    params.set("date_to", $("dateTo").value);
    params.set("sort", $("sortFilter").value);
    params.set("include_duplicate", $("includeDuplicate").checked ? "true" : "false");
    return params.toString();
  }

  async function loadData(silent) {
    if (!silent) setStatus("加载中…");
    try {
      data = await api("/api/redblue/data?" + filterQuery());
      selected.clear();
      renderAll();
      setStatus("");
    } catch (error) {
      if (!silent) showToast(error.message || "加载失败", true);
      throw error;
    }
  }

  function renderAll() {
    if (!data) return;
    businessOptions = data.business_options || [];
    renderKpis();
    renderScoringSummary();
    renderFanSummary();
    renderEntries();
    $("metaLine").textContent = "更新 " + (data.generated_at || "-") + " · 6 类计分来源（房间/直播 × 计分卡/鸡腿、应援会/暗票） · 按时间正序";
    if (!$("dailyModal").classList.contains("hidden")) renderDailyModal();
  }

  function renderKpis() {
    var s = data.summary || {};
    var cards = [
      ["总计分", score(s.total_score), "teal"],
      ["人数", s.people_count || 0, "blue"],
      ["条目", s.entry_count || 0, ""],
      ["已投", score(s.settled_score), "teal"],
      ["待投", score(s.pending_score), "pink"],
      ["未登记", s.warning_count || 0, "red"]
    ];
    $("kpis").innerHTML = cards.map(function (item) {
      return '<div class="kpi"><div class="label">' + esc(item[0]) + '</div><div class="value ' + item[2] + '">' + esc(item[1]) + '</div></div>';
    }).join("");
  }

  function sourceScoringLabel(key) {
    var base = {manual:"暗票",weidian:"应援会",room:"房间",live:"直播"}[key] || key;
    var method = {manual:"计分卡",weidian:"鸡腿",room:"计分卡",live:"计分卡"}[key] || "";
    return method ? base + "·" + method : base;
  }

  var SCORING_CATEGORIES = [
    {source:"room", method:"计分卡", label:"房间·计分卡", cls:"card"},
    {source:"room", method:"鸡腿", label:"房间·鸡腿", cls:"leg"},
    {source:"live", method:"计分卡", label:"直播·计分卡", cls:"card"},
    {source:"live", method:"鸡腿", label:"直播·鸡腿", cls:"leg"},
    {source:"weidian", method:"鸡腿", label:"应援会·鸡腿", cls:"leg"},
    {source:"manual", method:"计分卡", label:"暗票·计分卡", cls:"card"}
  ];
  var DAILY_TREND_COLORS = {
    "room|计分卡": "#67a8ff",
    "room|鸡腿": "#e87da7",
    "live|计分卡": "#41b9aa",
    "live|鸡腿": "#f0b84b",
    "weidian|鸡腿": "#8b6cc9",
    "manual|计分卡": "#e36f6f"
  };
  var DAILY_SOURCE_DEFS = [
    {key:"room", label:"房间", color:"#67a8ff", parts:["room|计分卡", "room|鸡腿"]},
    {key:"live", label:"直播", color:"#41b9aa", parts:["live|计分卡", "live|鸡腿"]},
    {key:"weidian", label:"应援会", color:"#8b6cc9", parts:["weidian|鸡腿"]},
    {key:"manual", label:"暗票", color:"#e36f6f", parts:["manual|计分卡"]}
  ];
  var dailyModalView = "source";
  var dailyModalSpecs = [];
  var dailyTrendResizeTimer = null;

  function renderScoringSummary() {
    var buckets = {};
    SCORING_CATEGORIES.forEach(function (item) {
      buckets[item.source + "|" + item.method] = {count:0, score:0, settled:0, pending:0};
    });
    (data.entries || []).forEach(function (entry) {
      if (entry.duplicate) return;
      var bucket = buckets[entry.source + "|" + entry.scoring_method];
      if (!bucket) return;
      var value = Number(entry.score || 0);
      bucket.count += 1;
      bucket.score += value;
      if (entry.settled) bucket.settled += value;
      else bucket.pending += value;
    });
    var items = SCORING_CATEGORIES.map(function (item) {
      var bucket = buckets[item.source + "|" + item.method];
      return {label:item.label, cls:item.cls, count:bucket.count, total_score:bucket.score, settled:bucket.settled, pending:bucket.pending};
    });
    $("scoringSummaryCount").textContent = items.length + " 类";
    renderBarList($("scoringSummary"), items, {
      maxValue: maxValueOf(items, function (item) { return item.total_score; }),
      rowClass: function (item) { return item.cls; },
      label: function (item) { return item.label; },
      meta: function (item) { return item.count + " 条"; },
      value: function (item) { return item.total_score; },
      split: function (item) { return "已投 " + score(item.settled) + " · 待投 " + score(item.pending); }
    });
    renderDailyTrend();
  }

  function dailyTrendData() {
    return data && data.daily_scoring ? data.daily_scoring : null;
  }

  function dailyTrendFont(size, weight) {
    return (weight || 500) + " " + size + "px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif";
  }

  function dailyTrendAxis(maxValue) {
    if (!(maxValue > 0)) return {max: 10, step: 5};
    var rough = maxValue / 5;
    var power = Math.pow(10, Math.floor(Math.log(rough) / Math.LN10));
    var norm = rough / power;
    var step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * power;
    return {max: Math.ceil(maxValue / step) * step, step: step};
  }

  function drawDailyTrendLegend(ctx, categories, width, left, right, top) {
    var x = left;
    var y = top;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.font = dailyTrendFont(11, 500);
    categories.forEach(function (cat) {
      var label = cat.label || (cat.source + "·" + cat.method);
      var itemWidth = 15 + ctx.measureText(label).width + 12;
      if (x > left && x + itemWidth > right) { x = left; y += 20; }
      ctx.fillStyle = DAILY_TREND_COLORS[cat.key] || "#67a8ff";
      ctx.fillRect(x, y - 4, 10, 8);
      ctx.fillStyle = "#95a4b6";
      ctx.fillText(label, x + 15, y);
      x += itemWidth;
    });
    return y + 12;
  }

  function drawDailyTrend(canvas, width, height, dpr, options) {
    options = options || {};
    width = Math.max(240, Math.round(width));
    height = Math.max(220, Math.round(height));
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    var ctx = canvas.getContext("2d");
    if (!ctx) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = "#151b24";
    ctx.fillRect(0, 0, width, height);

    var daily = dailyTrendData();
    var pad = options.header ? 24 : 14;
    var left = pad + (options.header ? 40 : 34);
    var right = width - pad;
    var y = pad;

    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    if (options.header) {
      ctx.fillStyle = "#e8eef6";
      ctx.font = dailyTrendFont(23, 700);
      ctx.fillText("红蓝计分 · 每日计分来源", left, y + 8);
      ctx.fillStyle = "#95a4b6";
      ctx.font = dailyTrendFont(13, 400);
      var subtitle = daily && daily.start
        ? daily.start + " 至 " + daily.end + " · 共 " + daily.days.length + " 天 · 总计 " + score(daily.total_score) + " 分"
        : "全部时间 · 按天堆叠";
      ctx.fillText(subtitle, left, y + 34);
      y += 54;
    }

    var categories = (daily && daily.categories && daily.categories.length)
      ? daily.categories
      : SCORING_CATEGORIES.map(function (item) { return {key: item.source + "|" + item.method, label: item.label}; });
    var legendBottom = drawDailyTrendLegend(ctx, categories, width, left, right, y);
    var plotTop = legendBottom + 10;
    var plotBottom = height - (options.header ? 44 : 30);
    var days = (daily && daily.days) || [];
    if (!days.length) {
      ctx.fillStyle = "#95a4b6";
      ctx.font = dailyTrendFont(13, 400);
      ctx.textAlign = "center";
      ctx.fillText("暂无计分数据", width / 2, (plotTop + plotBottom) / 2);
      return;
    }

    var maxTotal = days.reduce(function (max, day) { return Math.max(max, Number(day.total || 0)); }, 0);
    var axis = dailyTrendAxis(maxTotal);
    var tickCount = Math.round(axis.max / axis.step);
    var plotHeight = plotBottom - plotTop;
    ctx.font = dailyTrendFont(10, 400);
    for (var tick = 0; tick <= tickCount; tick += 1) {
      var value = tick * axis.step;
      var lineY = plotBottom - (value / axis.max) * plotHeight;
      ctx.strokeStyle = tick === 0 ? "rgba(255,255,255,.16)" : "rgba(255,255,255,.07)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(left, lineY + 0.5);
      ctx.lineTo(right, lineY + 0.5);
      ctx.stroke();
      ctx.fillStyle = "#657386";
      ctx.textAlign = "right";
      ctx.fillText(score(value), left - 7, lineY);
    }

    var slotWidth = (right - left) / days.length;
    var barWidth = Math.max(2, Math.min(28, slotWidth * 0.62));
    days.forEach(function (day, index) {
      var centerX = left + slotWidth * (index + 0.5);
      var x = centerX - barWidth / 2;
      var stackBottom = plotBottom;
      categories.forEach(function (cat) {
        var value = Number((day.scores || {})[cat.key] || 0);
        if (value <= 0) return;
        var barHeight = (value / axis.max) * plotHeight;
        stackBottom -= barHeight;
        ctx.fillStyle = DAILY_TREND_COLORS[cat.key] || "#67a8ff";
        ctx.fillRect(x, stackBottom, barWidth, barHeight);
      });
      if (Number(day.total || 0) > 0 && slotWidth >= 30) {
        var text = score(day.total);
        ctx.font = dailyTrendFont(10, 700);
        ctx.textAlign = "center";
        if (stackBottom - plotTop >= 13) {
          ctx.fillStyle = "#c8d3e0";
          ctx.fillText(text, centerX, stackBottom - 6);
        } else {
          ctx.fillStyle = "#0c1016";
          ctx.fillText(text, centerX, stackBottom + 6);
        }
      }
    });

    var labelStep = Math.max(1, Math.ceil(days.length / Math.max(2, Math.floor((right - left) / 40))));
    var labelOffset = (days.length - 1) % labelStep;
    ctx.font = dailyTrendFont(10, 400);
    ctx.fillStyle = "#657386";
    ctx.textAlign = "center";
    days.forEach(function (day, index) {
      if ((index - labelOffset) % labelStep !== 0) return;
      ctx.fillText(day.date.slice(5), left + slotWidth * (index + 0.5), plotBottom + 14);
    });
  }

  function renderDailyTrend() {
    var canvas = $("dailyTrendChart");
    if (!canvas) return;
    var daily = dailyTrendData();
    var meta = $("dailyTrendMeta");
    if (!daily || !daily.days || !daily.days.length) {
      meta.textContent = "全部时间 · 暂无数据";
    } else {
      meta.textContent = daily.start + " 至 " + daily.end + " · " + daily.days.length + " 天 · 总计 " + score(daily.total_score) + " 分";
    }
    var rect = canvas.parentElement.getBoundingClientRect();
    var width = Math.max(260, Math.round(rect.width));
    var height = Math.max(220, Math.round(rect.height));
    var dpr = Math.min(2.5, window.devicePixelRatio || 1);
    drawDailyTrend(canvas, width, height, dpr, {header: false});
  }

  function exportDailyTrend() {
    var daily = dailyTrendData();
    if (!daily || !daily.days || !daily.days.length) {
      showToast("暂无可导出的每日计分数据", true);
      return;
    }
    var button = $("exportDailyBtn");
    var originalText = button.textContent;
    button.disabled = true;
    button.textContent = "生成中…";
    try {
      var canvas = document.createElement("canvas");
      drawDailyTrend(canvas, 1200, 620, 2, {header: true});
      canvas.toBlob(function (blob) {
        button.disabled = false;
        button.textContent = originalText;
        if (!blob) { showToast("导出失败", true); return; }
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = url;
        link.download = "红蓝计分_每日计分来源_" + (daily.end || new Date().toISOString().slice(0, 10)) + ".png";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
        showToast("已保存 PNG");
      }, "image/png");
    } catch (error) {
      button.disabled = false;
      button.textContent = originalText;
      showToast("导出失败", true);
    }
  }

  function fanScoreParts(fan) {
    var scoring = fan.scoring || {};
    var parts = [];
    ["计分卡", "鸡腿"].forEach(function (method) {
      if (scoring[method] !== undefined) parts.push(method + " " + score(scoring[method]));
    });
    if (!parts.length) {
      var sources = fan.sources || {};
      Object.keys(sources).forEach(function (key) {
        parts.push(sourceScoringLabel(key) + " " + score(sources[key]));
      });
    }
    return parts;
  }

  function fanBarOptions(items) {
    return {
      maxValue: maxValueOf(items, function (item) { return item.total_score; }),
      rowClass: function (item) { return item.warning ? "warn" : ""; },
      warning: function (item) { return item.warning; },
      warningTitle: function () { return "暂未找到对应的口袋48账号昵称"; },
      label: function (item) { return item.fan_name || "未登记"; },
      meta: function (item) {
        var parts = [item.fan_id ? "ID " + item.fan_id : "按昵称兜底"];
        var scoreNames = (item.score_names || []).filter(function (value) {
          return value && value !== item.fan_name;
        });
        if (scoreNames.length) parts.push("计分昵称 " + scoreNames.slice(0, 2).join(" / "));
        parts.push("记录 " + (item.entry_count || 0));
        parts.push("已投 " + score(item.settled_score) + " · 待投 " + score(item.pending_score));
        return parts.join(" · ");
      },
      value: function (item) { return item.total_score; },
      split: function (item) { return fanScoreParts(item).join(" · "); }
    };
  }

  function renderFanSummary() {
    var fans = data.fan_summary || [];
    fanSummaryItems = fans;
    $("fanSummaryCount").textContent = fans.length + " 人";
    var hiddenCount = Math.max(0, fans.length - 10);
    $("openFanModalBtn").style.display = hiddenCount > 0 ? "inline-flex" : "none";
    $("fanMoreBar").classList.toggle("show", hiddenCount > 0);
    $("fanMoreBar").disabled = hiddenCount <= 0;
    $("fanMoreBar").setAttribute("aria-hidden", hiddenCount > 0 ? "false" : "true");
    $("fanMoreText").textContent = hiddenCount > 0 ? "还有 " + hiddenCount + " 人未显示，点击查看完整分布" : "";
    renderBarList($("fanSummary"), fans.slice(0, 10), fanBarOptions(fans));
    if (!$("fanModal").classList.contains("hidden")) renderFanModal();
  }

  function renderFanModal() {
    $("fanModalSub").textContent = "共 " + fanSummaryItems.length + " 人 · 按总分降序，同分按达成时间升序";
    renderBarList($("fanModalBars"), fanSummaryItems, fanBarOptions(fanSummaryItems));
  }

  function openFanModal() {
    renderFanModal();
    $("fanModal").classList.remove("hidden");
  }

  function maxValueOf(items, getter) {
    return items.reduce(function (max, item) {
      return Math.max(max, Number(getter(item) || 0));
    }, 0);
  }

  function percent(value, maxValue) {
    var max = Number(maxValue || 0);
    if (max <= 0) return 0;
    return Math.max(0, Math.min(100, Number(value || 0) / max * 100));
  }

  function renderBarList(parent, items, options) {
    parent.textContent = "";
    if (!items.length) {
      parent.innerHTML = '<div class="empty">暂无数据</div>';
      return;
    }
    items.forEach(function (item) {
      var row = document.createElement("div");
      row.className = "bar-row" + (options.rowClass ? " " + options.rowClass(item) : "");
      var label = document.createElement("div");
      label.className = "bar-label";
      var text = document.createElement("div");
      text.style.minWidth = "0";
      var name = document.createElement("div");
      name.className = "bar-name";
      name.textContent = options.label(item);
      if (options.warning && options.warning(item)) {
        var warn = document.createElement("span");
        warn.className = "warn-icon";
        warn.textContent = "!";
        warn.title = options.warningTitle ? options.warningTitle(item) : "";
        name.appendChild(warn);
      }
      var meta = document.createElement("div");
      meta.className = "bar-meta";
      meta.textContent = options.meta(item);
      var track = document.createElement("div");
      track.className = "bar-track";
      var fill = document.createElement("div");
      fill.className = "bar-fill";
      fill.style.setProperty("--bar-width", percent(options.value(item), options.maxValue) + "%");
      track.appendChild(fill);
      text.appendChild(name);
      text.appendChild(meta);
      text.appendChild(track);
      label.appendChild(text);
      row.appendChild(label);
      var value = document.createElement("div");
      value.className = "bar-value";
      value.textContent = score(options.value(item));
      var split = document.createElement("div");
      split.className = "split-score";
      split.textContent = options.split(item);
      value.appendChild(split);
      row.appendChild(value);
      parent.appendChild(row);
    });
  }

  function statusPills(entry) {
    var out = [];
    if (entry.duplicate) out.push('<span class="pill dup">重复</span>');
    else if (entry.settled) out.push('<span class="pill ok">已投</span>');
    else out.push('<span class="pill wait">待投</span>');
    return out.join(" ");
  }

  function businessOptionsMarkup(current, group) {
    var currentValue = current || "";
    var items = businessOptions.filter(function (option) { return !group || option.group === group; });
    var groups = {};
    var order = [];
    items.forEach(function (option) {
      var key = option.group || "other";
      if (!groups[key]) {
        groups[key] = {label: option.group_label || "业务", items: []};
        order.push(key);
      }
      groups[key].items.push(option);
    });
    var html = '<option value="">未选择</option>';
    order.forEach(function (key) {
      html += '<optgroup label="' + esc(groups[key].label) + '">';
      groups[key].items.forEach(function (option) {
        html += '<option value="' + esc(option.value) + '"' + (option.value === currentValue ? " selected" : "") + '>' + esc(option.label || option.value) + '</option>';
      });
      html += '</optgroup>';
    });
    var known = items.some(function (option) { return option.value === currentValue; });
    if (currentValue && !known) {
      html += '<option value="' + esc(currentValue) + '" selected>' + esc(currentValue) + '</option>';
    }
    return html;
  }

  function waitJob(kind, jobId, silent) {
    return new Promise(function (resolve, reject) {
      var started = Date.now();
      var timer = setInterval(async function () {
        if (Date.now() - started > 15 * 60 * 1000) {
          clearInterval(timer);
          if (!silent) { setStatus(""); showToast("任务超时，请查看 worker 状态", true); }
          reject(new Error("任务超时"));
          return;
        }
        try {
          var result = await api("/api/redblue/" + kind + "/jobs/" + encodeURIComponent(jobId));
          if (result.status === "done") {
            clearInterval(timer);
            if (!silent) setStatus("");
            resolve(result);
          } else if (result.status === "error") {
            clearInterval(timer);
            if (!silent) { setStatus(""); showToast(result.error || "任务失败", true); }
            reject(new Error(result.error || "任务失败"));
          } else if (!silent) {
            setStatus("任务处理中…");
          }
        } catch (error) {
          clearInterval(timer);
          if (!silent) { setStatus(""); showToast(error.message || "任务查询失败", true); }
          reject(error);
        }
      }, 2500);
    });
  }

  function dailyCategorySpecs() {

  function drawTrendLegend(ctx, series, width, left, right, top) {
    var x = left;
    var y = top;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.font = dailyTrendFont(11, 500);
    series.forEach(function (item) {
      var itemWidth = 15 + ctx.measureText(item.label).width + 12;
      if (x > left && x + itemWidth > right) { x = left; y += 20; }
      ctx.fillStyle = item.color || "#67a8ff";
      ctx.fillRect(x, y - 4, 10, 8);
      ctx.fillStyle = "#95a4b6";
      ctx.fillText(item.label, x + 15, y);
      x += itemWidth;
    });
    return y + 12;
  }

  function drawTrendChart(canvas, width, height, dpr, options) {
    options = options || {};
    width = Math.max(240, Math.round(width));
    height = Math.max(200, Math.round(height));
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    var ctx = canvas.getContext("2d");
    if (!ctx) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = "#151b24";
    ctx.fillRect(0, 0, width, height);

    var daily = dailyTrendData();
    var days = options.days || (daily && daily.days) || [];
    var series = options.series || [];
    var pad = options.header ? 24 : 14;
    var left = pad + (options.header ? 42 : 36);
    var right = width - pad;
    var y = pad;

    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    if (options.header) {
      ctx.fillStyle = "#e8eef6";
      ctx.font = dailyTrendFont(22, 700);
      ctx.fillText(options.title || "每日计分走势", left, y + 8);
      ctx.fillStyle = "#95a4b6";
      ctx.font = dailyTrendFont(13, 400);
      ctx.fillText(options.subtitle || "", left, y + 34);
      y += 54;
    }

    var legendBottom = options.showLegend && series.length > 1
      ? drawTrendLegend(ctx, series, width, left, right, y)
      : y;
    var plotTop = legendBottom + 10;
    var plotBottom = height - (options.header ? 44 : 30);
    if (!days.length || !series.length) {
      ctx.fillStyle = "#95a4b6";
      ctx.font = dailyTrendFont(13, 400);
      ctx.textAlign = "center";
      ctx.fillText("暂无数据", (left + right) / 2, (plotTop + plotBottom) / 2);
      return;
    }

    var maxValue = 0;
    series.forEach(function (item) {
      (item.values || []).forEach(function (value) {
        maxValue = Math.max(maxValue, Number(value || 0));
      });
    });
    if (maxValue <= 0) {
      ctx.fillStyle = "#95a4b6";
      ctx.font = dailyTrendFont(13, 400);
      ctx.textAlign = "center";
      ctx.fillText("暂无数据", (left + right) / 2, (plotTop + plotBottom) / 2);
      return;
    }

    var axis = dailyTrendAxis(maxValue);
    var tickCount = Math.round(axis.max / axis.step);
    var plotHeight = plotBottom - plotTop;
    ctx.font = dailyTrendFont(10, 400);
    for (var tick = 0; tick <= tickCount; tick += 1) {
      var value = tick * axis.step;
      var lineY = plotBottom - (value / axis.max) * plotHeight;
      ctx.strokeStyle = tick === 0 ? "rgba(255,255,255,.16)" : "rgba(255,255,255,.07)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(left, lineY + 0.5);
      ctx.lineTo(right, lineY + 0.5);
      ctx.stroke();
      ctx.fillStyle = "#657386";
      ctx.textAlign = "right";
      ctx.fillText(score(value), left - 7, lineY);
    }

    var slotWidth = (right - left) / days.length;
    var barWidth = series.length > 1
      ? Math.max(0.4, (slotWidth * 0.72) / series.length)
      : Math.max(0.6, Math.min(28, slotWidth * 0.62));
    var groupWidth = barWidth * series.length;
    var barGap = barWidth > 4 ? 1 : 0;
    days.forEach(function (day, index) {
      var centerX = left + slotWidth * (index + 0.5);
      var startX = centerX - groupWidth / 2;
      series.forEach(function (item, seriesIndex) {
        var value = Number((item.values || [])[index] || 0);
        if (value <= 0) return;
        var barHeight = (value / axis.max) * plotHeight;
        ctx.fillStyle = item.color || "#67a8ff";
        ctx.fillRect(startX + seriesIndex * barWidth, plotBottom - barHeight, Math.max(0.5, barWidth - barGap), barHeight);
      });
    });

    var labelStep = Math.max(1, Math.ceil(days.length / Math.max(2, Math.floor((right - left) / 54))));
    var labelOffset = (days.length - 1) % labelStep;
    ctx.font = dailyTrendFont(10, 400);
    ctx.fillStyle = "#657386";
    ctx.textAlign = "center";
    days.forEach(function (day, index) {
      if ((index - labelOffset) % labelStep !== 0) return;
      ctx.fillText(day.date.slice(5), left + slotWidth * (index + 0.5), plotBottom + 14);
    });
  }

  function dailyModalSubtitle(daily) {
    return daily.start + " 至 " + daily.end + " · 共 " + daily.days.length + " 天";
  }

  function dailyModalCombinedTitle() {
    return dailyModalView === "source" ? "四来源合成走势" : "六类计分来源合成走势";
  }

  function renderDailyModal() {
    var daily = dailyTrendData();
    var grid = $("dailyModalGrid");
    if (!grid) return;
    var isSource = dailyModalView === "source";
    $("dailyViewSourceBtn").classList.toggle("active", isSource);
    $("dailyViewCategoryBtn").classList.toggle("active", !isSource);

    if (!daily || !daily.days || !daily.days.length) {
      dailyModalSpecs = [];
      $("dailyModalSub").textContent = "全部时间 · 暂无数据";
      $("dailyCombinedTitle").textContent = dailyModalCombinedTitle();
      $("dailyCombinedSub").textContent = "暂无数据";
      grid.innerHTML = '<div class="empty">暂无计分数据</div>';
      var emptyCanvas = $("dailyCombinedChart");
      var emptyRect = emptyCanvas.parentElement.getBoundingClientRect();
      drawTrendChart(emptyCanvas, Math.max(280, Math.round(emptyRect.width)), Math.max(220, Math.round(emptyRect.height)), Math.min(2.5, window.devicePixelRatio || 1), {days: [], series: [], showLegend: false});
      return;
    }

    dailyModalSpecs = isSource ? dailySourceSpecs() : dailyCategorySpecs();
    $("dailyModalSub").textContent = dailyModalSubtitle(daily) + " · 总计 " + score(daily.total_score) + " 分";
    grid.innerHTML = dailyModalSpecs.map(function (spec, index) {
      return '<section class="daily-card">'
        + '<div class="daily-card-head"><div><div class="daily-card-title">' + esc(spec.label) + '</div><div class="daily-card-total">' + score(spec.total) + ' 分</div></div>'
        + '<button class="btn mini" type="button" data-daily-export="' + index + '">下载</button></div>'
        + '<div class="daily-card-canvas"><canvas data-daily-canvas="' + index + '" role="img" aria-label="' + esc(spec.label) + '每日走势图"></canvas></div>'
        + '</section>';
    }).join("");

    var dpr = Math.min(2.5, window.devicePixelRatio || 1);
    dailyModalSpecs.forEach(function (spec, index) {
      var canvas = grid.querySelector('[data-daily-canvas="' + index + '"]');
      if (!canvas) return;
      var rect = canvas.parentElement.getBoundingClientRect();
      drawTrendChart(canvas, Math.max(240, Math.round(rect.width)), Math.max(180, Math.round(rect.height)), dpr, {
        days: daily.days,
        series: [{label: spec.label, color: spec.color, values: spec.values}],
        showLegend: false
      });
    });

    $("dailyCombinedTitle").textContent = dailyModalCombinedTitle();
    $("dailyCombinedSub").textContent = (isSource ? "四来源每日对比" : "六类计分来源每日对比") + " · 可单独下载 PNG";
    var combinedCanvas = $("dailyCombinedChart");
    var combinedRect = combinedCanvas.parentElement.getBoundingClientRect();
    drawTrendChart(combinedCanvas, Math.max(280, Math.round(combinedRect.width)), Math.max(220, Math.round(combinedRect.height)), dpr, {
      days: daily.days,
      series: dailyModalSpecs.map(function (spec) {
        return {label: spec.label, color: spec.color, values: spec.values};
      }),
      showLegend: true
    });
  }

  function openDailyModal() {
    $("dailyModal").classList.remove("hidden");
    renderDailyModal();
  }

  function setDailyModalView(view) {
    dailyModalView = view === "category" ? "category" : "source";
    if (!$("dailyModal").classList.contains("hidden")) renderDailyModal();
  }

  function dailyExportFilename(label, suffix) {
    var safe = String(label || "走势").replace(/[\\/:*?"<>|]/g, "_");
    var daily = dailyTrendData();
    return "红蓝计分_每日走势_" + safe + (suffix || "") + "_" + (daily && daily.end ? daily.end : new Date().toISOString().slice(0, 10)) + ".png";
  }

  function savePngBlob(blob, filename, button, originalText) {
    if (button) {
      button.disabled = false;
      button.textContent = originalText;
    }
    if (!blob) { showToast("导出失败", true); return; }
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
    showToast("已保存 PNG");
  }

  function exportDailyCard(index) {
    var daily = dailyTrendData();
    var spec = dailyModalSpecs[index];
    if (!daily || !spec) return;
    var button = $("dailyModalGrid").querySelector('[data-daily-export="' + index + '"]');
    var originalText = button ? button.textContent : "";
    if (button) { button.disabled = true; button.textContent = "生成中…"; }
    try {
      var canvas = document.createElement("canvas");
      drawTrendChart(canvas, 1000, 440, 2, {
        header: true,
        title: spec.label,
        subtitle: dailyModalSubtitle(daily) + " · 总计 " + score(spec.total) + " 分",
        days: daily.days,
        series: [{label: spec.label, color: spec.color, values: spec.values}],
        showLegend: false
      });
      canvas.toBlob(function (blob) {
        savePngBlob(blob, dailyExportFilename(spec.label), button, originalText);
      }, "image/png");
    } catch (error) {
      if (button) { button.disabled = false; button.textContent = originalText; }
      showToast("导出失败", true);
    }
  }

  function exportDailyCombined() {
    var daily = dailyTrendData();
    if (!daily || !daily.days || !daily.days.length || !dailyModalSpecs.length) {
      showToast("暂无可导出的合成走势", true);
      return;
    }
    var button = $("exportDailyCombinedBtn");
    var originalText = button.textContent;
    button.disabled = true;
    button.textContent = "生成中…";
    try {
      var title = dailyModalCombinedTitle();
      var canvas = document.createElement("canvas");
      drawTrendChart(canvas, 1400, 620, 2, {
        header: true,
        title: title,
        subtitle: dailyModalSubtitle(daily) + " · 同一天多来源对比",
        days: daily.days,
        series: dailyModalSpecs.map(function (spec) {
          return {label: spec.label, color: spec.color, values: spec.values};
        }),
        showLegend: true
      });
      canvas.toBlob(function (blob) {
        savePngBlob(blob, dailyExportFilename(title), button, originalText);
      }, "image/png");
    } catch (error) {
      button.disabled = false;
      button.textContent = originalText;
      showToast("导出失败", true);
    }
  }

  function updateSelectAll() {
    var boxes = document.querySelectorAll("[data-select]");
    var all = boxes.length > 0 && Array.from(boxes).every(function (box) { return box.checked; });
    $("selectAll").checked = all;
  }

  async function showAiPrompt() {
    try {
      var result = await api("/api/redblue/ai/prompt");
      $("promptPath").textContent = result.path || "";
      $("promptText").textContent = result.text || "";
      $("promptModal").classList.remove("hidden");
    } catch (error) { showToast(error.message || "读取 Prompt 失败", true); }
  }

  function bindEvents() {
    $("loginBtn").addEventListener("click", doLogin);
    $("passwordInput").addEventListener("keydown", function (event) { if (event.key === "Enter") doLogin(); });
    $("logoutBtn").addEventListener("click", async function () {
      try {
        await fetch("/api/redblue/logout", {method: "POST", credentials: "same-origin", cache: "no-store"});
      } catch (error) {}
      location.reload();
    });
    $("refreshBtn").addEventListener("click", function () { loadData().catch(function () {}); });
    $("exportSummaryBtn").addEventListener("click", function () { exportImage("summary"); });
    $("exportDailyBtn").addEventListener("click", exportDailyTrend);
    $("openDailyModalBtn").addEventListener("click", openDailyModal);
    $("dailyViewSourceBtn").addEventListener("click", function () { setDailyModalView("source"); });
    $("dailyViewCategoryBtn").addEventListener("click", function () { setDailyModalView("category"); });
    $("exportDailyCombinedBtn").addEventListener("click", exportDailyCombined);
    $("dailyModalGrid").addEventListener("click", function (event) {
      var button = event.target.closest("[data-daily-export]");
      if (button) exportDailyCard(Number(button.getAttribute("data-daily-export")));
    });
    $("openFanModalBtn").addEventListener("click", openFanModal);
    $("fanMoreBar").addEventListener("click", openFanModal);
    $("exportEntriesBtn").addEventListener("click", function () { exportImage("entries"); });
    $("addManualBtn").addEventListener("click", function () { openEntryModal(null); });
    $("syncRoomLiveBtn").addEventListener("click", function () { syncRoomLive(false); });
    $("syncWeidianBtn").addEventListener("click", function () { syncWeidian(false); });
    $("aiResolveBtn").addEventListener("click", aiResolve);
    $("applySelectedAiBtn").addEventListener("click", function () { applyAi(""); });
    $("shipSelectedBtn").addEventListener("click", shipSelected);
    $("duplicateSelectedBtn").addEventListener("click", async function () {
      var ids = Array.from(selected);
      if (!ids.length) { showToast("请先选择条目", true); return; }
      for (var i = 0; i < ids.length; i++) { await duplicateEntry(ids[i], true); }
      showToast("已标记 " + ids.length + " 条重复");
    });
    ["sourceFilter","statusFilter","sortFilter","includeDuplicate","dateFrom","dateTo"].forEach(function (id) {
      $(id).addEventListener("change", function () { loadData().catch(function () {}); });
    });
    $("keywordInput").addEventListener("keydown", function (event) { if (event.key === "Enter") loadData().catch(function () {}); });
    window.addEventListener("resize", function () {
      clearTimeout(dailyTrendResizeTimer);
      dailyTrendResizeTimer = setTimeout(function () {
        if (!data) return;
        renderDailyTrend();
        if (!$("dailyModal").classList.contains("hidden")) renderDailyModal();
      }, 180);
    });
    $("saveEntryBtn").addEventListener("click", saveEntry);
    $("closeAiPanelBtn").addEventListener("click", function () { $("aiPanel").classList.add("hidden"); });
    $("viewPromptBtn").addEventListener("click", showAiPrompt);
    $("selectAll").addEventListener("change", function (event) {
      var checked = event.target.checked;
      document.querySelectorAll("[data-select]").forEach(function (box) {
        box.checked = checked;
        if (checked) selected.add(box.getAttribute("data-select")); else selected.delete(box.getAttribute("data-select"));
      });
    });
    $("confirmOkBtn").addEventListener("click", function () {
      var action = confirmAction; confirmAction = null;
      $("confirmModal").classList.add("hidden");
      if (action) action();
    });
    document.addEventListener("change", function (event) {
      var bonusSelect = event.target.closest("[data-business-bonus-select]");
      if (bonusSelect) {
        updateSelectedBusiness(bonusSelect.getAttribute("data-business-bonus-select"), bonusSelect.value, "selected_business_bonus");
        return;
      }
      var select = event.target.closest("[data-business-select]");
      if (select) updateSelectedBusiness(select.getAttribute("data-business-select"), select.value, "selected_business");
    });
    document.addEventListener("click", function (event) {
      var close = event.target.closest("[data-close]");
      if (close) { $(close.getAttribute("data-close")).classList.add("hidden"); return; }
      var select = event.target.closest("[data-select]");
      if (select) {
        var id = select.getAttribute("data-select");
        if (select.checked) selected.add(id); else selected.delete(id);
        updateSelectAll();
        return;
      }
      var edit = event.target.closest("[data-edit]");
      if (edit) {
        var entry = (data.entries || []).find(function (row) { return row.id === edit.getAttribute("data-edit"); });
        if (entry) openEntryModal(entry);
        return;
      }
      var dup = event.target.closest("[data-dup]");
      if (dup) {
        var row = (data.entries || []).find(function (item) { return item.id === dup.getAttribute("data-dup"); });
        if (row) duplicateEntry(row.id, !row.duplicate);
        return;
      }
      var del = event.target.closest("[data-delete]");
      if (del) { deleteEntry(del.getAttribute("data-delete")); return; }
      var biz = event.target.closest("[data-business]");
      if (biz) { toggleBusiness(biz.getAttribute("data-business"), biz.getAttribute("data-done") === "1"); return; }
      var aiApply = event.target.closest("[data-ai-apply]");
      if (aiApply) { applyAi(aiApply.getAttribute("data-ai-apply")); return; }
      var ship = event.target.closest("[data-ship]");
      if (ship) { shipOne(ship.getAttribute("data-ship")); return; }
    });
  }

  async function doLogin() {
    var value = $("passwordInput").value.trim();
    if (!value) { loginError.textContent = "请输入密码"; loginError.classList.add("show"); return; }
    $("loginBtn").disabled = true;
    loginError.classList.remove("show");
    try {
      var response = await fetch("/api/redblue/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({password: value}),
        credentials: "same-origin",
        cache: "no-store"
      });
      if (!response.ok) {
        var body = await response.json().catch(function () { return {}; });
        throw new Error(body.detail || "密码错误");
      }
      $("passwordInput").value = "";
      loginError.classList.remove("show");
      showApp();
      await loadData();
      startAutoSync();
    } catch (error) {
      if (page.classList.contains("ready")) {
        showToast(error.message || "加载失败", true);
      } else {
        loginError.textContent = error.message || "密码错误";
        loginError.classList.add("show");
      }
    } finally { $("loginBtn").disabled = false; }
  }

  async function boot() {
    sessionStorage.removeItem(LEGACY_PASSWORD_KEY);
    localStorage.removeItem(LEGACY_PASSWORD_KEY);
    var verified = false;
    try {
      var response = await fetch("/api/redblue/verify", {credentials: "same-origin", cache: "no-store"});
      verified = response.ok;
    } catch (error) {}
    if (!verified) { showLogin(""); return; }
    showApp();
    try {
      await loadData();
      startAutoSync();
    } catch (error) {
      showToast(error.message || "加载失败", true);
    }
  }

  bindEvents();
  boot();
})();
</script>
</body>
</html>
